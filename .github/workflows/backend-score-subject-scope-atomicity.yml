name: Backend score subject scope and batch atomicity

on:
  push:
    branches: [master]
    paths:
      - "backend/src/routes/scores.ts"
      - "backend/src/utils/grades.ts"
      - "tests/backend-grades.test.mts"
      - "backend/src/utils/grades.ts"
      - "backend/src/middleware/auth.ts"
      - "backend/src/utils/authClaims.ts"
      - "tests/backend-score-subject-scope-atomicity.integration.test.mts"
      - "tests/backend-grades.test.mts"
      - ".github/workflows/backend-score-subject-scope-atomicity.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/src/routes/scores.ts"
      - "backend/src/middleware/auth.ts"
      - "backend/src/utils/authClaims.ts"
      - "tests/backend-score-subject-scope-atomicity.integration.test.mts"
      - ".github/workflows/backend-score-subject-scope-atomicity.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  score-subject-scope:
    name: PostgreSQL score authorization and transaction regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sts_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Bootstrap disposable PostgreSQL schema
        run: npm run db:bootstrap --workspace=backend
      - name: Run score authorization and transaction regressions
        run: node --import tsx --test tests/backend-score-subject-scope-atomicity.integration.test.mts
      - name: Test deterministic grade boundaries and report remarks
        run: node --import tsx --test tests/backend-grades.test.mts
      - name: Typecheck backend
        run: ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
