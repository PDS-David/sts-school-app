name: Backend sensitive audit integrity

on:
  pull_request:
    branches: [master, 'agent/**']
    paths:
      - "backend/schema.sql"
      - "backend/src/utils/audit.ts"
      - "tests/backend-sensitive-audit.integration.test.mts"
      - ".github/workflows/backend-sensitive-audit.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit-integrity:
    name: PostgreSQL audit integrity, redaction and append-only guarantees
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sts_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Bootstrap disposable PostgreSQL schema
        run: npm run db:bootstrap --workspace=backend
      - name: Run audit integrity regressions
        run: node --import tsx --test tests/backend-sensitive-audit.integration.test.mts
      - name: Typecheck backend
        run: ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
