name: Backend backup restore schema safeguards

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/src/db/restoreBackup.ts"
      - "backend/src/utils/backup.ts"
      - "tests/backup-restore.integration.test.mts"
      - "tests/backup.test.mts"
      - ".github/workflows/backend-backup-restore.yml"

permissions:
  contents: read

jobs:
  backup-restore:
    name: PostgreSQL backup restore safety regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sts_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Bootstrap disposable PostgreSQL schema
        run: npm run db:bootstrap --workspace=backend
      - name: Run backup format and restore safety tests
        run: |
          node --import tsx --test tests/backup.test.mts
          node --import tsx --test tests/backup-restore.integration.test.mts
      - name: Typecheck backend
        run: ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
