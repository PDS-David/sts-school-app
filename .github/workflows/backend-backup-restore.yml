name: Backend backup restore schema safeguards

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/src/db/restoreBackup.ts"
      - "backend/src/db/resetAcademicData.ts"
      - "backend/src/utils/backup.ts"
      - "backend/schema.sql"
      - "backend/migrations/0022_report_roster_progression_decisions.sql"
      - "tests/backup-restore.integration.test.mts"
      - "tests/backup-restore-progression.integration.test.mts"
      - "tests/academic-reset-progression.integration.test.mts"
      - "tests/backup.test.mts"
      - ".github/workflows/backend-backup-restore.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backup-restore:
    name: PostgreSQL backup restore safety regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sts_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Bootstrap disposable PostgreSQL schema
        run: npm run db:bootstrap --workspace=backend
      # Run the database test files one at a time: each restores into the same
      # disposable database, so they must not overlap.
      - name: Run backup format and restore safety tests
        run: |
          node --import tsx --test tests/backup.test.mts
          node --import tsx --test tests/backup-restore.integration.test.mts
      - name: Run progression-decision backup and restore tests
        run: node --import tsx --test tests/backup-restore-progression.integration.test.mts
      - name: Run academic-data reset progression safeguards
        run: node --import tsx --test tests/academic-reset-progression.integration.test.mts
      - name: Typecheck backend
        run: ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
