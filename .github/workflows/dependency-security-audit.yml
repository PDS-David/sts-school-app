name: Dependency security audit

on:
  pull_request:
    branches: [master]
    paths:
      - "package.json"
      - "package-lock.json"
      - "backend/package.json"
      - "backend/package-lock.json"
      - ".github/workflows/dependency-security-audit.yml"

permissions:
  contents: write

jobs:
  npm-audit:
    name: Report locked dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch for lockfile updates
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile dependency manifests
        run: npm install --ignore-scripts
      - name: Verify reproducible lockfile installation
        run: npm ci --ignore-scripts
      - name: Apply non-breaking npm audit fixes and commit lockfile
        shell: bash
        run: |
          set +e
          npm audit fix
          audit_fix_status=$?
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): apply non-breaking npm audit fixes"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
          exit "$audit_fix_status"
      - name: Audit locked dependencies and print exact advisories
        if: always()
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || audit_status=$?
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('Vulnerability totals:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(`\n${item.severity.toUpperCase()} ${name} range=${item.range} direct=${item.isDirect} fix=${JSON.stringify(item.fixAvailable)}`);
            for (const advisory of item.via ?? []) {
              if (typeof advisory === 'string') console.log(`  via dependency: ${advisory}`);
              else console.log(`  advisory: ${advisory.title} | ${advisory.url} | range=${advisory.range} | CVSS=${advisory.cvss?.score ?? 'n/a'}`);
            }
            console.log(`  paths: ${(item.nodes ?? []).join(', ')}`);
          }
          NODE
          exit "${audit_status:-0}"
      - name: Gate backend production dependencies
        if: always()
        run: npm audit --workspace=backend --omit=dev --audit-level=high
      - name: Build backend after dependency upgrades
        if: always()
        run: npm run build --workspace=backend
      - name: Upload refreshed lockfile and audit-fix log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-refresh
          path: package-lock.json
          if-no-files-found: error
