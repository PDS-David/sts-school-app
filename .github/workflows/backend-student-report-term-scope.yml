name: Backend student report term scope

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/src/routes/scores.ts"
      - "backend/src/routes/attendance.ts"
      - "backend/src/utils/scope.ts"
      - "tests/backend-student-report-term-scope.integration.test.mts"
      - ".github/workflows/backend-student-report-term-scope.yml"

permissions:
  contents: read

jobs:
  student-report-term-scope:
    name: PostgreSQL student report term-scope regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sts_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Bootstrap disposable PostgreSQL schema
        run: npm run db:bootstrap --workspace=backend
      - name: Run student report term-scope regressions
        run: node --import tsx --test tests/backend-student-report-term-scope.integration.test.mts
      - name: Typecheck backend
        run: ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
