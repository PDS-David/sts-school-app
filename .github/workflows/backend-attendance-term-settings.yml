name: Backend attendance and term settings safety

# Deliberately NO `branches:` filter on pull_request. The older term and
# attendance workflows only run for PRs whose base is `master`, so a PR stacked
# on another feature branch (such as the follow-up to #1060) was never tested.
# Path filters only decide WHEN this runs; the explicit commands below decide
# WHAT runs, and every test file is named on the command line.
on:
  pull_request:
    paths:
      - "backend/src/routes/academic.ts"
      - "backend/src/routes/attendance.ts"
      - "backend/src/utils/attendanceWrites.ts"
      - "backend/src/utils/termSettings.ts"
      - "backend/src/utils/scope.ts"
      - "backend/src/utils/audit.ts"
      - "backend/schema.sql"
      - "backend/migrations/**"
      - "mobile/src/utils/termSettings.ts"
      - "mobile/src/screens/AttendanceScreen.tsx"
      - "tests/backend-attendance-term-settings-safety.integration.test.mts"
      - "tests/backend-teacher-term-settings.integration.test.mts"
      - "tests/term-settings-validation.test.mts"
      - ".github/workflows/backend-attendance-term-settings.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  attendance-term-settings:
    name: PostgreSQL attendance and term settings safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sts_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Bootstrap disposable PostgreSQL schema
        run: npm run db:bootstrap --workspace=backend
      - name: Apply numbered migrations
        run: npm run db:migrate --workspace=backend
      - name: Run shared client/server term-setting validation tests
        run: node --import tsx --test tests/term-settings-validation.test.mts
      # --test-concurrency=1: these files share one database and several flip
      # is_current / class locks, so they must not run in parallel processes.
      - name: Run attendance and term settings integration tests
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/backend-attendance-term-settings-safety.integration.test.mts
          tests/backend-teacher-term-settings.integration.test.mts
          tests/backend-term-session-atomicity.integration.test.mts
          tests/backend-term-school-isolation.integration.test.mts
          tests/backend-attendance-bulk.integration.test.mts
          tests/backend-attendance-report-scope.integration.test.mts
      - name: Typecheck backend
        run: ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
