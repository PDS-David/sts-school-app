name: Physical report-roster workbook import validation

on:
  pull_request:
    paths:
      - 'backend/src/db/physicalRosterWorkbook.ts'
      - 'backend/src/db/importPhysicalReportRoster.ts'
      - 'backend/package.json'
      - 'tests/physical-roster-workbook.test.mts'
      - '.github/workflows/physical-roster-import.yml'
  push:
    branches:
      - master
      - 'agent/**'
    paths:
      - 'backend/src/db/physicalRosterWorkbook.ts'
      - 'backend/src/db/importPhysicalReportRoster.ts'
      - 'backend/package.json'
      - 'tests/physical-roster-workbook.test.mts'
      - '.github/workflows/physical-roster-import.yml'

permissions:
  contents: read

concurrency:
  group: physical-roster-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate historical roster workbook parser and importer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Test workbook parsing and class mapping
        run: node --import tsx --test tests/physical-roster-workbook.test.mts
      - name: Build backend TypeScript
        run: npm run build --workspace=backend
