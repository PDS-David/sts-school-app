name: Physical report-roster workbook import validation

on:
  pull_request:
    paths:
      - 'backend/src/db/physicalRosterWorkbook.ts'
      - 'backend/src/db/importPhysicalReportRoster.ts'
      - 'backend/src/db/studentClassListWorkbook.ts'
      - 'backend/src/routes/adminRosterImport.ts'
      - 'backend/Student_Class_List.xlsx'
      - 'tests/student-class-list-workbook.test.mts'
      - 'backend/package.json'
      - 'tests/physical-roster-workbook.test.mts'
      - 'tests/physical-roster-import-readonly.integration.test.mts'
      - '.github/workflows/physical-roster-import.yml'
  push:
    branches:
      - master
      - 'agent/**'
    paths:
      - 'backend/src/db/physicalRosterWorkbook.ts'
      - 'backend/src/db/importPhysicalReportRoster.ts'
      - 'backend/package.json'
      - 'tests/physical-roster-workbook.test.mts'
      - 'tests/physical-roster-import-readonly.integration.test.mts'
      - '.github/workflows/physical-roster-import.yml'

permissions:
  contents: read

concurrency:
  group: physical-roster-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate historical roster workbook parser and importer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts_school_db_2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_school_db_2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sts_school_db_2
      DATABASE_SSL: "false"
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Validate the approved 104-student physical class list and mappings
        run: node --import tsx --test tests/student-class-list-workbook.test.mts
      - name: Test workbook parsing and class mapping
        run: node --import tsx --test tests/physical-roster-workbook.test.mts
      - name: Exercise importer read-only dry-run, atomic apply and idempotence against disposable PostgreSQL 18
        run: node --import tsx --test tests/physical-roster-import-readonly.integration.test.mts
      - name: Build backend TypeScript
        run: npm run build --workspace=backend
