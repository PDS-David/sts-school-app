name: Build SS1 French mobile listening release

on:
  push:
    branches: [master]
    paths:
      - "mobile/src/screens/FrenchListeningScreen.tsx"
      - "mobile/assets/french/**"
      - "mobile/package.json"
      - "mobile/app.json"
      - "mobile/eas.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-production:
    name: Build Android production app with French offline audio
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out master
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts

      - name: Verify Metro can bundle the offline French MP3 assets
        working-directory: mobile
        run: npx expo export --platform android --output-dir /tmp/ss1-french-mobile-export

      - name: Require Expo build credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub repository secret EXPO_TOKEN is not configured. Add an Expo access token as EXPO_TOKEN, then rerun this workflow."
            exit 1
          fi

      - name: Build Android production app (not submitted to Play Store)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile production --non-interactive --wait
