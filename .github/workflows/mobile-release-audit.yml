name: Mobile release and dependency audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency security and SDK compatibility audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Capture current dependency audit
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/npm-audit-all.json || true
          npm audit --omit=dev --json > artifacts/npm-audit-production.json || true
          npm audit fix --dry-run --json > artifacts/npm-audit-fix-plan.json || true
          npm ls expo @expo/cli expo-sharing expo-splash-screen glob image-size minimatch zod --all --json > artifacts/audit-dependency-tree.json || true
      - name: Evaluate Expo SDK 57 dependency candidate
        working-directory: mobile
        run: npx expo install expo@^57.0.0 --fix
      - name: Validate SDK 57 candidate
        run: |
          npx expo-doctor@latest > artifacts/expo-doctor-sdk57.txt 2>&1 || true
          npm run test:mobile:offline
          npm run test:mobile:frontend-contracts
          npx tsc --noEmit -p mobile/tsconfig.json
          npm audit --json > artifacts/npm-audit-sdk57.json || true
          npm audit --omit=dev --json > artifacts/npm-audit-sdk57-production.json || true
          npm ls expo @expo/cli expo-sharing expo-splash-screen glob image-size minimatch zod --all --json > artifacts/audit-dependency-tree-sdk57.json || true
          git diff --binary -- mobile/package.json package-lock.json > artifacts/expo-sdk57-upgrade.patch
          mkdir -p artifacts/expo-sdk57-candidate
          cp mobile/package.json artifacts/expo-sdk57-candidate/mobile-package.json
          cp package-lock.json artifacts/expo-sdk57-candidate/package-lock.json
          cp mobile/app.config.js artifacts/expo-sdk57-candidate/app.config.js
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dependency-audit-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
