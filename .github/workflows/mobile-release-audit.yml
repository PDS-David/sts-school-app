name: Mobile release and dependency audit
# Teacher rollout: build an installable production-connected APK via the preview profile.

on:
  push:
    branches:
      - "agent/mobile-release-audit-*"
      - "agent/mobile-audit-and-db-readiness-fixes-*"
    paths:
      - ".github/workflows/mobile-release-audit.yml"
      - ".github/scripts/android-emulator-smoke.sh"
      - "mobile/**"
      - "package.json"
      - "package-lock.json"
      - "tests/mobile/**"
  pull_request:
    paths:
      - ".github/workflows/mobile-release-audit.yml"
      - ".github/scripts/android-emulator-smoke.sh"
      - "mobile/**"
      - "package.json"
      - "package-lock.json"
      - "tests/mobile/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-release-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-audit-build:
    name: Mobile validation, npm audit and Android release builds
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Offline queue regression tests
        run: npm run test:mobile:offline
      - name: Frontend contract regression tests
        run: npm run test:mobile:frontend-contracts
      - name: Mobile TypeScript validation
        working-directory: mobile
        run: npx tsc --noEmit -p tsconfig.json
      - name: Export Android JavaScript bundle
        working-directory: mobile
        env:
          CI: "1"
        run: npx expo export --platform android --output-dir ../artifacts/mobile-android
      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-35;google_apis;x86_64'
      - name: Generate Android native project
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive
      - name: Build installable Android debug APK
        timeout-minutes: 25
        working-directory: mobile/android
        run: ./gradlew --no-daemon --console=plain --stacktrace assembleDebug
      - name: Install and launch APK on Android emulator
        id: emulator-smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: bash .github/scripts/android-emulator-smoke.sh
      - name: Build production-connected internal teacher APK with EAS
        if: (github.event_name == 'push' || startsWith(github.event.pull_request.head.ref, 'agent/mobile-release-audit-')) && env.EXPO_TOKEN != ''
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --json > artifacts/eas-preview-teacher-apk.json
      - name: Capture complete dependency audit
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/npm-audit-all.json || true
          npm audit --omit=dev --json > artifacts/npm-audit-production.json || true
          npm audit fix --dry-run --json > artifacts/npm-audit-fix-plan.json || true
          npm ls expo @expo/cli expo-sharing expo-splash-screen glob image-size minimatch zod --all --json > artifacts/audit-dependency-tree.json || true
      - name: Evaluate Expo SDK 57 dependency alignment
        working-directory: mobile
        run: npx expo install expo@^57.0.0 --fix
      - name: Validate Expo SDK 57 candidate
        run: |
          mkdir -p artifacts
          npx expo-doctor@latest > artifacts/expo-doctor-sdk57.txt 2>&1 || true
          npm run test:mobile:offline
          npm run test:mobile:frontend-contracts
          npx tsc --noEmit -p mobile/tsconfig.json
          npm audit --json > artifacts/npm-audit-sdk57.json || true
          npm audit --omit=dev --json > artifacts/npm-audit-sdk57-production.json || true
          npm ls expo @expo/cli expo-sharing expo-splash-screen glob image-size minimatch zod --all --json > artifacts/audit-dependency-tree-sdk57.json || true
          git diff --binary -- mobile/package.json package-lock.json > artifacts/expo-sdk57-upgrade.patch
          mkdir -p artifacts/expo-sdk57-candidate
          cp mobile/package.json artifacts/expo-sdk57-candidate/mobile-package.json
          cp package-lock.json artifacts/expo-sdk57-candidate/package-lock.json
          cp mobile/app.config.js artifacts/expo-sdk57-candidate/app.config.js
      - name: Export Android bundle for SDK 57 candidate
        working-directory: mobile
        env:
          CI: "1"
        run: npx expo export --platform android --output-dir ../artifacts/mobile-android-sdk57
      - name: Build staging Android APK with EAS
        if: github.event_name == 'push' && env.EXPO_TOKEN != ''
        run: npx eas-cli@latest build --platform android --profile staging --non-interactive --json > artifacts/eas-staging-apk.json
      - name: Build production Android AAB with EAS
        if: github.event_name == 'push' && env.EXPO_TOKEN != ''
        run: npx eas-cli@latest build --platform android --profile production --non-interactive --json > artifacts/eas-production-aab.json
      - name: Record unavailable EAS credentials
        if: github.event_name == 'push' && env.EXPO_TOKEN == ''
        run: echo "EAS builds were not started because the repository EXPO_TOKEN secret is not configured." > artifacts/eas-build-blocker.txt
      - name: Upload audit, bundle and EAS build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-audit-evidence
          path: |
            artifacts/
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Fail workflow when Android emulator smoke test fails
        if: always()
        run: |
          if [ "${{ steps.emulator-smoke.outcome }}" != "success" ]; then
            echo "Android emulator smoke test failed; see the emulator step and uploaded logcat artifact."
            exit 1
          fi
