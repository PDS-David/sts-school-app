name: EAS teacher and production release

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Choose the signed Android artifact to build"
        required: true
        type: choice
        options:
          - teacher-apk
          - production-aab
        default: teacher-apk

permissions:
  contents: read

concurrency:
  group: eas-android-release-${{ inputs.build_target || 'teacher-apk' }}
  cancel-in-progress: false

jobs:
  eas-build:
    name: Build signed Android release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_TARGET: ${{ inputs.build_target || 'teacher-apk' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Expo config plugins (for example expo-sharing) must be installed before
      # EAS project:info loads the dynamic app configuration.
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Verify existing Expo credentials
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not available to this workflow. No build was started."
            exit 1
          fi
          npx eas-cli@latest whoami
      - name: Verify access to the linked EAS project
        working-directory: mobile
        run: npx eas-cli@latest project:info
      - name: Prepare build receipt directory
        run: mkdir -p artifacts
      - name: Build production-connected internal teacher APK
        if: env.BUILD_TARGET == 'teacher-apk'
        working-directory: mobile
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > ../artifacts/eas-teacher-apk.json
      - name: Build production Android App Bundle
        if: env.BUILD_TARGET == 'production-aab'
        working-directory: mobile
        run: npx eas-cli@latest build --platform android --profile production --non-interactive --wait --json > ../artifacts/eas-production-aab.json
      - name: Upload EAS build receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-${{ env.BUILD_TARGET }}-receipt
          path: artifacts/eas-*.json
          if-no-files-found: warn
          retention-days: 30
