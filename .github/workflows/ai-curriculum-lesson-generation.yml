name: AI curriculum lesson generation
on:
  push:
    branches: [master]
    paths:
      - "backend/src/services/curriculumLessonGenerator.ts"
      - "backend/src/services/curriculumLessonCache.ts"
      - "backend/src/routes/learning.ts"
      - "mobile/src/screens/TopicDetailScreen.tsx"
      - "mobile/src/screens/Ss1PackageLessonScreen.tsx"
      - "mobile/src/screens/Ss23PackageLessonScreen.tsx"
      - "backend/migrations/0007_curriculum_generated_lessons.sql"
      - "backend/src/routes/admin.ts"
      - "backend/src/middleware/auth.ts"
      - "backend/src/utils/learningAccessPolicy.ts"
      - "backend/src/types/index.ts"
      - "backend/migrations/0008_learning_access_settings.sql"
      - "tests/learning-access-policy.test.mts"
      - "backend/schema.sql"
      - "tests/backend-curriculum-lesson-generator.test.mts"
      - "tests/backend-curriculum-lesson-flow.static.test.cjs"
      - "tests/student-launch.static.test.cjs"
      - "tests/jss3-supplement-revision.db.test.mts"
      - ".github/workflows/ai-curriculum-lesson-generation.yml"
      - "backend/src/utils/ai.ts"
  pull_request:
    branches: [master]
    paths:
      - "backend/src/services/curriculumLessonGenerator.ts"
      - "backend/src/services/curriculumLessonCache.ts"
      - "backend/src/routes/learning.ts"
      - "mobile/src/screens/TopicDetailScreen.tsx"
      - "mobile/src/screens/Ss1PackageLessonScreen.tsx"
      - "mobile/src/screens/Ss23PackageLessonScreen.tsx"
      - "backend/migrations/0007_curriculum_generated_lessons.sql"
      - "backend/src/routes/admin.ts"
      - "backend/src/middleware/auth.ts"
      - "backend/src/utils/learningAccessPolicy.ts"
      - "backend/src/types/index.ts"
      - "backend/migrations/0008_learning_access_settings.sql"
      - "tests/learning-access-policy.test.mts"
      - "backend/schema.sql"
      - "tests/backend-curriculum-lesson-generator.test.mts"
      - "tests/backend-curriculum-lesson-flow.static.test.cjs"
      - "tests/student-launch.static.test.cjs"
      - "tests/jss3-supplement-revision.db.test.mts"
      - ".github/workflows/ai-curriculum-lesson-generation.yml"
      - "backend/src/utils/ai.ts"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate-curriculum-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jss3_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jss3_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate generated lesson contract
        run: node --import tsx --test tests/backend-curriculum-lesson-generator.test.mts
      - name: Validate curriculum lesson flow and free-launch regressions
        run: node --test tests/backend-curriculum-lesson-flow.static.test.cjs tests/student-launch.static.test.cjs
      - name: Validate global learning access policy
        run: node --import tsx --test tests/learning-access-policy.test.mts
      - name: Verify corrected-topic generation and cache against PostgreSQL
        env:
          JSS3_YO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jss3_test_ci
        run: node --import tsx --test tests/jss3-supplement-revision.db.test.mts
      - name: Verify fresh-install and incremental migration ledger with PostgreSQL
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jss3_test_ci
        run: node --import tsx --test tests/migration-ledger.db.test.mts
      - name: Typecheck backend and mobile
        run: npm run typecheck
