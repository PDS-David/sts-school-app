name: Android mobile readiness

on:
  push:
    branches:
      - master
      - "agent/mobile-android-readiness-*"
    paths:
      - "mobile/**"
      - "config/apiTarget.js"
      - "config/apiTarget.test.js"
      - "tests/mobile/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-android-readiness.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "config/apiTarget.js"
      - "config/apiTarget.test.js"
      - "tests/mobile/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-android-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-checks:
    name: Mobile tests, types and Android bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Offline outbox regression tests
        run: npm run test:mobile:offline
      - name: Frontend navigation and recovery contract tests
        run: npm run test:mobile:frontend-contracts
      - name: Validate mobile TypeScript
        working-directory: mobile
        run: npx tsc --noEmit -p tsconfig.json
      - name: Export Android JavaScript bundle
        working-directory: mobile
        env:
          CI: "1"
        run: npx expo export --platform android --output-dir ../artifacts/mobile-android
      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Generate Android native project
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive
      - name: Build installable Android debug APK
        timeout-minutes: 25
        working-directory: mobile/android
        run: ./gradlew --no-daemon --console=plain assembleDebug
      - name: Upload Android bundle and installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-debug-build
          path: |
            artifacts/mobile-android/
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
