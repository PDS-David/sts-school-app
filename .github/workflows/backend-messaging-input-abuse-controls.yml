name: Backend messaging input and abuse controls

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/src/routes/messages.ts"
      - "backend/src/utils/redisRateLimitStore.ts"
      - "backend/src/utils/postgresRateLimitStore.ts"
      - "backend/src/db/migrate.ts"
      - "backend/schema.sql"
      - "backend/migrations/0003_rate_limit_counters.sql"
      - "tests/backend-messaging-input-abuse-controls.integration.test.mts"
      - ".github/workflows/backend-messaging-input-abuse-controls.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  messaging-controls:
    name: PostgreSQL messaging validation and rate-limit regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sts_test
      RATE_LIMIT_REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Bootstrap disposable PostgreSQL schema
        run: npm run db:bootstrap --workspace=backend
      - name: Apply numbered migrations to disposable PostgreSQL schema
        run: npm run db:migrate --workspace=backend -- --all
      - name: Run messaging input and abuse-control regressions
        run: node --import tsx --test tests/backend-messaging-input-abuse-controls.integration.test.mts
      - name: Typecheck backend
        run: ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
