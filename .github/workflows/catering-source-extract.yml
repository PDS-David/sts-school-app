name: Catering Craft private source extraction
on:
  push:
    branches:
      - agent/catering-craft-implementation
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and verify assigned Catering Craft sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cc-extract
          ARCHIVE=docs/ss1/sources/SSS1-original.zip
          echo "archive_sha256_expected=024487129a86c3a89e55293b3ad71b0dfe8b8969ea55bbc64dbfdc17565c9a3e" > /tmp/cc-extract/verification.txt
          echo "archive_sha256_observed=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" >> /tmp/cc-extract/verification.txt
          test "$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" = "024487129a86c3a89e55293b3ad71b0dfe8b8969ea55bbc64dbfdc17565c9a3e"
          unzip -p "$ARCHIVE" "SSS 1/2nd Term SS1_/2ND TERM S1 CATERING CRAFT PRACTICES.doc" > /tmp/cc-extract/term2.doc
          unzip -p "$ARCHIVE" "SSS 1/3rd Term SS1_/3RD TERM S1 CATERING CRAFT PRACTICES.doc" > /tmp/cc-extract/term3.doc
          test "$(sha256sum /tmp/cc-extract/term2.doc | cut -d' ' -f1)" = "fd8115ff99dd3c370b86b4b5a326fe647e49328bc83f2d041c73f29b1b84ad59"
          test "$(sha256sum /tmp/cc-extract/term3.doc | cut -d' ' -f1)" = "a2de209dab8d7b6a88c4e44ad3746c349db5b953d805c47457fa9185ab6e7d3e"
          npm install --no-save --package-lock=false word-extractor@1.0.4
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const WordExtractor = require('word-extractor');
          (async () => {
            const extractor = new WordExtractor();
            const inputs = [
              ['/tmp/cc-extract/term2.doc', '/tmp/cc-extract/term2.txt', '371aa91970bceb96c354a002a3ac7a5384ca597c1c2f404f51f13096b7324c8a'],
              ['/tmp/cc-extract/term3.doc', '/tmp/cc-extract/term3.txt', 'b3499393aa9c5958398d008115ef024d58f039f85978d7d4460e03449fdac666'],
            ];
            for (const [input, output, expected] of inputs) {
              const document = await extractor.extract(input);
              const body = document.getBody();
              const actual = crypto.createHash('sha256').update(body, 'utf8').digest('hex');
              if (actual !== expected) throw new Error(input + ' getBody hash mismatch: ' + actual);
              fs.writeFileSync(output, body, 'utf8');
              fs.appendFileSync('/tmp/cc-extract/verification.txt', input + ' getBody_sha256=' + actual + '\n');
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Render source documents for structure inspection
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer
          mkdir -p /tmp/cc-extract/pdf
          libreoffice --headless --convert-to pdf --outdir /tmp/cc-extract/pdf /tmp/cc-extract/term2.doc /tmp/cc-extract/term3.doc
      - name: Extract and verify the original embedded tablecloth photograph
        run: |
          python -m pip install --quiet olefile Pillow
          python <<'PY'
          import hashlib
          from io import BytesIO
          from pathlib import Path
          import olefile
          from PIL import Image
          doc = '/tmp/cc-extract/term3.doc'
          ole = olefile.OleFileIO(doc)
          data = ole.openstream('Data').read()
          stream_hash = hashlib.sha256(data).hexdigest()
          expected_stream = '7a64c327035440c83ebc4161eeb45986692650cc3247a002ab17b171b71da991'
          assert len(data) == 379993 and stream_hash == expected_stream, (len(data), stream_hash)
          start = 261
          assert data[start:start+2] == b'\\xff\\xd8'
          end = data.find(b'\\xff\\xd9', start)
          assert end > start
          jpeg = data[start:end+2]
          image_hash = hashlib.sha256(jpeg).hexdigest()
          expected_image = 'd48e6dcd9d9ba066355b9f0fc8d16f75f29d284a02a7cfabbb720acae67ea728'
          assert image_hash == expected_image, image_hash
          image = Image.open(BytesIO(jpeg))
          image.verify()
          image = Image.open(BytesIO(jpeg))
          assert image.size == (1102, 748), image.size
          Path('/tmp/cc-extract/tablecloth-source.jpg').write_bytes(jpeg)
          with open('/tmp/cc-extract/verification.txt', 'a') as f:
              f.write(f'Data_stream_sha256={stream_hash}\\n')
              f.write(f'tablecloth_jpeg_sha256={image_hash}\\n')
              f.write(f'tablecloth_dimensions={image.size[0]}x{image.size[1]}\\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catering-craft-private-source-extract
          path: |
            /tmp/cc-extract/verification.txt
            /tmp/cc-extract/term2.txt
            /tmp/cc-extract/term3.txt
            /tmp/cc-extract/tablecloth-source.jpg
            /tmp/cc-extract/pdf/*.pdf
          retention-days: 1
          if-no-files-found: error
