name: Backend SS23 student delivery

on:
  pull_request:
    paths:
      - "backend/src/routes/learning.ts"
      - "backend/src/db/ss23/**"
      - "tests/backend-ss23-student-delivery.integration.test.mts"
      - ".github/workflows/backend-ss23-student-delivery.yml"
  push:
    branches: [master]
    paths:
      - "backend/src/routes/learning.ts"
      - "backend/src/db/ss23/**"
      - "tests/backend-ss23-student-delivery.integration.test.mts"
      - ".github/workflows/backend-ss23-student-delivery.yml"

permissions:
  contents: read

concurrency:
  group: \${{ github.workflow }}-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: \${{ github.event_name == 'pull_request' }}

jobs:
  ss23-student-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sts_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Bootstrap disposable PostgreSQL schema
        run: npm run db:bootstrap --workspace=backend
      - name: Verify SS2/SS3 student routes fail closed for pending content
        run: node --import tsx --test tests/backend-ss23-student-delivery.integration.test.mts
      - name: Typecheck backend
        run: ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
