name: Generate SS1 French dialogue audio

on:
  push:
    branches: [master]
    paths:
      - "mobile/scripts/generate_french_dialogue_audio.py"
      - ".github/workflows/generate-french-dialogue-audio.yml"

permissions:
  contents: write

concurrency:
  group: ss1-french-dialogue-audio
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and commit French dialogue MP3 assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Piper and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install piper-tts==1.8.0

      - name: Generate standard and slow French recordings
        run: python mobile/scripts/generate_french_dialogue_audio.py

      - name: Commit generated audio assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/assets/french/SS1_French_Dialogue_standard.mp3 mobile/assets/french/SS1_French_Dialogue_slow.mp3
          if git diff --cached --quiet; then
            echo "Generated assets are unchanged."
            exit 0
          fi

          git commit -m "chore(french): add generated listening dialogue audio"

          # Master may move while the TTS model is downloading and rendering.
          # Rebase the asset-only commit onto the newest master before pushing.
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push raced with another master update (attempt $attempt); retrying."
            sleep 2
          done

          echo "Could not push generated French audio after three retries."
          exit 1
