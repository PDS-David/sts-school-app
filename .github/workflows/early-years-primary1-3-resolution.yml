name: Early Years and Primary 1–3 Resolution Tests

on:
  push:
    branches:
      - curriculum/early-years-primary1-3-completion
    paths:
      - 'backend/src/db/ingestTopics.ts'
      - 'backend/src/db/primaryCurriculumResolutions.ts'
      - 'tests/early-years-primary1-3-resolution.test.mts'
      - 'backend/package.json'
      - '.github/workflows/early-years-primary1-3-resolution.yml'
  pull_request:
    paths:
      - 'backend/src/db/ingestTopics.ts'
      - 'backend/src/db/primaryCurriculumResolutions.ts'
      - 'tests/early-years-primary1-3-resolution.test.mts'
      - 'backend/package.json'
      - '.github/workflows/early-years-primary1-3-resolution.yml'
  workflow_dispatch:

jobs:
  verify-class-resolution:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --prefix backend
      - name: Run Early Years and Primary 1–3 resolver tests
        working-directory: backend
        run: node --import tsx --test ../tests/early-years-primary1-3-resolution.test.mts
