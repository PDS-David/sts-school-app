name: JSS3 implementation and asset checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: sts_jss3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_jss3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Python visual and baseline tools
        run: python3 -m pip install -r scripts/jss3/acceptance-requirements.txt
      - name: Backend and mobile types
        run: |
          ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
          ./node_modules/.bin/tsc --noEmit -p mobile/tsconfig.json
      - name: Static and focused regressions
        run: |
          python3 -m unittest discover -s docs/jss3/completion/P1_BASELINE -p "test_*.py"
          python3 -m unittest discover -s tests -p "test_jss3_acceptance_runner.py"
          python3 -m unittest discover -s tests -p "test_jss3_visual_register.py"
          python3 -m unittest discover -s tests -p "test_jss3_device1_preflight.py"
          python3 -m unittest discover -s tests -p "test_jss3_staging_attach_plan.py"
          python3 -m unittest discover -s tests -p "test_jss3_noun_attribution_assets.py"
          node --test tests/*.cjs
          node --import tsx --test tests/topic-assets-metadata.test.mts tests/topic-assets-loading.test.mts tests/jss3-supplements.test.mts tests/jss3-batch2-assets.test.mts tests/jss3-delivery-correction.test.mts tests/jss3-d-verification.test.mts tests/jss3-g4-figures.test.mts tests/lesson-image.test.mts tests/jss3-manifest-generation.test.mts tests/jss3-v1-business.test.mts tests/jss3-v2-math-figures.test.mts tests/jss3-m2-connectors.test.mts tests/jss3-math3-binary-notation.test.mts tests/jss3-math4-equivalents.test.mts tests/jss3-closeout-content.test.mts tests/jss3-teacher1-math-decisions.test.mts tests/jss3-v3-science.test.mts tests/jss3-yo-license.test.mts tests/jss3-yo-text.test.mts
      - name: Live PostgreSQL and real asset bytes
        env:
          TOPIC_ASSETS_TEST_DATABASE_URL: postgres://postgres:test_only_password@127.0.0.1:5432/sts_jss3_test
          T2_REAL_ASSETS: ${{ github.workspace }}/curriculum-assets/jss3
        run: |
          node --import tsx --test tests/topic-assets.db.test.mts
          node --import tsx --test tests/protected-export.db.test.mts
      - name: Science PostgreSQL attachment and authenticated retrieval (synthetic identities)
        env:
          JSS3_V3_TEST_DATABASE_URL: postgres://postgres:test_only_password@127.0.0.1:5432/sts_jss3_test
        run: node --import tsx --test tests/jss3-v3-science-ci.db.test.mts
      - name: YO-LICENSE attribution delivered by the authenticated route
        env:
          JSS3_YO_TEST_DATABASE_URL: postgres://postgres:test_only_password@127.0.0.1:5432/sts_jss3_test
        run: node --import tsx --test tests/jss3-yo-license.db.test.mts
      - name: STAGING-BOOTSTRAP first-admin CLI (disposable jss3_test_* databases created and dropped by the test)
        env:
          JSS3_LOCAL_TEST_DATABASE_URL: postgres://postgres:test_only_password@127.0.0.1:5432/sts_jss3_test
        run: node --import tsx --test tests/staging-admin.db.test.mts
