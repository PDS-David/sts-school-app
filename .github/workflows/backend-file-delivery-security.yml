name: Backend file upload, preview and download security

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/src/routes/learning.ts"
      - "backend/src/db/attachTopicAssets.ts"
      - "backend/src/utils/materialUrl.ts"
      - "mobile/src/screens/MaterialsScreen.tsx"
      - "mobile/src/utils/materialDownload.ts"
      - "tests/topic-assets*.test.mts"
      - "tests/material-*-security.test.mts"
      - ".github/workflows/backend-file-delivery-security.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  file-delivery-security:
    name: PostgreSQL asset authorization, integrity, URL and mobile typechecks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TOPIC_ASSETS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sts_test
      NODE_ENV: test
      TERM_PIN_ENFORCED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Run asset manifest and URL security regressions
        run: >-
          node --import tsx --test
          tests/topic-assets-svg.test.mts
          tests/topic-assets-metadata.test.mts
          tests/material-url-security.test.mts
          tests/material-download-security.test.mts
      - name: Run PostgreSQL upload/preview/download authorization and integrity regressions
        run: node --import tsx --test tests/topic-assets.db.test.mts
      - name: Typecheck backend and mobile
        run: npm run typecheck
      - name: Validate SS1 and SS23 asset packages
        run: npm run validate:ss1 && npm run validate:ss23
