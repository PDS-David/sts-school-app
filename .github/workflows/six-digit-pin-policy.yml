name: Six-digit PIN policy (teachers and students)

# One consistent six-digit PIN rule for teachers and students: accept any six
# digits (including sequential PINs such as 123456), reject six identical
# digits and anything that is not exactly six digits. Administrator passwords
# stay on their own, stronger route.

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/src/utils/pin.ts"
      - "backend/src/utils/credentialAttempts.ts"
      - "backend/src/utils/selfRegistration.ts"
      - "backend/src/utils/authSessions.ts"
      - "backend/src/routes/auth.ts"
      - "backend/src/routes/admin.ts"
      - "backend/src/middleware/auth.ts"
      - "backend/schema.sql"
      - "backend/migrations/**"
      - "mobile/src/api/pinSetup.ts"
      - "mobile/src/api/pinForms.ts"
      - "mobile/src/api/loginForm.ts"
      - "mobile/src/api/authPhase.ts"
      - "mobile/src/screens/PinSetupScreen.tsx"
      - "mobile/src/screens/ChangePasswordScreen.tsx"
      - "mobile/src/screens/LoginScreen.tsx"
      - "mobile/src/screens/AdminUsersScreen.tsx"
      - "mobile/src/screens/ActivateAccountScreen.tsx"
      - "mobile/src/screens/SelfRegisterScreen.tsx"
      - "mobile/src/screens/StudentSelfClaimScreen.tsx"
      - "mobile/src/navigation/**"
      - "tests/backend-six-digit-pin-policy.integration.test.mts"
      - "tests/mobile/pin-forms.test.mts"
      - "tests/mobile/pin-setup.test.mts"
      - "tests/mobile/pin-setup-wiring.test.mts"
      - "tests/mobile/login-form.test.mts"
      - ".github/workflows/six-digit-pin-policy.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pin-policy:
    name: Backend PIN policy integration and mobile PIN contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sts_test
      NODE_ENV: test
      # Test-only placeholders. Not real secrets.
      PIN_PEPPER: ci-test-only-pepper-not-a-secret-0123456789abcdef
      JWT_SECRET: ci-test-only-jwt-secret
      JWT_REFRESH_SECRET: ci-test-only-jwt-refresh-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Bootstrap disposable PostgreSQL schema
        run: npm run db:bootstrap --workspace=backend
      - name: Apply numbered migrations against the fresh baseline
        run: npm run db:migrate --workspace=backend
      - name: Run six-digit PIN policy integration tests
        run: node --import tsx --test --test-concurrency=1 tests/backend-six-digit-pin-policy.integration.test.mts tests/backend-credential-attempts.integration.test.mts tests/backend-teacher-assignment.integration.test.mts tests/backend-self-registration.integration.test.mts
      - name: Run mobile PIN contract tests
        run: node --import tsx --test tests/mobile/pin-forms.test.mts tests/mobile/pin-setup.test.mts tests/mobile/pin-setup-wiring.test.mts tests/mobile/login-form.test.mts
      - name: Typecheck backend
        run: ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
      - name: Typecheck mobile
        run: ./node_modules/.bin/tsc --noEmit -p mobile/tsconfig.json
