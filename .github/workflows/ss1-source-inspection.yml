name: Catering Craft Week Six source identity (temporary)

on:
  push:
    branches:
      - agent/catering-craft-approval-foundation-20261109
    paths:
      - .github/workflows/ss1-source-inspection.yml
      - backend/src/db/ingestTopics.ts
      - scripts/ss1/inspect_catering_week6.mts

permissions:
  contents: read

jobs:
  inspect-week-six:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install backend parser dependencies without changing lockfiles
        working-directory: backend
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund

      - name: Verify archive and extract only the registered Second Term source member
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ["GITHUB_WORKSPACE"])
          archive = root / "docs/ss1/sources/SSS1-original.zip"
          registry = json.loads((root / "backend/src/db/ss1/sourceRegistry.json").read_text(encoding="utf-8"))
          source_id = "SS1-SRC-f433169ca25c"
          records = [r for r in registry if r["source_id"] == source_id]
          if len(records) != 1:
              raise SystemExit(f"Expected one registry row for {source_id}; found {len(records)}")
          record = records[0]
          archive_sha = "024487129a86c3a89e55293b3ad71b0dfe8b8969ea55bbc64dbfdc17565c9a3e"
          actual_archive_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual_archive_sha != archive_sha:
              raise SystemExit(f"ARCHIVE_HASH_MISMATCH expected={archive_sha} actual={actual_archive_sha}")
          member = record["archive_member"]
          posix = PurePosixPath(member)
          if posix.is_absolute() or ".." in posix.parts or "\\\\" in member:
              raise SystemExit(f"UNSAFE_MEMBER_PATH {member}")
          with zipfile.ZipFile(archive) as zf:
              info = zf.getinfo(member)
              if info.file_size != int(record["bytes"]):
                  raise SystemExit(f"MEMBER_SIZE_MISMATCH expected={record['bytes']} actual={info.file_size}")
              data = zf.read(member)
          actual_member_sha = hashlib.sha256(data).hexdigest()
          if actual_member_sha != record["sha256"]:
              raise SystemExit(f"MEMBER_HASH_MISMATCH expected={record['sha256']} actual={actual_member_sha}")
          target = Path(os.environ["RUNNER_TEMP"]) / "catering-craft-week-six-source.doc"
          with target.open("xb") as f:
              f.write(data)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SS1_CATERING_SOURCE_FILE={target}\\n")
          print(json.dumps({"archive_sha256": actual_archive_sha, "source_id": source_id, "member": member, "member_sha256": actual_member_sha, "bytes": len(data)}))
          PY

      - name: Run the existing WordExtractor and topic parser for Week Six only
        working-directory: backend
        env:
          SS1_CATERING_SOURCE_FILE: ${{ runner.temp }}/catering-craft-week-six-source.doc
          SS1_CATERING_IDENTITY_OUTPUT: ${{ runner.temp }}/catering-craft-week-six-identity.json
        run: node --import tsx ../scripts/ss1/inspect_catering_week6.mts

      - name: Upload exact parser identity (no source body)
        uses: actions/upload-artifact@v4
        with:
          name: catering-craft-week-six-identity
          path: ${{ runner.temp }}/catering-craft-week-six-identity.json
          retention-days: 1
          if-no-files-found: error
