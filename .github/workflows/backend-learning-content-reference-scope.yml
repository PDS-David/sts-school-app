name: Backend learning content reference scope

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/src/routes/learning.ts"
      - "tests/backend-learning-content-reference-scope.integration.test.mts"
      - "tests/backend-ss23-student-delivery.integration.test.mts"
      - ".github/workflows/backend-learning-content-reference-scope.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  learning-content-scope:
    name: PostgreSQL learning content reference integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sts_test
      NODE_ENV: test
      TOPIC_ASSETS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sts_test
      TERM_PIN_ENFORCED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Bootstrap disposable PostgreSQL schema
        run: npm run db:bootstrap --workspace=backend
      - name: Run learning content and SS23 student-delivery HTTP regressions
        run: node --import tsx --test tests/backend-learning-content-reference-scope.integration.test.mts tests/backend-ss23-student-delivery.integration.test.mts
      - name: Run topic asset delivery, school ownership and tamper regressions
        run: node --import tsx --test tests/topic-assets.db.test.mts
      - name: Run material URL and mobile download security regressions
        run: node --import tsx --test tests/topic-assets-svg.test.mts tests/topic-assets-metadata.test.mts tests/material-url-security.test.mts tests/material-download-security.test.mts
      - name: Typecheck backend and mobile
        run: |
          ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
          ./node_modules/.bin/tsc --noEmit -p mobile/tsconfig.json
