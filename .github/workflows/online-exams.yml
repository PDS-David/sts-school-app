name: Formal online examinations
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'mobile/**'
      - 'tests/online-exams*'
      - 'tests/ai-class-practice*'
      - 'tests/class-practice*'
      - 'docs/FORMAL_ONLINE_EXAMINATIONS.md'
      - '.github/workflows/online-exams.yml'
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'mobile/**'
      - 'tests/online-exams*'
      - 'tests/ai-class-practice*'
      - 'tests/class-practice*'
      - 'docs/FORMAL_ONLINE_EXAMINATIONS.md'
      - '.github/workflows/online-exams.yml'

jobs:
  backend-and-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: online_exam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d online_exam_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run test:online-exams
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/online_exam_test
      - run: npm run test:class-practice
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/online_exam_test

  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
