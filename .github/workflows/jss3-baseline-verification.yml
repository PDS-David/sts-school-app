name: JSS3 isolated patched verification
on:
  push:
    branches:
      - verification/jss3-ci-20261008
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patched:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply combined patch
        run: |
          git apply --check .verification/patches/jss3-redistribution-combined.patch
          git apply .verification/patches/jss3-redistribution-combined.patch
      - name: Verify and apply English correction
        run: |
          git apply --check .verification/patches/jss3-english-correction.patch
          git apply .verification/patches/jss3-english-correction.patch
      - name: Verify and apply source-boundary safeguard
        run: |
          git apply --check .verification/patches/english-source-boundary-followup.patch
          git apply .verification/patches/english-source-boundary-followup.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Patched backend TypeScript
        run: npm run build --workspace=backend
      - name: Existing regression tests
        run: node --test tests/*.test.cjs
      - name: JSS3 tests
        run: node --import tsx --test tests/jss3*.test.mts
      - name: Verify importer dry-run interface
        run: |
          node --import tsx backend/src/db/ingestTopics.ts --help
      - name: Scope warning
        if: always()
        run: |
          echo "Isolated branch: no deployment or production DB import." >> "$GITHUB_STEP_SUMMARY"
          echo "Original curriculum source archives are not staged in this workflow; importer counts cannot be certified from this run." >> "$GITHUB_STEP_SUMMARY"
