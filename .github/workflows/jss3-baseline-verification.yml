name: JSS3 isolated patched verification
on:
  push:
    branches:
      - verification/jss3-ci-20261008
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patched:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply combined patch
        run: |
          git apply --check .verification/patches/jss3-redistribution-combined.patch
          git apply .verification/patches/jss3-redistribution-combined.patch
      - name: Verify and apply English correction
        run: |
          git apply --check .verification/patches/jss3-english-correction.patch
          git apply .verification/patches/jss3-english-correction.patch
      - name: Verify and apply source-boundary safeguard
        run: |
          git apply --check .verification/patches/english-source-boundary-followup.patch
          git apply .verification/patches/english-source-boundary-followup.patch
      - name: Update superseded test expectations for approved English rule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/jss3-second-term.test.mts')
          s = p.read_text()
          s = s.replace("'BASIC 9 MATHEMATICS E-NOTE.docx',\n];\nconst NO_RULE", "'BASIC 9 MATHEMATICS E-NOTE.docx', 'js 3 english.docx',\n];\nconst NO_RULE")
          s = s.replace("'js 3 english.docx', 'social studies.docx'", "'social studies.docx'")
          s = s.replace("exactly the seven reviewed 2nd-Term files", "exactly the eight reviewed 2nd-Term files")
          p.write_text(s)
          p = Path('tests/jss3-english-correction.test.mts')
          s = p.read_text().replace("'SCHEME OF WORK\\nTOPIC : CONSONANT", "'SCHEME OF WORK\\nRevision\\nTOPIC : CONSONANT")
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Patched backend TypeScript
        run: npm run build --workspace=backend
      - name: Existing regression tests
        run: node --test tests/*.test.cjs
      - name: JSS3 tests
        run: node --import tsx --test tests/jss3*.test.mts
      - name: Verify importer dry-run interface
        run: |
          set +e
          node --import tsx backend/src/db/ingestTopics.ts --help > /tmp/jss3-importer-help.txt 2>&1
          code=$?
          set -e
          cat /tmp/jss3-importer-help.txt
          grep -q 'Usage:' /tmp/jss3-importer-help.txt
          test "$code" -eq 1
      - name: Scope warning
        if: always()
        run: |
          echo "Isolated branch: no deployment or production DB import." >> "$GITHUB_STEP_SUMMARY"
          echo "Original curriculum source archives are not staged in this workflow; importer counts cannot be certified from this run." >> "$GITHUB_STEP_SUMMARY"
