name: SS1 Agricultural Science verification

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/src/db/ss1/**"
      - "backend/src/db/attachTopicAssets.ts"
      - "backend/src/routes/learning.ts"
      - "backend/src/utils/ss1AgriculturalScienceDeliveryCorrection.ts"
      - "mobile/src/screens/TopicDetailScreen.tsx"
      - "mobile/src/api/lessonAssets.ts"
      - "mobile/package.json"
      - "scripts/ss1/build_asset_plan.mjs"
      - "scripts/ss1/build_agricultural_science_asset_plan.mts"
      - "tests/topic-assets.static.test.cjs"
      - "tests/topic-assets-svg.test.mts"
      - "backend/package.json"
      - "package-lock.json"
      - "package.json"
      - "tests/ss1/agricultural-science.*.mts"
      - ".github/workflows/ss1-agricultural-science-verification.yml"
  push:
    branches: [master]
    paths:
      - "backend/src/db/ss1/**"
      - "backend/package.json"
      - "package-lock.json"
      - "package.json"
      - "tests/ss1/agricultural-science.*.mts"
      - ".github/workflows/ss1-agricultural-science-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agricultural-science:
    name: Validate SS1 Agricultural Science package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked backend workspace dependencies
        run: npm ci --workspace=backend --include-workspace-root=false --no-audit --no-fund
      - name: Run Agricultural Science package tests (lesson body hashes, approvals, assets)
        run: node --import tsx --test tests/ss1/agricultural-science.package.test.mts
      - name: Run Agricultural Science asset-plan tests
        run: node --import tsx --test tests/ss1/agricultural-science.asset-plan.test.mts
      - name: Run safe SVG ingestion tests
        run: node --import tsx --test tests/topic-assets-svg.test.mts
      - name: Run authenticated asset-route and native mobile-renderer contracts
        run: node --test tests/topic-assets.static.test.cjs
      - name: Run the SS1 package integrity validator for Agricultural Science only
        run: node --import tsx backend/src/db/ss1/validateSubjectPackages.ts agricultural-science
