name: Backend distributed Redis rate limiting

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/src/utils/redisRateLimitStore.ts"
      - "backend/src/utils/ai.ts"
      - "backend/src/index.ts"
      - "backend/src/routes/auth.ts"
      - "backend/src/routes/ai.ts"
      - "backend/src/routes/messages.ts"
      - "tests/backend-redis-rate-limit.integration.test.mts"
      - ".github/workflows/backend-redis-rate-limit.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  redis-rate-limit:
    name: Redis shared-quota integration and backend typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RATE_LIMIT_REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Run distributed Redis rate-limit regressions
        run: node --import tsx --test tests/backend-redis-rate-limit.integration.test.mts
      - name: Typecheck backend
        run: ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
