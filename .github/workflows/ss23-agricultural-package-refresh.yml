name: SS23 Agricultural Science draft refresh

on:
  push:
    branches:
      - agent/ss23-agricultural-science-terms2-3-20261116
    paths:
      - "backend/src/db/ss23/subjects/agricultural-science.json"
      - "tests/ss23/agricultural-science.terms2-3.package.test.mts"
      - ".github/workflows/ss23-agricultural-package-refresh.yml"

permissions:
  contents: write

concurrency:
  group: ss23-agricultural-draft-refresh
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ss23-agricultural-science-terms2-3-20261116
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Refresh SS23 body and asset hashes
        run: npm run ss23:refresh-hashes
      - name: Validate SS23 source and package integrity
        run: npm run validate:ss23
      - name: Run SS23 tests
        run: npm run test:ss23
      - name: Validate SS1 packages
        run: npm run validate:ss1
      - name: Typecheck backend
        run: ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
      - name: Commit refreshed hashes on this task branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- backend/src/db/ss23/subjects/agricultural-science.json; then
            git add backend/src/db/ss23/subjects/agricultural-science.json
            git commit -m "chore(ss23): refresh agriculture lesson hashes"
            git push origin HEAD:agent/ss23-agricultural-science-terms2-3-20261116
          fi
