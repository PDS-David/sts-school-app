name: Backend physical report-roster isolation

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/schema.sql"
      - "backend/migrations/**"
      - "backend/src/db/importStudentRoster.ts"
      - "backend/src/routes/academic.ts"
      - "backend/src/routes/ai.ts"
      - "backend/src/routes/announcements.ts"
      - "backend/src/routes/learning.ts"
      - "backend/src/routes/schoolEvents.ts"
      - "backend/src/routes/scores.ts"
      - "backend/src/routes/students.ts"
      - "backend/src/routes/weeklyEfforts.ts"
      - "mobile/src/screens/MyResultsScreen.tsx"
      - "mobile/src/screens/SessionReportScreen.tsx"
      - "mobile/src/screens/StudentDetailScreen.tsx"
      - "backend/src/utils/rbac.ts"
      - "backend/src/utils/scope.ts"
      - "backend/src/utils/studentRosterScope.ts"
      - "tests/backend-*.test.mts"
      - "tests/backend-*.integration.test.mts"
      - "tests/report-roster-schema.test.mts"
      - ".github/workflows/backend-report-roster.yml"
  push:
    branches: [master]
    paths:
      - "backend/schema.sql"
      - "backend/migrations/**"
      - "backend/src/db/importStudentRoster.ts"
      - "backend/src/routes/academic.ts"
      - "backend/src/routes/ai.ts"
      - "backend/src/routes/announcements.ts"
      - "backend/src/routes/learning.ts"
      - "backend/src/routes/schoolEvents.ts"
      - "backend/src/routes/scores.ts"
      - "backend/src/routes/students.ts"
      - "backend/src/routes/weeklyEfforts.ts"
      - "mobile/src/screens/MyResultsScreen.tsx"
      - "mobile/src/screens/SessionReportScreen.tsx"
      - "mobile/src/screens/StudentDetailScreen.tsx"
      - "backend/src/utils/rbac.ts"
      - "backend/src/utils/scope.ts"
      - "backend/src/utils/studentRosterScope.ts"
      - "tests/backend-*.test.mts"
      - "tests/backend-*.integration.test.mts"
      - "tests/report-roster-schema.test.mts"
      - ".github/workflows/backend-report-roster.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  report-roster:
    name: PostgreSQL physical roster isolation and report-only teacher access
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sts_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Bootstrap disposable PostgreSQL 18 schema
        run: npm run db:bootstrap --workspace=backend
      - name: Apply numbered migrations against the fresh baseline
        run: npm run db:migrate --workspace=backend
      - name: Verify report-roster schema safeguards and teacher role policy
        run: node --import tsx --test tests/report-roster-schema.test.mts tests/backend-teacher-report-only-policy.test.mts
      - name: Verify class-lock, score, attendance, weekly-effort and term boundaries
        run: node --import tsx --test tests/backend-report-roster-lifecycle.integration.test.mts tests/backend-class-lock-read-scope.integration.test.mts tests/backend-score-subject-scope-atomicity.integration.test.mts tests/backend-attendance-report-scope.integration.test.mts tests/backend-weekly-feedback-access-scope.integration.test.mts tests/backend-term-session-atomicity.integration.test.mts
      - name: Type-check backend
        run: ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
