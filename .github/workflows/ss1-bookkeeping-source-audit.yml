name: SS1 Bookkeeping source compiler audit

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/ss1-bookkeeping-source-audit.yml"
      - "scripts/ss1/**"
      - "backend/src/db/ss1/**"
      - "backend/src/db/ingestTopics.ts"
      - "docs/ss1/sources/**"
      - "docs/ss1/IMPLEMENTATION_20261026/SOURCE_ASSIGNMENTS.csv"
      - "docs/ss1/work/microtasks/bookkeeping/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bookkeeping-source-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify and privately stage the complete SS1 source archive
        run: |
          python scripts/ss1/prepare_sources.py \
            --archive docs/ss1/sources/SSS1-original.zip \
            --output "$RUNNER_TEMP/ss1-staged"

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run the production SS1 parser/compiler in plan-only mode
        id: compile
        shell: bash
        run: |
          set +e
          python scripts/ss1/build_subject_packages.py \
            --root "$RUNNER_TEMP/ss1-staged" \
            --output "$RUNNER_TEMP/ss1-plan.json"
          compiler_exit=$?
          set -e

          if [ ! -s "$RUNNER_TEMP/ss1-plan.json" ]; then
            echo "The real importer/compiler did not produce its private plan (exit $compiler_exit)." >&2
            exit "$compiler_exit"
          fi

          echo "compiler_exit=$compiler_exit" >> "$GITHUB_OUTPUT"
          python scripts/ss1/check_bookkeeping_plan.py "$RUNNER_TEMP/ss1-plan.json"

          if [ "$compiler_exit" -ne 0 ]; then
            echo "The global SS1 plan is blocked by one or more packages. The Bookkeeping-specific assertions above passed; no database write was attempted."
          fi
