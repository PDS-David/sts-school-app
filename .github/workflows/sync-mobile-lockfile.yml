name: Sync mobile workspace lockfile

on:
  push:
    branches: [master]
    paths:
      - "mobile/package.json"

permissions:
  contents: write

concurrency:
  group: mobile-lockfile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Update workspace lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Workspace lockfile already matches."
            exit 0
          fi
          git commit -m "chore(mobile): sync expo audio workspace lockfile"
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then exit 0; fi
            sleep 2
          done
          echo "Could not push the updated lockfile after three retries."
          exit 1
