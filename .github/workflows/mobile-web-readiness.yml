name: Web mobile bundle readiness

on:
  push:
    branches:
      - "agent/mobile-web-readiness-*"
    paths:
      - "mobile/**"
      - "config/apiTarget.js"
      - "config/apiTarget.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-web-readiness.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "config/apiTarget.js"
      - "config/apiTarget.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-web-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-web-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  web-bundle:
    name: Export Expo web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Export web JavaScript bundle
        working-directory: mobile
        env:
          CI: "1"
        run: npx expo export --platform web --output-dir ../artifacts/mobile-web
      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-js-bundle
          path: artifacts/mobile-web/
          if-no-files-found: error
          retention-days: 7
