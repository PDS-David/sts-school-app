name: Backend security checkpoint reconciliation

on:
  push:
    branches: [agent/backend-security-bsec026-reconciliation-final-20261116]
  pull_request:
    branches: [master]
    paths:
      - "docs/backend-security/checkpoints/BSEC-024.md"
      - "docs/backend-security/checkpoints/BSEC-025.md"
      - "docs/backend-security/checkpoints/BSEC-026.md"
      - "tests/backend-messaging-input-abuse-controls.integration.test.mts"
      - "tests/backend-class-lock-read-scope.integration.test.mts"
      - ".github/workflows/backend-security-reconciliation.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reconcile-security-checkpoints:
    name: PostgreSQL BSEC-024 and BSEC-025 regression verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sts_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Bootstrap disposable PostgreSQL schema
        run: npm run db:bootstrap --workspace=backend
      - name: Verify BSEC-024 messaging input and sender quota
        run: node --import tsx --test tests/backend-messaging-input-abuse-controls.integration.test.mts
      - name: Verify BSEC-025 class-lock read authorization
        run: node --import tsx --test tests/backend-class-lock-read-scope.integration.test.mts
      - name: Typecheck backend
        run: ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
