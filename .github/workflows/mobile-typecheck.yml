name: Mobile TypeScript and API readiness

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'tests/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-typecheck.yml'
  push:
    branches:
      - master
      - 'agent/**'
    paths:
      - 'mobile/**'
      - 'tests/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-typecheck.yml'

permissions:
  contents: read

concurrency:
  group: mobile-typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Type-check mobile application
        run: npm run mobile:typecheck
      - name: Test Render cold-start readiness gate
        run: node --import tsx --test tests/mobile/backend-readiness.test.mts
      - name: Test term and session report PDF template fidelity
        run: node --import tsx --test tests/mobile/report-template.test.mts tests/mobile/session-report-template.test.mts
