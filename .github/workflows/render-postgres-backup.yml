name: Render PostgreSQL encrypted backup
# A workflow-file push creates an immediate encrypted recovery point after production data changes.

on:
  pull_request:
    paths:
      - ".github/workflows/render-postgres-backup.yml"
      - "docs/ops/RENDER_POSTGRES_BACKUP_RESTORE.md"
  push:
    branches: [master]
    paths:
      - ".github/workflows/render-postgres-backup.yml"
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-postgres-backup
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow syntax with actionlint
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.7 -color .github/workflows/render-postgres-backup.yml

  backup:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENDER_POSTGRES_EXTERNAL_URL: ${{ secrets.RENDER_POSTGRES_EXTERNAL_URL }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Validate required secrets and TLS
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_POSTGRES_EXTERNAL_URL" || { echo "::error::Missing RENDER_POSTGRES_EXTERNAL_URL repository secret"; exit 1; }
          test -n "$BACKUP_AGE_RECIPIENT" || { echo "::error::Missing BACKUP_AGE_RECIPIENT repository secret"; exit 1; }
          case "$RENDER_POSTGRES_EXTERNAL_URL" in
            *sslmode=require*) ;;
            *) echo "::error::The external PostgreSQL URL must include sslmode=require"; exit 1 ;;
          esac
          case "$BACKUP_AGE_RECIPIENT" in
            age1*) ;;
            *) echo "::error::BACKUP_AGE_RECIPIENT must be an age public recipient"; exit 1 ;;
          esac

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Dump PostgreSQL 18 and encrypt immediately
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          backup_dir="$RUNNER_TEMP/render-postgres-backup"
          mkdir -p "$backup_dir"
          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          encrypted_file="$backup_dir/sts-school-db-${timestamp}.dump.age"

          docker run --rm \
            --env RENDER_POSTGRES_EXTERNAL_URL \
            --volume "$backup_dir:/backup" \
            postgres:18 sh -ceu '
              pg_dump "$RENDER_POSTGRES_EXTERNAL_URL" \
                --format=custom --no-owner --no-acl --verbose \
                --file=/backup/database.dump
              psql "$RENDER_POSTGRES_EXTERNAL_URL" -X -A -t \
                -c "SHOW server_version" \
                > /backup/database-info.txt
            '

          # Verify the custom-format archive with the native PostgreSQL 18 restore tools
          # before encryption. This uses a disposable UTF-8/template0 database and never
          # connects to or writes to the production database.
          restore_container="sts-backup-restore-check"
          cleanup_restore_check() {
            docker rm --force "$restore_container" >/dev/null 2>&1 || true
          }
          trap cleanup_restore_check EXIT
          docker run --detach --name "$restore_container" \
            --env POSTGRES_PASSWORD=postgres postgres:18 >/dev/null
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "$restore_container" pg_isready --username=postgres >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          docker cp "$backup_dir/database.dump" "$restore_container:/tmp/database.dump"
          docker exec "$restore_container" sh -ceu '
            createdb --username=postgres --template=template0 --encoding=UTF8 sts_backup_restore_check
            pg_restore --list /tmp/database.dump > /tmp/archive-list.txt
            test -s /tmp/archive-list.txt
            pg_restore --verbose --exit-on-error --single-transaction --no-owner --no-privileges \
              --username=postgres --dbname=sts_backup_restore_check /tmp/database.dump
            psql --username=postgres --dbname=sts_backup_restore_check --no-psqlrc \
              --set=ON_ERROR_STOP=1 --tuples-only --no-align \
              --command="SELECT concat_ws(chr(124), current_database(), version(), (SELECT count(*)::text FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname=current_schema() AND c.relkind IN (chr(114),chr(112))), (SELECT count(*)::text FROM schema_migrations), (SELECT count(*)::text FROM students), (SELECT count(*)::text FROM report_roster_memberships), (SELECT count(*)::text FROM audit_log))" \
              > /tmp/restore-verification.txt
            test -s /tmp/restore-verification.txt
          '
          docker cp "$restore_container:/tmp/restore-verification.txt" "$backup_dir/restore-verification.txt"
          cleanup_restore_check
          trap - EXIT
          IFS='|' read -r restored_database restored_version restored_tables restored_migrations restored_students restored_memberships restored_audit < "$backup_dir/restore-verification.txt"
          test "$restored_database" = "sts_backup_restore_check"
          case "$restored_version" in *"PostgreSQL 18"*) ;; *) echo "::error::Disposable restore did not use PostgreSQL 18"; exit 1 ;; esac
          test "$restored_tables" -ge 40
          test "$restored_migrations" -ge 6

          age --recipient "$BACKUP_AGE_RECIPIENT" --output "$encrypted_file" "$backup_dir/database.dump"
          rm -f "$backup_dir/database.dump"
          test -s "$encrypted_file"
          sha256sum "$encrypted_file" > "$encrypted_file.sha256"

          {
            echo "created_at_utc=$timestamp"
            echo "database=sts_school_db_2"
            echo "postgres_client_image=postgres:18"
            cat "$backup_dir/database-info.txt"
            echo "encrypted_file=$(basename "$encrypted_file")"
            echo "disposable_restore=passed"
            cat "$backup_dir/restore-verification.txt"
            cat "$encrypted_file.sha256"
          } > "$backup_dir/manifest.txt"

          echo "artifact_dir=$backup_dir" >> "$GITHUB_OUTPUT"
          echo "artifact_name=render-postgres-backup-${timestamp}" >> "$GITHUB_OUTPUT"
          {
            echo "### Render PostgreSQL backup created"
            echo "- UTC timestamp: $timestamp"
            echo "- Encrypted archive: $(basename "$encrypted_file")"
            echo "- SHA-256: $(cut -d' ' -f1 "$encrypted_file.sha256")"
            echo "- Disposable PostgreSQL 18 UTF-8/template0 restore: passed."
            echo "- Restored database summary: $(cat "$backup_dir/restore-verification.txt")"
            echo "- Plaintext dump removed from the runner workspace."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.artifact_name }}
          path: |
            ${{ steps.backup.outputs.artifact_dir }}/*.dump.age
            ${{ steps.backup.outputs.artifact_dir }}/*.dump.age.sha256
            ${{ steps.backup.outputs.artifact_dir }}/manifest.txt
            ${{ steps.backup.outputs.artifact_dir }}/restore-verification.txt
          if-no-files-found: error
          retention-days: 90
