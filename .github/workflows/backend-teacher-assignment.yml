name: Backend teacher assignment integrity

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/src/routes/admin.ts"
      - "backend/src/utils/teacherAssignments.ts"
      - "backend/src/db/pool.ts"
      - "backend/schema.sql"
      - "tests/backend-teacher-assignment.integration.test.mts"
      - ".github/workflows/backend-teacher-assignment.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  teacher-assignments:
    name: PostgreSQL teacher assignment validation and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sts_test
      JWT_SECRET: bsec5-test-access-secret-not-for-production
      JWT_REFRESH_SECRET: bsec5-test-refresh-secret-not-for-production
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Bootstrap disposable PostgreSQL schema
        run: npm run db:bootstrap --workspace=backend
      - name: Run teacher assignment validation and rollback regressions
        run: |
          # TEMPORARY DIAGNOSTIC (reverted before merge): same command, same exit code,
          # plus the spec report published as annotations.
          set +e
          node --import tsx --test --test-reporter=spec tests/backend-teacher-assignment.integration.test.mts > /tmp/ta.log 2>&1
          code=$?
          enc() { python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'; }
          echo "log bytes: $(wc -c < /tmp/ta.log), exit code: $code"
          grep -aE '^\s*(✔|✖)|^ℹ (tests|pass|fail)' /tmp/ta.log | head -c 6000 | enc | sed 's/^/::notice title=TEST RESULTS::/'
          python3 - <<'PY'
          import re
          t = open('/tmp/ta.log', encoding='utf-8', errors='replace').read()
          t = t.split('failing tests:', 1)[-1]
          blocks = re.split(r'\n(?=test at )', t)
          drop = re.compile(r'^\s+at |generatedMessage|^\s+code:|^\s+operator:|^\s+diff:|^\s+actual: |^\s+expected: ')
          for i, blk in enumerate(blocks):
              lines = [l for l in blk.splitlines() if l.strip() and not drop.search(l)]
              msg = '\n'.join(lines)[:3500]
              msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=FAILURE %d::%s' % (i, msg))
          PY
          exit $code
      - name: Typecheck backend
        run: ./node_modules/.bin/tsc --noEmit -p backend/tsconfig.json
