name: Render Free-Tier Manual Wake and Readiness Check

on:
  pull_request:
    paths:
      - '.github/workflows/render-free-tier-keepalive.yml'
  # Manual dispatch wakes the Free service on demand. There is deliberately no
  # recurring schedule: keeping it continuously warm would consume nearly all
  # of the workspace's shared Free web-service instance-hours.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-free-tier-manual-wake
  cancel-in-progress: false

jobs:
  validate-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate workflow syntax and manual-only trigger
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/render-free-tier-keepalive.yml', aliases: true)"
          grep -Fq 'workflow_dispatch:' .github/workflows/render-free-tier-keepalive.yml
          ! grep -Fq 'schedule:' .github/workflows/render-free-tier-keepalive.yml
          grep -Fq '/health/ready' .github/workflows/render-free-tier-keepalive.yml
      - name: Verify live API and PostgreSQL readiness
        env:
          API_BASE_URL: https://sts-school-app.onrender.com
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 90 \
            --retry 1 \
            --retry-delay 5 \
            --retry-all-errors \
            "$API_BASE_URL/health/ready")"
          printf '%s\n' "$body"
          printf '%s' "$body" | grep -Fq '"database":"ok"'

  manual-wake:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake the API and verify database readiness
        env:
          API_BASE_URL: https://sts-school-app.onrender.com
        run: |
          set -euo pipefail
          echo "Checking the canonical STS School API readiness endpoint."
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            "$API_BASE_URL/health/ready"
          printf '\n'
          echo "API wake-up and PostgreSQL readiness request completed." >> "$GITHUB_STEP_SUMMARY"
