name: SS1 cross-subject package audit

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/src/db/ss1/subjects/**"
      - "backend/src/db/ss1/sourceRegistry.json"
      - "backend/src/db/ss1/compiler.ts"
      - "backend/src/db/ss1/subjectPackageSchema.ts"
      - "backend/src/db/ss1/loader.ts"
      - "backend/src/db/ss1/topicParserRules.ts"
      - "backend/src/db/ingestTopics.ts"
      - "docs/ss1/sources/**"
      - "scripts/ss1/**"
      - "tests/ss1/technical-drawing.*.test.mts"
      - "tests/ss1/government.package.test.mts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ss1-cross-subject-package-audit.yml"

permissions:
  contents: write

jobs:
  cross-subject-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: All registered SS1 subjects — source anchors and compiler
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and stage the complete SS1 source archive
        run: |
          python scripts/ss1/prepare_sources.py \
            --archive docs/ss1/sources/SSS1-original.zip \
            --output "$RUNNER_TEMP/ss1-staged"
      - name: Run Government package regression tests
        run: |
          node --import tsx --test tests/ss1/government.package.test.mts
          node --import tsx backend/src/db/ss1/validateSubjectPackages.ts government
      - name: Install WMF conversion tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-draw inkscape
      - name: Extract and register all source Technical Drawing figures
        run: |
          python scripts/ss1/extract_technical_drawing_assets.py \
            --archive docs/ss1/sources/SSS1-original.zip \
            --package backend/src/db/ss1/subjects/technical-drawing.json \
            --queue docs/ss1/work/microtasks/technical-drawing/QUEUE.json \
            --repo-root .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/db/ss1/assets/technical-drawing/source \
            backend/src/db/ss1/subjects/technical-drawing.json \
            docs/ss1/work/microtasks/technical-drawing/QUEUE.json \
            docs/ss1/work/microtasks/technical-drawing/TD-SOURCE-ASSET-MANIFEST.json
          if git diff --cached --quiet; then
            echo "All source figures are already materialized and registered."
          else
            git commit -m "assets(technical-drawing): register all 104 source figures"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
      - name: Run Technical Drawing source-asset regression tests
        run: |
          node --import tsx --test \
            tests/ss1/technical-drawing.package.test.mts \
            tests/ss1/technical-drawing.source-assets.test.mts
          node --import tsx backend/src/db/ss1/validateSubjectPackages.ts technical-drawing
      - name: Compile Technical Drawing independently in plan-only mode
        run: |
          plan="$RUNNER_TEMP/technical-drawing-plan.json"
          status=0
          python scripts/ss1/build_subject_packages.py \
            --root "$RUNNER_TEMP/ss1-staged" \
            --output "$plan" \
            --subject-slug technical-drawing || status=$?
          if [ ! -s "$plan" ]; then
            echo "::error::Technical Drawing compile failed before producing a plan (exit $status)"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Technical Drawing plan produced; owner gates remain (exit $status)."
          fi
          python - "$plan" <<'PY'
          import json, sys
          from collections import Counter
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          blockers = plan.get("blockers", [])
          print(json.dumps({
              "compiled_rows": len(plan.get("rows", [])),
              "identified_rows": len(plan.get("identified_rows", [])),
              "dispositions": len(plan.get("dispositions", [])),
              "ready": plan.get("ready"),
              "blockers_by_kind": dict(sorted(Counter(b.split(":", 1)[0] for b in blockers).items())),
          }, indent=2))
          PY
      - name: Compile every registered SS1 subject in plan-only mode
        run: |
          # The importer exits 1 while owner gates / unapproved content remain, but it
          # still writes the plan first. A crash (compile error) writes no plan: fail then.
          plan="$RUNNER_TEMP/ss1-cross-subject-plan.json"
          status=0
          python scripts/ss1/build_subject_packages.py \
            --root "$RUNNER_TEMP/ss1-staged" \
            --output "$plan" || status=$?
          if [ ! -s "$plan" ]; then
            echo "::error::SS1 compile failed before producing a plan (exit $status)"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Plan produced; importer reports remaining owner gates (exit $status). See next step."
          fi
      - name: Report subject coverage and remaining owner gates
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan_path = Path(os.environ["RUNNER_TEMP"]) / "ss1-cross-subject-plan.json"
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          from collections import Counter
          blockers = plan.get("blockers", [])
          by_kind = Counter(b.split(":", 1)[0] for b in blockers)
          print(json.dumps({
              "version": plan.get("version"),
              "compiled_rows": len(plan.get("rows", [])),
              "identified_rows": len(plan.get("identified_rows", [])),
              "dispositions": len(plan.get("dispositions", [])),
              "ready": plan.get("ready"),
              "blockers_by_kind": dict(sorted(by_kind.items())),
          }, indent=2))
          # Owner gates and approval state are reported above, not failures.
          # Structural problems in the package set are failures.
          structural = {"MISSING_PACKAGE", "UNACCOUNTED_SOURCE", "EXTERNAL_SOURCE_WITHOUT_COVERAGE", "MISSING_INPUT", "NO_COVERAGE"}
          bad = [b for b in blockers if b.split(":", 1)[0] in structural]
          for b in bad:
              print(f"::error::{b}")
          raise SystemExit(1 if bad else 0)
          PY
