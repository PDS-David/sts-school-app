name: SS1 cross-subject package audit

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/src/db/ss1/subjects/**"
      - "backend/src/db/ss1/sourceRegistry.json"
      - "backend/src/db/ss1/compiler.ts"
      - "backend/src/db/ss1/subjectPackageSchema.ts"
      - "backend/src/db/ss1/loader.ts"
      - "backend/src/db/ss1/topicParserRules.ts"
      - "backend/src/db/ingestTopics.ts"
      - "docs/ss1/sources/**"
      - "scripts/ss1/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ss1-cross-subject-package-audit.yml"

permissions:
  contents: read

jobs:
  cross-subject-audit:
    name: All registered SS1 subjects — source anchors and compiler
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and stage the complete SS1 source archive
        run: |
          python scripts/ss1/prepare_sources.py \
            --archive docs/ss1/sources/SSS1-original.zip \
            --output "$RUNNER_TEMP/ss1-staged"
      - name: Diagnose Agricultural Science parsed source identities
        run: |
          node --import tsx --input-type=module <<'NODE'
          import path from 'node:path';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import mammoth from 'mammoth';
          import { parseTopics } from './backend/src/db/ingestTopics.ts';
          const root = path.join(process.env.RUNNER_TEMP, 'ss1-staged');
          const sources = [
            'SSS 1/1st Term SS1_/1ST TERM S1 AGRICULTURAL SCIENCE.docx',
            'SSS 1/2nd Term SS1_/2ND TERM S1 AGRICULTRAL SCIENCE.docx',
            'SSS 1/3rd Term SS1_/3RD TERM S1 AGRICULTURAL SCIENCE.docx',
            'SSS 1/1st Term SS1_/book keeping.docx',
          ];
          for (const member of sources) {
            const file = path.join(root, ...member.split('/'));
            const text = (await mammoth.extractRawText({ path: file })).value;
            const rows = parseTopics(text);
            console.log('AGRICULTURAL_SOURCE', member);
            for (const row of rows) {
              const body_sha256 = createHash('sha256').update(row.body, 'utf8').digest('hex');
              console.log(JSON.stringify({ weekLabel: row.weekLabel, title: row.title, body_sha256, body_chars: row.body.length }));
            }
          }
          const bkPath = 'SSS 1/1st Term SS1_/book keeping.docx';
          const bkFile = path.join(root, ...bkPath.split('/'));
          const bkText = (await mammoth.extractRawText({ path: bkFile })).value;
          const bkPackage = JSON.parse(readFileSync('backend/src/db/ss1/subjects/bookkeeping.json', 'utf8'));
          const { applyRules, originalLessonId } = await import('./backend/src/db/ss1/compiler.ts');
          const bkSource = bkPackage.sources.find(s => s.source_id === 'SS1-SRC-62b02f2adcb3');
          const bkCorrection = bkPackage.delivery_corrections.find(c => c.id === 'CORR-BK-T1-W04');
          const correctedText = applyRules({ source_id: bkSource.source_id, sha256: bkSource.sha256, filePath: bkFile, text: bkText }, bkPackage.source_rules.filter(r => r.source_id === bkSource.source_id));
          const bkRows = parseTopics(correctedText);
          const original = bkRows.find(row => originalLessonId(bkSource.source_id, row.body) === bkCorrection.source_lesson_id);
          const replacement = bkPackage.lessons.find(l => l.id === bkCorrection.replacement_id);
          console.log('BOOKKEEPING_CORRECTION_DIAGNOSTIC', JSON.stringify({
            sourceHashMatches: bkSource.sha256 === bkCorrection.source_sha256,
            originalFound: Boolean(original),
            actualOriginalId: original ? originalLessonId(bkSource.source_id, original.body) : null,
            bodyHashMatches: original ? createHash('sha256').update(original.body, 'utf8').digest('hex') === bkCorrection.body_sha256 : false,
            replacementFound: Boolean(replacement),
            replacementTerm: replacement?.term ?? null,
            originalTerm: bkSource.term,
            termsMatch: Boolean(replacement && replacement.term === bkSource.term),
            rules: bkPackage.source_rules.filter(r => r.source_id === bkSource.source_id).map(r => ({ id: r.id, op: r.op })),
            parsedRowsAfterRules: bkRows.map(row => ({ weekLabel: row.weekLabel, title: row.title, id: originalLessonId(bkSource.source_id, row.body) })),
          }));
          NODE
      - name: Compile every registered SS1 subject in plan-only mode
        run: |
          python scripts/ss1/build_subject_packages.py \
            --root "$RUNNER_TEMP/ss1-staged" \
            --output "$RUNNER_TEMP/ss1-cross-subject-plan.json"
      - name: Report subject coverage and remaining owner gates
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan_path = Path(os.environ["RUNNER_TEMP"]) / "ss1-cross-subject-plan.json"
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          print(json.dumps({
              "version": plan.get("version"),
              "compiled_rows": len(plan.get("rows", [])),
              "identified_rows": len(plan.get("identified_rows", [])),
              "dispositions": len(plan.get("dispositions", [])),
              "blockers": plan.get("blockers", []),
              "ready": plan.get("ready"),
          }, indent=2))
          PY
