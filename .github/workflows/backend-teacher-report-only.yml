name: Teacher report-only authorization gate

on:
  pull_request:
    paths:
      - "backend/src/middleware/auth.ts"
      - "backend/src/routes/students.ts"
      - "backend/src/routes/scores.ts"
      - "backend/src/routes/attendance.ts"
      - "backend/src/routes/learning.ts"
      - "backend/src/routes/messages.ts"
      - "backend/src/routes/weeklyEfforts.ts"
      - "tests/backend-teacher-report-only.test.mts"
      - ".github/workflows/backend-teacher-report-only.yml"
  push:
    branches: [master]
    paths:
      - "backend/src/middleware/auth.ts"
      - "backend/src/routes/students.ts"
      - "backend/src/routes/scores.ts"
      - "backend/src/routes/attendance.ts"
      - "backend/src/routes/learning.ts"
      - "backend/src/routes/messages.ts"
      - "backend/src/routes/weeklyEfforts.ts"
      - "tests/backend-teacher-report-only.test.mts"
      - ".github/workflows/backend-teacher-report-only.yml"

permissions:
  contents: read

jobs:
  teacher-report-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test teacher report-only middleware
        run: node --import tsx --test tests/backend-teacher-report-only.test.mts
      - name: Build backend
        run: npm run build --workspace backend
