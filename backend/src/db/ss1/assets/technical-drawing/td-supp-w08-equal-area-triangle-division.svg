<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc"><title id="title">Equal area division of a triangle</title><desc id="desc">A triangle partitioned into four equal-area regions by parallel lines at square-root proportional distances from the apex.</desc><rect width="600" height="380" fill="#fff"/><g fill="none" stroke="#172554" stroke-width="3" stroke-linejoin="round"><path d="M300 55 L90 320 L510 320 Z"/><path d="M195 187.5 H405 M151.5 242.4 H448.5 M118.5 284 H481.5" stroke="#0f766e" stroke-width="2.5"/></g><g font-family="Arial,sans-serif" font-size="18" fill="#111827"><text x="300" y="35" text-anchor="middle">A</text><text x="75" y="345">B</text><text x="520" y="345">C</text><text x="300" y="370" text-anchor="middle">Four equal areas — division distances are not equally spaced</text><text x="455" y="183">0.500h</text><text x="455" y="237">0.707h</text><text x="455" y="280">0.866h</text></g></svg>