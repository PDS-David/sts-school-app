<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">Equal area triangle and parallelogram</title><desc id="desc">A parallelogram and a triangle with the same base and related perpendicular heights, showing equal area.</desc><rect width="600" height="360" fill="#fff"/><g fill="none" stroke="#172554" stroke-width="3" stroke-linejoin="round"><path d="M70 270 L270 270 L330 130 L130 130 Z"/><path d="M370 270 L560 270 L465 130 Z"/><path d="M130 130 L130 270 M465 130 L465 270" stroke="#64748b" stroke-dasharray="8 7"/><path d="M120 270 L120 258 L130 258 M455 270 L455 258 L465 258" stroke="#64748b"/></g><g font-family="Arial,sans-serif" font-size="19" fill="#111827"><text x="75" y="300">Parallelogram</text><text x="400" y="300">Triangle</text><text x="90" y="115">h</text><text x="480" y="115">2h</text><text x="175" y="330">base b</text><text x="430" y="330">base b</text><text x="300" y="55" text-anchor="middle" font-size="22">bh = ½ × b × 2h</text></g></svg>