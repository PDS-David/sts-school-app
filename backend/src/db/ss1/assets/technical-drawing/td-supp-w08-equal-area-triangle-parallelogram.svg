<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc"><title id="title">Equal area triangle and parallelogram</title><desc id="desc">A parallelogram and a triangle with the same base and related perpendicular heights, showing equal area.</desc><rect width="600" height="380" fill="#fff"/><g fill="none" stroke="#172554" stroke-width="3" stroke-linejoin="round"><path d="M70 320 L270 320 L330 180 L130 180 Z"/><path d="M370 320 L570 320 L470 40 Z"/><path d="M130 180 L130 320 M470 40 L470 320" stroke="#64748b" stroke-dasharray="8 7"/><path d="M120 320 L120 308 L130 308 M460 320 L460 308 L470 308" stroke="#64748b"/></g><g font-family="Arial,sans-serif" font-size="19" fill="#111827"><text x="75" y="345">Parallelogram</text><text x="400" y="345">Triangle</text><text x="90" y="165">h</text><text x="485" y="165">2h</text><text x="175" y="370">base b</text><text x="430" y="370">base b</text><text x="300" y="25" text-anchor="middle" font-size="22">bh = ½ × b × 2h</text></g></svg>