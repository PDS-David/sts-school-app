<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">Radius perpendicular to tangent</title><desc id="desc">A circle touches a horizontal tangent line at T. The radius from centre O to T meets the tangent at a right angle.</desc><rect width="600" height="360" fill="#fff"/><g fill="none" stroke="#172554" stroke-width="3"><circle cx="300" cy="145" r="120"/><path d="M55 265 H545"/><path d="M300 145 V265" stroke="#0f766e" stroke-width="4"/><path d="M300 245 H320 V265" stroke="#0f766e" stroke-width="2"/></g><g font-family="Arial,sans-serif" font-size="22" fill="#111827"><text x="315" y="140">O</text><text x="315" y="290" fill="#0f766e">T</text><text x="335" y="210" fill="#0f766e">r</text><text x="300" y="330" text-anchor="middle">OT ⟂ tangent at T</text></g></svg>