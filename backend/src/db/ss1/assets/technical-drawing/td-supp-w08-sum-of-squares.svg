<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">Square equal to the sum of two squares</title><desc id="desc">Two perpendicular lengths form a right triangle. The hypotenuse is the side of the square equal in area to the sum of the two given squares.</desc><rect width="600" height="360" fill="#fff"/><g fill="none" stroke="#172554" stroke-width="3" stroke-linejoin="round"><path d="M110 270 L110 110 L330 270 Z"/><path d="M110 110 L330 270" stroke="#0f766e" stroke-width="4"/><path d="M110 250 H130 V270"/></g><g font-family="Arial,sans-serif" font-size="20" fill="#111827"><text x="80" y="195">a</text><text x="205" y="300">b</text><text x="230" y="175" fill="#0f766e">√(a²+b²)</text><text x="420" y="115" text-anchor="middle" font-size="22">Required square</text><rect x="365" y="145" width="110" height="110" fill="none" stroke="#0f766e" stroke-width="3"/><text x="420" y="280" text-anchor="middle">Area = a²+b²</text><text x="300" y="45" text-anchor="middle" font-size="22">Perpendicular lengths and hypotenuse</text></g></svg>