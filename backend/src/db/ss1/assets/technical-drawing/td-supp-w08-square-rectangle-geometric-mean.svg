<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">Square equal in area to a rectangle</title><desc id="desc">Geometric mean construction: a semicircle over a line divided into lengths l and w, with perpendicular height equal to square root of lw.</desc><rect width="600" height="360" fill="#fff"/><g fill="none" stroke="#172554" stroke-width="3"><path d="M90 250 H510"/><path d="M90 250 A210 210 0 0 1 510 250"/><path d="M300 250 V40" stroke="#64748b" stroke-dasharray="7 6"/><path d="M300 250 V40" stroke="#0f766e" stroke-width="4"/><path d="M90 250 V230 H110 M300 250 V230 H320"/></g><g font-family="Arial,sans-serif" font-size="20" fill="#111827"><text x="190" y="285" text-anchor="middle">l</text><text x="405" y="285" text-anchor="middle">w</text><text x="315" y="130" fill="#0f766e">√(lw)</text><text x="300" y="30" text-anchor="middle" font-size="22">Geometric-mean construction (schematic)</text><text x="300" y="330" text-anchor="middle">Square side s = √(l × w)</text></g></svg>