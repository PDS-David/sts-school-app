<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="title desc"><title id="title">Linear and area reduction ratios</title><desc id="desc">An original rectangle and a reduced similar rectangle show a linear scale factor of three fifths and an area ratio of nine twenty-fifths.</desc><rect width="600" height="340" fill="#fff"/><g fill="none" stroke="#172554" stroke-width="3"><rect x="70" y="95" width="250" height="125"/><rect x="390" y="120" width="150" height="75" stroke="#0f766e" stroke-width="4"/></g><g font-family="Arial,sans-serif" font-size="20" fill="#111827"><text x="195" y="70" text-anchor="middle">Original</text><text x="465" y="95" text-anchor="middle">Reduced</text><text x="195" y="250" text-anchor="middle">Length ratio = 5 units</text><text x="465" y="225" text-anchor="middle">Length ratio = 3 units</text><text x="300" y="295" text-anchor="middle" font-size="23">Linear ratio = 3:5</text><text x="300" y="325" text-anchor="middle" font-size="23" fill="#0f766e">Area ratio = (3/5)² = 9:25</text></g></svg>