<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">Common external tangent to equal circles</title><desc id="desc">Two equal circles have a common horizontal external tangent touching each circle at its topmost point. Each radius to a contact point is perpendicular to the tangent.</desc><rect width="600" height="360" fill="#fff"/><g fill="none" stroke="#172554" stroke-width="3"><circle cx="180" cy="210" r="75"/><circle cx="420" cy="210" r="75"/><path d="M70 135 H530" stroke="#0f766e" stroke-width="4"/><path d="M180 210 V135 M420 210 V135" stroke="#64748b" stroke-width="3"/><path d="M180 135 H198 V153 M420 135 H438 V153" stroke="#64748b" stroke-width="2"/><path d="M180 210 L420 210" stroke="#94a3b8" stroke-dasharray="7 6"/></g><g font-family="Arial,sans-serif" font-size="21" fill="#111827"><text x="170" y="235">P</text><text x="410" y="235">Q</text><text x="165" y="120" fill="#0f766e">T₁</text><text x="405" y="120" fill="#0f766e">T₂</text><text x="300" y="85" text-anchor="middle">Common external tangent</text><text x="300" y="315" text-anchor="middle">Radii to T₁ and T₂ are perpendicular to the tangent</text></g></svg>