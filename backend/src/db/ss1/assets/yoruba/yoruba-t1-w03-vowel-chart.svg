<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Àtòjọ fáwẹ́lì Yorùbá</title>
  <desc id="desc">Àwòrán fáwẹ́lì ẹnu méje nípa gíga ahọ́n àti ipò ahọ́n, pẹ̀lú àtòjọ fáwẹ́lì imú márùn-ún ní ìsàlẹ̀.</desc>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172554">Àtòjọ Fáwẹ́lì Yorùbá</text>
  <text x="450" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">Fáwẹ́lì ẹnu méje: gíga ahọ́n àti ibi tí ahọ́n dojú kọ</text>
  <line x1="120" y1="120" x2="780" y2="120" stroke="#64748b" stroke-width="2"/>
  <text x="245" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">IWÁJÚ</text>
  <text x="450" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">ÀÁRÍN</text>
  <text x="655" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Ẹ̀YÌN</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#334155" text-anchor="middle">
    <text x="75" y="178">GÍGA</text><text x="75" y="268">ÀÁRÍN-GÍGA</text><text x="75" y="358">ÀÁRÍN-ÌSÀLẸ̀</text><text x="75" y="448">ÌSÀLẸ̀</text>
  </g>
  <g fill="#dbeafe" stroke="#1d4ed8" stroke-width="2">
    <rect x="190" y="140" width="110" height="66" rx="12"/><rect x="600" y="140" width="110" height="66" rx="12"/>
    <rect x="190" y="230" width="110" height="66" rx="12"/><rect x="600" y="230" width="110" height="66" rx="12"/>
    <rect x="190" y="320" width="110" height="66" rx="12"/><rect x="600" y="320" width="110" height="66" rx="12"/>
    <rect x="395" y="410" width="110" height="66" rx="12"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="245" y="180" font-size="31" font-weight="700">i</text><text x="245" y="197" font-size="13">/i/</text>
    <text x="655" y="180" font-size="31" font-weight="700">u</text><text x="655" y="197" font-size="13">/u/</text>
    <text x="245" y="270" font-size="31" font-weight="700">e</text><text x="245" y="287" font-size="13">/e/</text>
    <text x="655" y="270" font-size="31" font-weight="700">o</text><text x="655" y="287" font-size="13">/o/</text>
    <text x="245" y="360" font-size="31" font-weight="700">ẹ</text><text x="245" y="377" font-size="13">/ɛ/</text>
    <text x="655" y="360" font-size="31" font-weight="700">ọ</text><text x="655" y="377" font-size="13">/ɔ/</text>
    <text x="450" y="450" font-size="31" font-weight="700">a</text><text x="450" y="467" font-size="13">/a/</text>
  </g>
  <text x="450" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172554">Fáwẹ́lì imú márùn-ún (àkọtọ́ àti IPA)</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a" font-size="20">
    <text x="180" y="555">an /ã/</text><text x="315" y="555">ẹn /ɛ̃/</text><text x="450" y="555">in /ĩ/</text><text x="585" y="555">ọn /ɔ̃/</text><text x="720" y="555">un /ũ/</text>
  </g>
  <text x="450" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Àkíyèsí: Àmì abẹ́lẹ̀ inú ẹ àti ọ jẹ́ apá pàtàkì ti àkọtọ́.</text>
</svg>