<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="t d"><title id="t">Capillary rise and depression</title><desc id="d">Water rises in a glass capillary and forms a concave meniscus; mercury is depressed and forms a convex meniscus.</desc><rect width="760" height="400" fill="#fff"/><g fill="#263238" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle"><text x="190" y="40">Water in glass</text><text x="570" y="40">Mercury in glass</text></g><g stroke="#263238" stroke-width="5" fill="none"><path d="M125 90 V330 H255 V90 M505 90 V330 H635 V90"/></g><path d="M130 200 Q190 145 250 200 V325 H130Z" fill="#90caf9" stroke="#1565c0" stroke-width="2"/><path d="M510 245 Q570 190 630 245 V325 H510Z" fill="#b0bec5" stroke="#455a64" stroke-width="2"/><path d="M90 280 H290 M470 210 H670" stroke="#78909c" stroke-width="2" stroke-dasharray="7 6"/><g fill="#263238" font-family="Arial,sans-serif" font-size="18"><text x="80" y="365">Concave meniscus; rises</text><text x="455" y="365">Convex meniscus; falls</text></g><g stroke="#ef6c00" stroke-width="4" fill="none"><path d="M190 270 V210 M182 220 L190 210 L198 220"/><path d="M570 215 V265 M562 255 L570 265 L578 255"/></g></svg>