<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
<rect width="1100" height="760" fill="#fff"/><style>.pt{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:25px;font-weight:bold}.s{font-size:18px}.m{stroke:#263746;stroke-width:3;fill:none}.accent{stroke:#b33a3a;stroke-width:4}.blue{stroke:#1769aa;stroke-width:3;fill:none}.panel{fill:#f7f9fb;stroke:#c8d2dc;stroke-width:2}</style>
<text x="35" y="42" class="pt h">Clear replacement examples: micrometer and vernier readings</text>
<rect x="35" y="75" width="1030" height="185" rx="10" class="panel"/><text x="60" y="110" class="pt s">A. Micrometer screw gauge</text><text x="60" y="145" class="pt s">Sleeve reading = 17.00 mm</text><text x="60" y="175" class="pt s">Thimble coincidence = 11 divisions; least count = 0.01 mm</text><text x="60" y="220" class="pt h">Total = 17.00 + (11 × 0.01) = 17.11 mm</text>
<g transform="translate(600 120)"><rect x="0" y="0" width="380" height="65" rx="8" fill="#e9eef2" stroke="#263746" stroke-width="3"/><path d="M15 30 H365" class="m"/><g class="m"><path d="M30 15 V45 M75 15 V45 M120 15 V45 M165 15 V45 M210 15 V45 M255 15 V45 M300 15 V45 M345 15 V45"/></g><rect x="220" y="-5" width="150" height="75" fill="#dceaf5" stroke="#263746" stroke-width="3"/><path d="M235 0 V65 M250 0 V65 M265 0 V65 M280 0 V65 M295 0 V65 M310 0 V65 M325 0 V65 M340 0 V65 M355 0 V65" stroke="#263746" stroke-width="2"/><path d="M325 0 V65" class="accent"/><text x="225" y="100" class="pt s">11th thimble division</text></g>
<rect x="35" y="285" width="1030" height="205" rx="10" class="panel"/><text x="60" y="320" class="pt s">B. Vernier callipers</text><text x="60" y="350" class="pt s">Main scale reading = 4.30 cm; 7th vernier division coincides; least count = 0.01 cm</text><text x="60" y="390" class="pt h">Total = 4.30 + (7 × 0.01) = 4.37 cm</text>
<g transform="translate(80 420)"><path d="M0 0 H900" class="m"/><g class="m"><path d="M0 -15 V15 M90 -15 V15 M180 -15 V15 M270 -15 V15 M360 -15 V15 M450 -15 V15 M540 -15 V15 M630 -15 V15 M720 -15 V15 M810 -15 V15"/></g><text x="-5" y="40" class="pt s">4.0</text><text x="85" y="40" class="pt s">4.1</text><text x="175" y="40" class="pt s">4.2</text><text x="265" y="40" class="pt s">4.3</text><text x="355" y="40" class="pt s">4.4</text><path d="M265 55 H895" class="blue"/><g class="m"><path d="M265 55 V85 M328 55 V85 M391 55 V85 M454 55 V85 M517 55 V85 M580 55 V85 M643 55 V85 M706 55 V85 M769 55 V85 M832 55 V85"/></g><path d="M706 50 V90" class="accent"/><text x="660" y="120" class="pt s">7th division</text></g>
<rect x="35" y="515" width="1030" height="205" rx="10" class="panel"/><text x="60" y="550" class="pt s">C. Vernier callipers — second example</text><text x="60" y="580" class="pt s">Main scale reading = 1.70 cm; 6th vernier division coincides; least count = 0.01 cm</text><text x="60" y="620" class="pt h">Total = 1.70 + (6 × 0.01) = 1.76 cm</text><text x="60" y="675" class="pt s">Use: corrected reading = observed reading − zero error. These are newly authored replacement examples, not readings claimed from the low-resolution source figures.</text>
</svg>