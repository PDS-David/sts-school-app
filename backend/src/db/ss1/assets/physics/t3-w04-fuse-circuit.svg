<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">Fuse connected in series</title><desc id="d">A battery, switch, fuse and lamp are connected in one series loop. The fuse is placed in series so excess current melts its element and opens the circuit.</desc><rect width="760" height="340" fill="#fff"/><g stroke="#263238" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M130 90 H245 M335 90 H435 M525 90 H630 V260 H130 V90"/><path d="M245 90 L270 70 M270 90 H335"/><rect x="435" y="68" width="90" height="44" rx="8"/><path d="M130 145 V230 M110 165 H150 M118 185 H142"/></g><g fill="#263238" font-family="Arial,sans-serif" font-size="20"><text x="220" y="50">Switch</text><text x="450" y="50">Fuse</text><text x="80" y="280">Battery</text><text x="600" y="180">Lamp/load</text><text x="225" y="315">Fuse is connected in series with the load.</text></g><circle cx="630" cy="175" r="30" fill="#fff3e0" stroke="#ef6c00" stroke-width="4"/><path d="M610 155 L650 195 M650 155 L610 195" stroke="#ef6c00" stroke-width="4"/></svg>