<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#fff"/><style>.pt{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:25px;font-weight:bold}.s{font-size:18px}.line{stroke:#263746;stroke-width:3;fill:none}.water{fill:#cfe5f5;stroke:#1769aa;stroke-width:2}</style>
<text x="35" y="42" class="pt h">Density and relative density</text><rect x="90" y="130" width="210" height="170" fill="#f4f7fa" stroke="#263746" stroke-width="3"/><path d="M90 210 H300 V298 H90 Z" class="water"/><rect x="155" y="170" width="75" height="40" fill="#d7b77b" stroke="#263746" stroke-width="3"/><text x="105" y="335" class="pt s">Mass m and volume V</text><text x="115" y="365" class="pt s">ρ = m/V</text><path d="M360 210 H500 M475 190 L500 210 L475 230" class="line"/><rect x="570" y="130" width="220" height="170" fill="#f4f7fa" stroke="#263746" stroke-width="3"/><path d="M570 210 H790 V298 H570 Z" class="water"/><rect x="650" y="170" width="75" height="40" fill="#d7b77b" stroke="#263746" stroke-width="3"/><text x="585" y="335" class="pt s">Relative density</text><text x="585" y="365" class="pt s">= density of substance / density of water</text>
</svg>