<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:25px;font-weight:bold}.s{font-size:18px}.axis{stroke:#263746;stroke-width:3;fill:none}.curve{stroke:#1769aa;stroke-width:5;fill:none}.shade{fill:#cfe3f5;stroke:none}</style>
<text x="35" y="42" class="h">Reading motion graphs</text>
<g transform="translate(60 100)"><text x="0" y="0" class="s">Distance–time graph</text><path d="M45 330 V35 M45 330 H390" class="axis"/><path d="M45 330 L340 80" class="curve"/><text x="15" y="45" class="s">d</text><text x="365" y="355" class="s">t</text><text x="135" y="200" class="s">gradient = speed</text></g>
<g transform="translate(535 100)"><text x="0" y="0" class="s">Velocity–time graph</text><path d="M45 330 V35 M45 330 H390" class="axis"/><path d="M45 330 L170 100 L300 100 L360 330 Z" class="shade"/><path d="M45 330 L170 100 L300 100 L360 330" class="curve"/><text x="15" y="45" class="s">v</text><text x="365" y="355" class="s">t</text><text x="100" y="190" class="s">slope = acceleration</text><text x="175" y="280" class="s">area = displacement</text></g>
<text x="65" y="515" class="s">A straight line on a distance–time graph has constant speed; a horizontal velocity–time segment has constant velocity.</text>
</svg>