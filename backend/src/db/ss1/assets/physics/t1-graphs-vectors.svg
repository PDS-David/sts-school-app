<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Vectors and motion graphs</title><desc id="d">Vector addition triangle and straight-line displacement-time and velocity-time graphs with gradient and area meanings.</desc><rect width="900" height="430" fill="#fff"/><text x="130" y="35" font-size="23" font-family="Arial,sans-serif" fill="#263238">Vector addition</text><path d="M90 270 H300 V120" fill="none" stroke="#1565c0" stroke-width="6"/><path d="M300 120 L90 270" stroke="#d32f2f" stroke-width="6"/><text x="185" y="295" font-size="18" font-family="Arial,sans-serif" fill="#263238">A</text><text x="315" y="190" font-size="18" font-family="Arial,sans-serif" fill="#263238">B</text><text x="165" y="170" font-size="18" font-family="Arial,sans-serif" fill="#263238">R</text><text x="410" y="35" font-size="23" font-family="Arial,sans-serif" fill="#263238">Displacement–time</text><path d="M430 290 V85 M430 290 H690" stroke="#263238" stroke-width="4" fill="none"/><path d="M445 270 L655 120" stroke="#1565c0" stroke-width="6"/><text x="535" y="320" font-size="17" font-family="Arial,sans-serif" fill="#263238">Time</text><text x="400" y="80" font-size="17" font-family="Arial,sans-serif" fill="#263238">s</text><text x="575" y="160" font-size="17" font-family="Arial,sans-serif" fill="#263238">Gradient = velocity</text><text x="710" y="35" font-size="23" font-family="Arial,sans-serif" fill="#263238">Velocity–time</text><path d="M735 290 V85 M735 290 H875" stroke="#263238" stroke-width="4" fill="none"/><path d="M750 270 L850 120 L850 270 Z" fill="#bbdefb" stroke="#1565c0" stroke-width="4"/><text x="780" y="320" font-size="17" font-family="Arial,sans-serif" fill="#263238">Time</text><text x="710" y="80" font-size="17" font-family="Arial,sans-serif" fill="#263238">v</text><text x="750" y="180" font-size="17" font-family="Arial,sans-serif" fill="#263238">Area = distance</text></svg>