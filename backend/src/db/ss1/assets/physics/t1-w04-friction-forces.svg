<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<rect width="900" height="520" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:25px;font-weight:bold}.s{font-size:19px}.blk{fill:#dceaf5;stroke:#263746;stroke-width:3}.force{stroke:#1769aa;stroke-width:5;fill:none}.red{stroke:#b33a3a;stroke-width:5;fill:none}.plane{stroke:#263746;stroke-width:7}</style>
