<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Electric field patterns</title><desc id="d">Field lines point away from a positive charge, towards a negative charge, and from positive to negative in a dipole.</desc><rect width="900" height="360" fill="#fff"/><g fill="#263238" font-family="Arial,sans-serif" font-size="20"><text x="95" y="35">Positive charge</text><text x="375" y="35">Negative charge</text><text x="660" y="35">Unlike charges</text></g><g stroke="#1565c0" stroke-width="3" fill="none"><path d="M145 180 H55 M145 180 L75 110 M145 180 L145 80 M145 180 L215 110 M145 180 H235 M145 180 L215 250 M145 180 L145 280 M145 180 L75 250"/><path d="M425 180 H335 M425 180 L355 110 M425 180 L425 80 M425 180 L495 110 M425 180 H515 M425 180 L495 250 M425 180 L425 280 M425 180 L355 250"/></g><g stroke="#1565c0" stroke-width="3" fill="none"><path d="M700 180 C735 90 800 90 835 180 M700 180 C735 270 800 270 835 180 M700 180 C750 130 785 130 835 180 M700 180 C750 230 785 230 835 180"/></g><g fill="#ef6c00" stroke="#263238" stroke-width="3"><circle cx="145" cy="180" r="24"/><circle cx="425" cy="180" r="24"/><circle cx="700" cy="180" r="24"/><circle cx="835" cy="180" r="24"/></g><g fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle"><text x="145" y="190">+</text><text x="425" y="190">−</text><text x="700" y="190">+</text><text x="835" y="190">−</text></g><g fill="#263238" font-family="Arial,sans-serif" font-size="17"><text x="90" y="330">Lines point outward</text><text x="370" y="330">Lines point inward</text><text x="650" y="330">Lines go from + to −</text></g></svg>