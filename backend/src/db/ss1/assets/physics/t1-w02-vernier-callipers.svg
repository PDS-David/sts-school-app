<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="t d"><title id="t">Vernier callipers reading</title><desc id="d">Original schematic showing external jaws, main scale and vernier scale. Example reading: 4.30 centimetres plus 0.07 centimetres equals 4.37 centimetres.</desc><rect width="760" height="360" fill="#fff"/><g stroke="#263238" stroke-width="8" fill="none" stroke-linecap="round"><path d="M90 100 V265 H675"/><path d="M90 100 H150 V145"/><path d="M90 265 H150 V220"/></g><g stroke="#455a64" stroke-width="2"><path d="M190 265 V242 M230 265 V248 M270 265 V242 M310 265 V248 M350 265 V242 M390 265 V248 M430 265 V242 M470 265 V248 M510 265 V242 M550 265 V248 M590 265 V242 M630 265 V248"/></g><g stroke="#1565c0" stroke-width="5" fill="none"><rect x="385" y="170" width="220" height="55" rx="5"/><path d="M405 225 V245 M425 225 V245 M445 225 V245 M465 225 V245 M485 225 V245 M505 225 V245 M525 225 V245 M545 225 V245 M565 225 V245 M585 225 V245"/></g><g fill="#263238" font-family="Arial,sans-serif" font-size="20"><text x="90" y="55">External jaws</text><text x="250" y="305">Main scale: 4.30 cm</text><text x="405" y="150" fill="#1565c0">Vernier: 7 × 0.01 cm = 0.07 cm</text><text x="380" y="340" font-weight="700">Total reading = 4.30 + 0.07 = 4.37 cm</text></g></svg>