<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<rect width="900" height="520" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:25px;font-weight:bold}.s{font-size:18px}.line{stroke:#263746;stroke-width:4;fill:none}.blue{stroke:#1769aa;stroke-width:5;fill:none}.red{stroke:#b33a3a;stroke-width:5;fill:none}</style>
<text x="40" y="42" class="h">Motion: paths and circular motion</text>
<text x="55" y="92" class="s">Translational motion</text><path d="M70 145 H380" class="line"/><circle cx="70" cy="145" r="8" fill="#1769aa"/><circle cx="380" cy="145" r="8" fill="#1769aa"/><path d="M350 132 L380 145 L350 158" class="blue"/><text x="62" y="180" class="s">A</text><text x="370" y="180" class="s">B</text>
<text x="500" y="92" class="s">Random motion</text><path d="M515 145 l35 -30 28 48 48 -34 24 41 40 -56 40 26 34 -32" class="line"/><path d="M550 115 l-2 17 17 -5 M650 129 l-2 17 17 -5" class="blue"/>
<text x="55" y="245" class="s">Oscillatory motion</text><path d="M95 270 V300 M95 300 Q155 400 215 300" class="line"/><circle cx="215" cy="300" r="13" fill="#1769aa"/><path d="M195 284 L215 300 L195 316" class="blue"/><text x="260" y="310" class="s">A pendulum moves to and fro about a fixed point.</text>
<text x="500" y="245" class="s">Uniform circular motion</text><circle cx="660" cy="360" r="105" class="line"/><circle cx="765" cy="360" r="11" fill="#1769aa"/><path d="M765 360 H660" class="red"/><text x="685" y="350" class="s">r</text><path d="M765 360 V255" class="blue"/><path d="M751 277 L765 255 L779 277" class="blue"/><text x="780" y="260" class="s">v (tangent)</text><path d="M735 360 H690" class="red"/><path d="M705 347 L690 360 L705 373" class="red"/><text x="535" y="410" class="s">a and F point towards the centre</text><text x="55" y="475" class="s">Centripetal acceleration: a = v²/r   •   Centripetal force: F = mv²/r</text>
</svg>