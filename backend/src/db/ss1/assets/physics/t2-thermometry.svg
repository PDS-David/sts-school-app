<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">Thermometer and fixed points</title><desc id="d">Liquid-in-glass thermometer showing bulb, capillary, scale, lower fixed point 0 degrees Celsius and upper fixed point 100 degrees Celsius.</desc><rect width="760" height="420" fill="#fff"/><rect x="320" y="55" width="70" height="280" rx="32" fill="#eceff1" stroke="#263238" stroke-width="4"/><rect x="347" y="90" width="16" height="220" fill="#e53935"/><circle cx="355" cy="345" r="38" fill="#e53935" stroke="#263238" stroke-width="4"/><g stroke="#263238" stroke-width="3"><path d="M390 110 H435 M390 150 H420 M390 190 H435 M390 230 H420 M390 270 H435"/></g><text x="455" y="115" font-size="20" font-family="Arial,sans-serif" fill="#263238">100 °C upper fixed point</text><text x="455" y="275" font-size="20" font-family="Arial,sans-serif" fill="#263238">0 °C lower fixed point</text><text x="420" y="60" font-size="20" font-family="Arial,sans-serif" fill="#263238">Scale</text><text x="70" y="170" font-size="20" font-family="Arial,sans-serif" fill="#263238">Capillary tube</text><path d="M230 175 H320" stroke="#1565c0" stroke-width="3"/><text x="70" y="360" font-size="20" font-family="Arial,sans-serif" fill="#263238">Bulb contains thermometric liquid</text><path d="M270 345 H320" stroke="#1565c0" stroke-width="3"/></svg>