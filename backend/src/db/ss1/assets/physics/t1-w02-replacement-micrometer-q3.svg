<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Replacement micrometer reading 5.25 mm</title><desc id="d">Original micrometer schematic. Sleeve reads 5.00 mm and thimble reads 25 divisions at 0.01 mm each, total 5.25 mm.</desc><rect width="760" height="300" fill="#fff"/><g stroke="#263238" stroke-width="8" fill="none"><path d="M70 105 H550 V205 H70 Z"/><path d="M70 105 V205 M550 85 V225"/></g><g stroke="#455a64" stroke-width="3"><path d="M120 105 V75 M180 105 V90 M240 105 V75 M300 105 V90 M360 105 V75 M420 105 V90 M480 105 V75"/></g><g stroke="#1565c0" stroke-width="5" fill="none"><rect x="550" y="65" width="110" height="180" rx="18"/><path d="M550 155 H660"/></g><g stroke="#1565c0" stroke-width="3"><path d="M575 85 H600 M575 100 H600 M575 115 H600 M575 130 H600 M575 145 H600 M575 160 H600 M575 175 H600 M575 190 H600 M575 205 H600 M575 220 H600"/></g><g fill="#263238" font-family="Arial,sans-serif" font-size="22"><text x="355" y="55">Main scale: 5.00 mm</text><text x="70" y="260">Sleeve scale</text><text x="520" y="35" fill="#1565c0">Thimble</text><text x="70" y="290" font-weight="700">Reading = 5.00 + (25 × 0.01) = 5.25 mm</text></g></svg>