<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<rect width="1100" height="560" fill="#fff"/><style>.pt{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:25px;font-weight:bold}.s{font-size:18px}.rod{fill:#f3d5d5;stroke:#263746;stroke-width:3}.cond{fill:#dceaf5;stroke:#263746;stroke-width:3}.line{stroke:#263746;stroke-width:3;fill:none}.blue{stroke:#1769aa;stroke-width:4;fill:none}</style>
<text x="35" y="42" class="pt h">Charging an insulated conductor by induction</text>
<g transform="translate(40 95)"><text x="0" y="0" class="pt s">1. Bring a positive rod near a neutral conductor</text><rect x="15" y="90" width="115" height="38" rx="18" class="rod"/><text x="40" y="115" class="pt s">+ + +</text><rect x="250" y="90" width="180" height="38" rx="18" class="cond"/><g fill="#1769aa"><circle cx="285" cy="109" r="7"/><circle cx="315" cy="109" r="7"/><circle cx="345" cy="109" r="7"/></g><g fill="#b33a3a"><circle cx="390" cy="109" r="7"/><circle cx="415" cy="109" r="7"/></g><text x="235" y="160" class="pt s">Electrons shift towards the positive rod</text></g>
<g transform="translate(560 95)"><text x="0" y="0" class="pt s">2. Earth the far side while rod remains near</text><rect x="15" y="90" width="115" height="38" rx="18" class="rod"/><text x="40" y="115" class="pt s">+ + +</text><rect x="250" y="90" width="180" height="38" rx="18" class="cond"/><path d="M430 109 H490 V180 M470 180 H510 M477 190 H503 M485 200 H495" class="line"/><path d="M450 135 H500 M488 122 L500 135 L488 148" class="blue"/><text x="245" y="235" class="pt s">Electrons flow from Earth into the conductor</text></g>
<g transform="translate(160 340)"><text x="0" y="0" class="pt s">3. Remove the earth first, then remove the rod</text><rect x="180" y="40" width="220" height="44" rx="20" class="cond"/><g fill="#1769aa"><circle cx="220" cy="62" r="7"/><circle cx="260" cy="62" r="7"/><circle cx="300" cy="62" r="7"/><circle cx="340" cy="62" r="7"/><circle cx="380" cy="62" r="7"/></g><text x="180" y="125" class="pt s">The conductor is left with a net negative charge.</text></g>
</svg>