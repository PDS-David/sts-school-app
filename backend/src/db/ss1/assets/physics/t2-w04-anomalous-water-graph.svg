<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="t d"><title id="t">Anomalous expansion of water between 0 and 10 degrees Celsius</title><desc id="d">Original graph showing water volume decreasing as temperature rises from zero to four degrees Celsius, reaching a minimum at four degrees, then increasing above four degrees.</desc><rect width="760" height="430" fill="#fff"/><g stroke="#263238" stroke-width="4" fill="none"><path d="M95 45 V345 H690"/></g><g stroke="#78909c" stroke-width="2"><path d="M95 300 H690 M95 250 H690 M95 200 H690 M95 150 H690 M95 100 H690 M195 45 V345 M295 45 V345 M395 45 V345 M495 45 V345 M595 45 V345"/></g><path d="M95 120 C180 180 250 280 395 300 C500 300 600 235 690 110" fill="none" stroke="#1565c0" stroke-width="7"/><g fill="#263238" font-family="Arial,sans-serif" font-size="22"><text x="310" y="35">Relative volume of water</text><text x="340" y="395">Temperature (°C)</text><text x="55" y="70" transform="rotate(-90 55 70)">Volume</text><text x="88" y="372">0</text><text x="380" y="372">4</text><text x="675" y="372">10</text><text x="410" y="285" fill="#1565c0" font-weight="700">Minimum volume / maximum density at 4°C</text><text x="105" y="145" fill="#1565c0">Contracts as it warms</text><text x="525" y="160" fill="#1565c0">Expands normally</text></g><circle cx="395" cy="300" r="8" fill="#1565c0"/></svg>