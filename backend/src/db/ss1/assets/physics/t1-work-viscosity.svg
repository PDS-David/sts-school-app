<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Work and viscosity</title><desc id="d">A force moves a block through a displacement; a sphere falls through a viscous fluid with weight, drag and upthrust forces.</desc><rect width="900" height="420" fill="#fff"/><text x="180" y="35" font-size="23" font-family="Arial,sans-serif" fill="#263238">Work done by a force</text><path d="M70 310 H430" stroke="#263238" stroke-width="5"/><rect x="170" y="220" width="110" height="90" fill="#90a4ae" stroke="#263238" stroke-width="3"/><path d="M280 265 H390" stroke="#2e7d32" stroke-width="5"/><path d="M390 265 l-16 -10 v20 z" fill="#2e7d32"/><path d="M170 350 H390" stroke="#1565c0" stroke-width="3"/><text x="300" y="245" font-size="18" font-family="Arial,sans-serif" fill="#263238">F</text><text x="245" y="380" font-size="18" font-family="Arial,sans-serif" fill="#263238">Displacement s; W = Fs</text><text x="650" y="35" font-size="23" font-family="Arial,sans-serif" fill="#263238">Sphere at terminal velocity</text><rect x="560" y="80" width="260" height="290" fill="#e3f2fd" stroke="#263238" stroke-width="4"/><circle cx="690" cy="225" r="38" fill="#90a4ae" stroke="#263238" stroke-width="3"/><path d="M690 185 V110" stroke="#1565c0" stroke-width="5"/><path d="M690 110 l-10 16 h20 z" fill="#1565c0"/><path d="M690 265 V345" stroke="#d32f2f" stroke-width="5"/><path d="M690 345 l-10 -16 h20 z" fill="#d32f2f"/><path d="M650 225 H590" stroke="#2e7d32" stroke-width="5"/><path d="M590 225 l16 -10 v20 z" fill="#2e7d32"/><text x="705" y="120" font-size="17" font-family="Arial,sans-serif" fill="#263238">Upthrust</text><text x="705" y="345" font-size="17" font-family="Arial,sans-serif" fill="#263238">Weight</text><text x="565" y="205" font-size="17" font-family="Arial,sans-serif" fill="#263238">Drag</text><text x="570" y="400" font-size="17" font-family="Arial,sans-serif" fill="#263238">At terminal speed: W = drag + upthrust</text></svg>