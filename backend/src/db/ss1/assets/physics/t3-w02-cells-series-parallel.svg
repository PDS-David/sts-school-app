<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<rect width="1000" height="440" fill="#fff"/><style>.pt{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:25px;font-weight:bold}.s{font-size:18px}.wire{stroke:#263746;stroke-width:4;fill:none}</style>
<text x="35" y="42" class="pt h">Cells connected in series and parallel</text><text x="70" y="105" class="pt s">Series: positive terminal of one cell connects to negative terminal of the next</text><path d="M100 180 H230 M270 180 H420 M460 180 H600" class="wire"/><path d="M230 145 V215 M270 160 V200 M420 145 V215 M460 160 V200" stroke="#263746" stroke-width="4"/><text x="215" y="135" class="pt s">+</text><text x="270" y="225" class="pt s">−</text><text x="405" y="135" class="pt s">+</text><text x="460" y="225" class="pt s">−</text><text x="70" y="260" class="pt s">Emf adds: Eₜ = E₁ + E₂ (same direction)</text>
<text x="70" y="325" class="pt s">Parallel: like terminals are joined together</text><path d="M100 350 H250 M250 350 V390 M250 350 V310 M250 310 H420 M250 390 H420" class="wire"/><path d="M310 295 V325 M330 300 V320 M310 375 V405 M330 380 V400" stroke="#263746" stroke-width="4"/><text x="440" y="330" class="pt s">Same polarity: terminal voltage stays that of one cell;</text><text x="440" y="360" class="pt s">parallel connection can increase current capacity.</text>
</svg>