<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<rect width="1100" height="560" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:25px;font-weight:bold}.s{font-size:19px}.wire{stroke:#263746;stroke-width:4;fill:none}.res{fill:#fff;stroke:#263746;stroke-width:3}</style>
<text x="35" y="42" class="h">Resistors in series and parallel</text><text x="60" y="100" class="s">Series connection</text><path d="M60 180 H170 M260 180 H350 M440 180 H530 M620 180 H700" class="wire"/><rect x="170" y="155" width="90" height="50" class="res"/><rect x="350" y="155" width="90" height="50" class="res"/><rect x="530" y="155" width="90" height="50" class="res"/><text x="195" y="187" class="s">R₁</text><text x="375" y="187" class="s">R₂</text><text x="555" y="187" class="s">R₃</text><text x="60" y="240" class="s">Rₜ = R₁ + R₂ + R₃</text>
<text x="60" y="320" class="s">Parallel connection</text><path d="M60 370 H700 M60 500 H700 M170 370 V405 M170 465 V500 M390 370 V405 M390 465 V500 M610 370 V405 M610 465 V500" class="wire"/><rect x="145" y="405" width="50" height="60" class="res"/><rect x="365" y="405" width="50" height="60" class="res"/><rect x="585" y="405" width="50" height="60" class="res"/><text x="155" y="442" class="s">R₁</text><text x="375" y="442" class="s">R₂</text><text x="595" y="442" class="s">R₃</text><text x="760" y="395" class="s">1/Rₜ = 1/R₁ + 1/R₂ + 1/R₃</text><text x="760" y="445" class="s">Same potential difference</text><text x="760" y="475" class="s">across each branch.</text>
</svg>