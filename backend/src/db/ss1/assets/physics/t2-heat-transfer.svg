<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Three modes of heat transfer</title><desc id="d">Conduction through a heated metal bar, convection currents in a fluid and radiation from a hot source.</desc><rect width="900" height="430" fill="#fff"/><text x="130" y="35" font-size="23" font-family="Arial,sans-serif" fill="#263238">Conduction</text><rect x="80" y="150" width="220" height="55" fill="#b0bec5" stroke="#263238" stroke-width="3"/><path d="M90 205 q-20 30 0 45 M130 205 q-20 30 0 45" stroke="#e53935" stroke-width="5" fill="none"/><path d="M170 175 H280" stroke="#e53935" stroke-width="4"/><text x="90" y="290" font-size="18" font-family="Arial,sans-serif" fill="#263238">Energy passes through a solid</text><text x="400" y="35" font-size="23" font-family="Arial,sans-serif" fill="#263238">Convection</text><rect x="390" y="120" width="190" height="160" fill="#bbdefb" stroke="#263238" stroke-width="3"/><path d="M450 245 C405 205 420 155 480 150 C535 145 555 205 510 245" stroke="#e53935" stroke-width="5" fill="none"/><path d="M510 245 l-14 -6 12 -10" fill="none" stroke="#e53935" stroke-width="4"/><text x="385" y="310" font-size="18" font-family="Arial,sans-serif" fill="#263238">Warm fluid rises; cool fluid sinks</text><text x="680" y="35" font-size="23" font-family="Arial,sans-serif" fill="#263238">Radiation</text><circle cx="760" cy="180" r="45" fill="#ffcc80" stroke="#ef6c00" stroke-width="4"/><g stroke="#ef6c00" stroke-width="5"><path d="M760 95 V65 M760 265 V295 M675 180 H645 M845 180 H875 M700 120 L680 100 M820 240 L840 260 M820 120 L840 100 M700 240 L680 260"/></g><text x="650" y="330" font-size="18" font-family="Arial,sans-serif" fill="#263238">Energy travels by electromagnetic waves</text></svg>