<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="t d"><title id="t">Thermal expansion of a solid</title><desc id="d">A metal rod is shown before heating and after heating; the heated rod is longer because its particles vibrate more strongly and their average separation increases.</desc><rect width="760" height="360" fill="#fff"/><g fill="#455a64" font-family="Arial,sans-serif" font-size="22"><text x="90" y="55">Before heating</text><text x="440" y="55">After heating</text></g><g fill="#90a4ae" stroke="#263238" stroke-width="3"><rect x="95" y="105" width="230" height="48" rx="8"/><rect x="420" y="105" width="280" height="48" rx="8"/></g><g fill="#263238"><circle cx="120" cy="129" r="5"/><circle cx="155" cy="129" r="5"/><circle cx="190" cy="129" r="5"/><circle cx="225" cy="129" r="5"/><circle cx="260" cy="129" r="5"/><circle cx="295" cy="129" r="5"/><circle cx="445" cy="129" r="5"/><circle cx="485" cy="129" r="5"/><circle cx="525" cy="129" r="5"/><circle cx="565" cy="129" r="5"/><circle cx="605" cy="129" r="5"/><circle cx="645" cy="129" r="5"/></g><g stroke="#ef6c00" stroke-width="4" fill="none"><path d="M420 195 H700 M420 195 l14 -9 M420 195 l14 9 M700 195 l-14 -9 M700 195 l-14 9"/></g><g fill="#263238" font-family="Arial,sans-serif" font-size="20"><text x="100" y="240">Shorter length</text><text x="435" y="240">Longer length</text><text x="115" y="300">Heating increases particle vibration;</text><text x="115" y="328">average spacing increases slightly.</text></g></svg>