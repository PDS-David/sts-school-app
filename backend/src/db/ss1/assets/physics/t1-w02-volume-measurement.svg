<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
<rect width="1000" height="460" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:25px;font-weight:bold}.s{font-size:18px}.line{stroke:#263746;stroke-width:3;fill:none}.water{fill:#cfe5f5;stroke:#1769aa;stroke-width:2}</style>
<text x="35" y="42" class="h">Measuring the volume of an irregular solid</text><g transform="translate(100 100)"><path d="M60 40 V290 H220 V40" class="line"/><path d="M62 190 H218 V288 H62 Z" class="water"/><path d="M60 190 H220" stroke="#1769aa" stroke-width="3"/><text x="65" y="330" class="s">Initial volume V₁</text><text x="60" y="360" class="s">Read at eye level</text></g><path d="M360 210 H520 M490 190 L520 210 L490 230" class="line"/><text x="370" y="180" class="s">Immerse object fully</text><g transform="translate(620 100)"><path d="M60 40 V290 H220 V40" class="line"/><path d="M62 120 H218 V288 H62 Z" class="water"/><rect x="115" y="155" width="55" height="65" rx="8" fill="#d7b77b" stroke="#263746" stroke-width="3"/><path d="M60 120 H220" stroke="#1769aa" stroke-width="3"/><text x="65" y="330" class="s">Final volume V₂</text><text x="60" y="360" class="s">Volume of object = V₂ − V₁</text></g>
</svg>