<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Gravitational field and potential</title><desc id="d">Radial field lines point toward Earth; a graph shows gravitational potential becoming less negative with increasing distance.</desc><rect width="900" height="430" fill="#fff"/><text x="180" y="35" font-size="23" font-family="Arial,sans-serif" fill="#263238">Gravitational field</text><circle cx="230" cy="225" r="70" fill="#81c784" stroke="#263238" stroke-width="4"/><g stroke="#1565c0" stroke-width="4"><path d="M230 65 V145 M230 305 V385 M70 225 H150 M310 225 H390 M117 112 L180 175 M280 275 L343 338 M343 112 L280 175 M180 275 L117 338"/></g><g fill="#1565c0"><path d="M230 145 l-9 15 h18 z M230 305 l-9 -15 h18 z M150 225 l15 -9 v18 z M310 225 l-15 -9 v18 z"/></g><text x="185" y="235" font-size="18" font-family="Arial,sans-serif" fill="#263238">Earth</text><text x="540" y="35" font-size="23" font-family="Arial,sans-serif" fill="#263238">Gravitational potential</text><path d="M520 330 V90 M520 330 H860" stroke="#263238" stroke-width="4" fill="none"/><path d="M535 110 C580 220 650 275 840 300" stroke="#d32f2f" stroke-width="5" fill="none"/><text x="650" y="365" font-size="18" font-family="Arial,sans-serif" fill="#263238">Distance from centre</text><text x="485" y="85" font-size="18" font-family="Arial,sans-serif" fill="#263238">V</text><text x="670" y="260" font-size="18" font-family="Arial,sans-serif" fill="#263238">V approaches 0</text></svg>