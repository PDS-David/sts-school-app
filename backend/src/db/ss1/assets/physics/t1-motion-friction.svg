<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Circular motion and friction</title><desc id="d">Left: object moving in a circle with tangential velocity and centripetal force toward the centre. Right: block on a rough surface with weight, normal reaction, applied force and opposing friction.</desc><rect width="900" height="420" fill="#fff"/><text x="220" y="35" font-size="24" font-family="Arial,sans-serif" fill="#263238">Circular motion</text><circle cx="225" cy="220" r="120" fill="none" stroke="#78909c" stroke-width="4"/><circle cx="345" cy="220" r="14" fill="#1565c0"/><circle cx="225" cy="220" r="5" fill="#263238"/><path d="M345 220 H245" stroke="#d32f2f" stroke-width="5"/><path d="M245 220 l16 -10 v20 z" fill="#d32f2f"/><path d="M345 220 V120" stroke="#2e7d32" stroke-width="5"/><path d="M345 120 l-10 16 h20 z" fill="#2e7d32"/><text x="260" y="245" font-size="18" font-family="Arial,sans-serif" fill="#263238">F₍c₎ inward</text><text x="360" y="130" font-size="18" font-family="Arial,sans-serif" fill="#263238">v tangent</text><text x="175" y="210" font-size="18" font-family="Arial,sans-serif" fill="#263238">Centre</text><text x="650" y="35" font-size="24" font-family="Arial,sans-serif" fill="#263238">Friction on a block</text><path d="M520 320 H850" stroke="#263238" stroke-width="5"/><rect x="635" y="220" width="130" height="100" fill="#90a4ae" stroke="#263238" stroke-width="3"/><path d="M700 220 V145" stroke="#1565c0" stroke-width="5"/><path d="M700 145 l-10 16 h20 z" fill="#1565c0"/><path d="M700 320 V385" stroke="#d32f2f" stroke-width="5"/><path d="M700 385 l-10 -16 h20 z" fill="#d32f2f"/><path d="M765 270 H845" stroke="#2e7d32" stroke-width="5"/><path d="M845 270 l-16 -10 v20 z" fill="#2e7d32"/><path d="M635 270 H555" stroke="#ef6c00" stroke-width="5"/><path d="M555 270 l16 -10 v20 z" fill="#ef6c00"/><text x="710" y="140" font-size="18" font-family="Arial,sans-serif" fill="#263238">N</text><text x="710" y="385" font-size="18" font-family="Arial,sans-serif" fill="#263238">W = mg</text><text x="780" y="255" font-size="18" font-family="Arial,sans-serif" fill="#263238">Applied F</text><text x="525" y="255" font-size="18" font-family="Arial,sans-serif" fill="#263238">Friction</text><text x="635" y="350" font-size="18" font-family="Arial,sans-serif" fill="#263238">Rough surface</text></svg>