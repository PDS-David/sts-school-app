<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:25px;font-weight:bold}.s{font-size:18px}.box{fill:#f4f7fa;stroke:#263746;stroke-width:3}</style>
<text x="35" y="42" class="h">Sources of continuous electric current</text>
<g transform="translate(45 100)"><rect x="0" y="25" width="190" height="140" rx="10" class="box"/><path d="M45 75 V125 M35 90 H55 M40 110 H50" stroke="#263746" stroke-width="4"/><text x="75" y="85" class="s">Chemical cell</text><text x="20" y="195" class="s">Chemical energy</text><text x="20" y="220" class="s">→ electrical energy</text></g>
<g transform="translate(290 100)"><rect x="0" y="25" width="190" height="140" rx="10" class="box"/><path d="M35 130 L80 60 L125 130 Z" fill="#e7b25c" stroke="#263746" stroke-width="3"/><path d="M80 60 V35" stroke="#b33a3a" stroke-width="4"/><text x="95" y="85" class="s">Thermoelectric</text><text x="20" y="195" class="s">Heat difference</text><text x="20" y="220" class="s">→ electrical energy</text></g>
<g transform="translate(535 100)"><rect x="0" y="25" width="190" height="140" rx="10" class="box"/><circle cx="95" cy="95" r="42" fill="#dceaf5" stroke="#263746" stroke-width="3"/><path d="M95 53 V137 M53 95 H137" stroke="#263746" stroke-width="3"/><text x="20" y="195" class="s">Generator</text><text x="20" y="220" class="s">Mechanical → electrical</text></g>
<g transform="translate(780 100)"><rect x="0" y="25" width="190" height="140" rx="10" class="box"/><rect x="40" y="65" width="110" height="65" fill="#b9d5eb" stroke="#263746" stroke-width="3"/><path d="M40 65 L95 35 L150 65" stroke="#263746" stroke-width="3" fill="none"/><text x="20" y="195" class="s">Solar cell</text><text x="20" y="220" class="s">Light → electrical</text></g>
<text x="50" y="430" class="s">A source maintains a potential difference that drives charge around a complete circuit.</text>
</svg>