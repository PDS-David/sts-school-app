<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Density, pressure and upthrust</title><desc id="d">Measuring an irregular solid by water displacement and a submerged block with weight and upthrust arrows.</desc><rect width="900" height="420" fill="#fff"/><text x="170" y="35" font-size="23" font-family="Arial,sans-serif" fill="#263238">Water displacement</text><path d="M110 130 V330 H320 V130" fill="none" stroke="#263238" stroke-width="5"/><path d="M115 220 H315 V325 H115 Z" fill="#90caf9" opacity=".7"/><text x="120" y="205" font-size="17" font-family="Arial,sans-serif" fill="#263238">Initial V₁</text><circle cx="215" cy="280" r="25" fill="#78909c" stroke="#263238" stroke-width="3"/><text x="105" y="375" font-size="18" font-family="Arial,sans-serif" fill="#263238">Vsolid = V₂ − V₁; ρ = m/V</text><text x="570" y="35" font-size="23" font-family="Arial,sans-serif" fill="#263238">Upthrust in a liquid</text><rect x="590" y="120" width="220" height="220" fill="#bbdefb" stroke="#263238" stroke-width="4"/><rect x="660" y="205" width="80" height="80" fill="#90a4ae" stroke="#263238" stroke-width="3"/><path d="M700 205 V130" stroke="#1565c0" stroke-width="5"/><path d="M700 130 l-10 15 h20 z" fill="#1565c0"/><path d="M700 285 V365" stroke="#d32f2f" stroke-width="5"/><path d="M700 365 l-10 -15 h20 z" fill="#d32f2f"/><text x="715" y="140" font-size="18" font-family="Arial,sans-serif" fill="#263238">Upthrust</text><text x="715" y="365" font-size="18" font-family="Arial,sans-serif" fill="#263238">Weight</text><text x="595" y="390" font-size="18" font-family="Arial,sans-serif" fill="#263238">Pressure P = F/A</text></svg>