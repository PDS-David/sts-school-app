<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" role="img" aria-labelledby="t d"><title id="t">Replacement vernier calliper reading 4.43 cm</title><desc id="d">Original vernier schematic with main-scale reading 4.40 cm and the third vernier division coinciding, giving 0.03 cm and a total of 4.43 cm.</desc><rect width="800" height="320" fill="#fff"/><g stroke="#263238" stroke-width="7"><path d="M60 130 H740"/></g><g stroke="#455a64" stroke-width="3"><path d="M100 130 V85 M160 130 V105 M220 130 V85 M280 130 V105 M340 130 V85 M400 130 V105 M460 130 V85 M520 130 V105 M580 130 V85 M640 130 V105 M700 130 V85"/></g><g stroke="#1565c0" stroke-width="5" fill="none"><rect x="335" y="155" width="370" height="70" rx="4"/><path d="M335 155 V130 M370 155 V190 M405 155 V190 M440 155 V190 M475 155 V190 M510 155 V190 M545 155 V190 M580 155 V190 M615 155 V190 M650 155 V190 M685 155 V190"/></g><g fill="#263238" font-family="Arial,sans-serif" font-size="22"><text x="300" y="65">Main scale: 4.40 cm</text><text x="350" y="250" fill="#1565c0">Vernier: 3 × 0.01 cm = 0.03 cm</text><text x="90" y="295" font-weight="700">Total reading = 4.43 cm (original replacement example)</text></g></svg>