<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Methods of charging</title><desc id="d">Three panels show charging by friction, contact and induction with electron movement indicated.</desc><rect width="900" height="430" fill="#fff"/><g font-size="22" font-family="Arial,sans-serif" fill="#263238"><text x="100" y="40">Friction</text><text x="390" y="40">Contact</text><text x="680" y="40">Induction</text></g><rect x="75" y="125" width="100" height="55" rx="12" fill="#90caf9" stroke="#263238" stroke-width="3"/><rect x="195" y="125" width="100" height="55" rx="12" fill="#ffcc80" stroke="#263238" stroke-width="3"/><path d="M180 150 H190" stroke="#1565c0" stroke-width="4"/><text x="75" y="215" font-size="17" font-family="Arial,sans-serif" fill="#263238">Rubbing transfers</text><text x="75" y="240" font-size="17" font-family="Arial,sans-serif" fill="#263238">electrons</text><circle cx="430" cy="150" r="45" fill="#90caf9" stroke="#263238" stroke-width="3"/><circle cx="520" cy="150" r="45" fill="#ffcc80" stroke="#263238" stroke-width="3"/><path d="M470 150 H480" stroke="#1565c0" stroke-width="5"/><text x="390" y="230" font-size="17" font-family="Arial,sans-serif" fill="#263238">Touching allows</text><text x="390" y="255" font-size="17" font-family="Arial,sans-serif" fill="#263238">charge to move</text><rect x="690" y="130" width="130" height="35" rx="10" fill="#90caf9" stroke="#263238" stroke-width="3"/><path d="M755 165 V270" stroke="#263238" stroke-width="5"/><path d="M755 270 L720 320 M755 270 L790 320" stroke="#2e7d32" stroke-width="5" fill="none"/><circle cx="650" cy="150" r="35" fill="#ffcc80" stroke="#263238" stroke-width="3"/><path d="M685 150 H690" stroke="#1565c0" stroke-width="4"/><text x="660" y="365" font-size="17" font-family="Arial,sans-serif" fill="#263238">Nearby charged body</text><text x="660" y="390" font-size="17" font-family="Arial,sans-serif" fill="#263238">separates charges; earthing</text><text x="660" y="415" font-size="17" font-family="Arial,sans-serif" fill="#263238">then leaves a net charge</text></svg>