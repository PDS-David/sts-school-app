<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:25px;font-weight:bold}.s{font-size:18px}.line{stroke:#263746;stroke-width:3;fill:none}.hot{stroke:#b33a3a;stroke-width:5;fill:none}.cool{stroke:#1769aa;stroke-width:5;fill:none}</style>
<text x="35" y="42" class="h">Three methods of heat transfer</text><g transform="translate(40 100)"><text x="0" y="0" class="s">Conduction in a metal rod</text><rect x="15" y="75" width="280" height="35" fill="#d7dce1" stroke="#263746" stroke-width="3"/><path d="M15 92 H295" class="hot"/><path d="M270 80 L295 92 L270 104" class="hot"/><path d="M30 145 Q55 125 80 145 M95 145 Q120 125 145 145 M160 145 Q185 125 210 145" class="line"/><text x="20" y="190" class="s">Energy passes through the material</text></g>
<g transform="translate(360 100)"><text x="0" y="0" class="s">Convection in a fluid</text><rect x="30" y="60" width="220" height="145" fill="#eaf4fb" stroke="#263746" stroke-width="3"/><path d="M85 175 C30 120 80 80 130 95 C190 115 175 170 125 180" class="hot"/><path d="M130 180 C185 195 220 145 190 100" class="cool"/><path d="M85 175 L125 180 L105 150 M190 100 L190 140 L165 120" class="cool"/><text x="25" y="245" class="s">Warm fluid rises; cooler fluid sinks</text></g>
<g transform="translate(690 100)"><text x="0" y="0" class="s">Radiation</text><circle cx="110" cy="130" r="48" fill="#f4b24d" stroke="#b33a3a" stroke-width="3"/><path d="M110 60 V25 M110 200 V235 M40 130 H5 M180 130 H215 M60 80 L35 55 M160 180 L185 205 M160 80 L185 55 M60 180 L35 205" class="hot"/><text x="10" y="245" class="s">Energy travels as waves</text></g>
<text x="50" y="455" class="s">Conduction: particle/electron collisions • Convection: bulk fluid movement • Radiation: electromagnetic waves</text>
</svg>