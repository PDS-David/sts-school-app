<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#fff"/><text x="36" y="45" font-family="Arial" font-size="26" font-weight="bold" fill="#18324b">Respiration in mammals and fish</text>
<text x="55" y="90" font-family="Arial" font-size="21" font-weight="bold" fill="#17324d">Mammalian air pathway</text>
<rect x="55" y="115" width="350" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="230" y="140" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Nasal cavity / pharynx</text><rect x="55" y="180" width="350" height="38" rx="10" fill="#f6e8d6" stroke="#375a73" stroke-width="2"/><text x="230" y="205" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Larynx and trachea</text><rect x="55" y="245" width="350" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="230" y="270" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Bronchi</text><rect x="55" y="310" width="350" height="38" rx="10" fill="#f6e8d6" stroke="#375a73" stroke-width="2"/><text x="230" y="335" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Bronchioles</text><rect x="55" y="375" width="350" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="230" y="400" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Alveoli — gas exchange</text>
<text x="500" y="90" font-family="Arial" font-size="21" font-weight="bold" fill="#17324d">Fish gills</text>
<rect x="500" y="115" width="350" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="675" y="140" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Gill arch — support</text><rect x="500" y="180" width="350" height="38" rx="10" fill="#f6e8d6" stroke="#375a73" stroke-width="2"/><text x="675" y="205" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Gill rakers — protection/filtering</text><rect x="500" y="245" width="350" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="675" y="270" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Gill filaments — surface</text><rect x="500" y="310" width="350" height="38" rx="10" fill="#f6e8d6" stroke="#375a73" stroke-width="2"/><text x="675" y="335" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Lamellae — gas exchange</text><rect x="500" y="375" width="350" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="675" y="400" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Oxygen enters blood; CO2 leaves</text>
<text x="55" y="490" font-family="Arial" font-size="16" fill="#425466">Alveoli exchange gases with blood; fish gills exchange dissolved gases with water.</text><text x="36" y="580" font-family="Arial" font-size="13" fill="#555">Original SS1 teaching schematic • not to scale • not a procedure guide</text></svg>