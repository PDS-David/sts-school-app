<path d="M430 130 C405 110 390 140 412 155 C438 173 470 145 490 160 C515 180 535 155 555 145" class="digest"/>
<text x="480" y="118" text-anchor="middle" class="l">Intestine</text>
<path d="M425 495 Q480 465 535 495 L550 560 Q480 600 410 560Z" fill="#e7c5ce" class="o"/>
<circle cx="455" cy="510" r="7" fill="#9a5571"/><circle cx="505" cy="510" r="7" fill="#9a5571"/>
<text x="480" y="630" text-anchor="middle" class="l">Cloaca</text><text x="480" y="655" text-anchor="middle" class="s">Common chamber for reproductive, urinary and digestive tracts</text>
