<text x="480" y="190" text-anchor="middle" class="l">Paired testes</text><path d="M450 198 L390 224 M510 198 L570 224" class="line"/>
<path d="M355 276 C330 320 365 335 345 370 C330 400 385 415 410 435 C430 452 430 477 455 500" class="duct"/>
<path d="M605 276 C630 320 595 335 615 370 C630 400 575 415 550 435 C530 452 530 477 505 500" class="duct"/>
