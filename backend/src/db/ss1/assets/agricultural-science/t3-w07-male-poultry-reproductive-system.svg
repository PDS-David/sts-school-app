<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
<title id="title">Male reproductive and associated excretory structures of a domestic chicken</title>
<desc id="desc">Original simplified schematic showing paired internal testes, vas deferens leading to the cloaca, cloacal papillae, kidneys, ureters, intestine, cloaca and vent. The diagram is not to scale.</desc>
<style>
.h{font:700 28px Arial,sans-serif;fill:#18324b}.sub{font:17px Arial,sans-serif;fill:#425466}
.l{font:700 19px Arial,sans-serif;fill:#18324b}.s{font:15px Arial,sans-serif;fill:#425466}
.o{stroke:#24445f;stroke-width:4;stroke-linejoin:round}.duct{stroke:#9a5571;stroke-width:9;fill:none;stroke-linecap:round}.urine{stroke:#397c91;stroke-width:5;fill:none;stroke-dasharray:8 6}.digest{stroke:#9b8055;stroke-width:8;fill:none;stroke-linecap:round}.line{stroke:#607d8b;stroke-width:2;fill:none}
</style>
<rect width="960" height="700" fill="#fff"/>
<text x="480" y="48" text-anchor="middle" class="h">Male reproductive system of a domestic chicken</text>
<text x="480" y="76" text-anchor="middle" class="sub">Internal reproductive organs and nearby urinary/digestive structures • not to scale</text>
