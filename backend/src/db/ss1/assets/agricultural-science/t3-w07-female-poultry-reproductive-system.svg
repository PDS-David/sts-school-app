<text x="690" y="270" class="l">Oviduct</text><path d="M680 278 L520 295" class="line"/>
<text x="690" y="330" class="l">Isthmus</text><text x="690" y="353" class="s">adds shell membranes</text><path d="M680 342 L515 400" class="line"/>
<path d="M550 430 Q610 455 590 505 Q575 535 550 515" fill="#e8b4c0" class="o"/>
<text x="690" y="455" class="l">Uterus / shell gland</text><text x="690" y="478" class="s">forms the hard shell</text><path d="M680 465 L590 472" class="line"/>
<text x="690" y="540" class="l">Vagina</text><path d="M680 545 L557 545" class="line"/>
<path d="M745 220 C765 255 760 285 748 315" stroke="#9aa8b2" stroke-width="8" stroke-dasharray="7 7" fill="none"/>
