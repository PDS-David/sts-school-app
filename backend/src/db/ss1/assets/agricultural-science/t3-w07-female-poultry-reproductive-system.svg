<path d="M800 125 C835 115 850 152 830 184 C810 210 785 194 774 168 C762 143 775 130 800 125Z" fill="#a9c8d5" class="o"/>
<text x="165" y="130" class="l">Kidney</text><path d="M235 136 L270 150" class="line"/><text x="875" y="130" class="l">Kidney</text><path d="M870 136 L830 150" class="line"/>
<path d="M365 150 C330 125 315 175 344 195 C320 225 360 250 385 222 C415 250 450 220 428 193 C445 165 410 137 390 160Z" fill="#f5c2cf" class="o"/>
<g fill="#d97891" stroke="#8b3d5a" stroke-width="2"><circle cx="355" cy="173" r="11"/><circle cx="390" cy="165" r="15"/><circle cx="414" cy="193" r="12"/><circle cx="376" cy="211" r="18"/></g>
<text x="160" y="250" class="l">Functional left ovary</text><path d="M335 238 L365 218" class="line"/>
<path d="M430 215 C465 245 475 280 495 315 C510 350 520 390 540 430 C550 460 550 485 550 515" class="tube"/>
<path d="M430 215 Q405 230 420 260 Q442 278 465 250" fill="#f2d49b" class="o"/>
<text x="110" y="325" class="l">Infundibulum</text><path d="M245 320 L430 248" class="line"/>
