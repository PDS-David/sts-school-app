<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#fff"/><text x="36" y="45" font-family="Arial" font-size="26" font-weight="bold" fill="#18324b">Mammalian reproductive systems — major pathways</text>
<text x="55" y="90" font-family="Arial" font-size="21" font-weight="bold" fill="#17324d">Male</text>
<rect x="55" y="115" width="350" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="230" y="140" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Testes — sperm and testosterone</text><rect x="55" y="183" width="350" height="38" rx="10" fill="#f6e8d6" stroke="#375a73" stroke-width="2"/><text x="230" y="208" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Epididymis — sperm maturation</text><rect x="55" y="251" width="350" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="230" y="276" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Vas deferens — sperm transport</text><rect x="55" y="319" width="350" height="38" rx="10" fill="#f6e8d6" stroke="#375a73" stroke-width="2"/><text x="230" y="344" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Accessory glands — seminal fluids</text><rect x="55" y="387" width="350" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="230" y="412" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Urethra and penis</text>
<text x="500" y="90" font-family="Arial" font-size="21" font-weight="bold" fill="#17324d">Female</text>
<rect x="500" y="115" width="350" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="675" y="140" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Ovaries — ova and hormones</text><rect x="500" y="183" width="350" height="38" rx="10" fill="#f6e8d6" stroke="#375a73" stroke-width="2"/><text x="675" y="208" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Oviduct — usual fertilisation site</text><rect x="500" y="251" width="350" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="675" y="276" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Uterus — embryo/fetal development</text><rect x="500" y="319" width="350" height="38" rx="10" fill="#f6e8d6" stroke="#375a73" stroke-width="2"/><text x="675" y="344" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Cervix — passage to vagina</text><rect x="500" y="387" width="350" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="675" y="412" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Vagina and vulva</text>
<text x="55" y="490" font-family="Arial" font-size="16" fill="#425466">Major structures only. Anatomy varies by species; this is not a procedure guide.</text><text x="36" y="580" font-family="Arial" font-size="13" fill="#555">Original SS1 teaching schematic • not to scale • not a procedure guide</text></svg>