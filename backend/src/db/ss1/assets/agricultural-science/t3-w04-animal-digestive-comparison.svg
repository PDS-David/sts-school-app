<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#fff"/><text x="36" y="45" font-family="Arial" font-size="26" font-weight="bold" fill="#18324b">Animal digestive systems — comparison</text>
<text x="50" y="85" font-family="Arial" font-size="20" font-weight="bold" fill="#17324d">Ruminant (cattle, sheep, goats)</text>
