<text x="500" y="85" font-family="Arial" font-size="20" font-weight="bold" fill="#17324d">Pig (monogastric)</text>
<rect x="500" y="100" width="340" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="670" y="125" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Mouth / oesophagus</text><rect x="500" y="162" width="340" height="38" rx="10" fill="#f6e8d6" stroke="#375a73" stroke-width="2"/><text x="670" y="187" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Single-chambered stomach</text><rect x="500" y="224" width="340" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="670" y="249" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Small intestine</text><rect x="500" y="286" width="340" height="38" rx="10" fill="#f6e8d6" stroke="#375a73" stroke-width="2"/><text x="670" y="311" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Caecum / large intestine</text>
<text x="500" y="400" font-family="Arial" font-size="20" font-weight="bold" fill="#17324d">Poultry</text>
<rect x="500" y="415" width="340" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="670" y="440" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Beak / oesophagus</text><rect x="500" y="440" width="340" height="38" rx="10" fill="#f6e8d6" stroke="#375a73" stroke-width="2"/><text x="670" y="465" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Crop</text><rect x="500" y="465" width="340" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="670" y="490" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Proventriculus</text><rect x="500" y="490" width="340" height="38" rx="10" fill="#f6e8d6" stroke="#375a73" stroke-width="2"/><text x="670" y="515" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Gizzard</text><rect x="500" y="515" width="340" height="38" rx="10" fill="#e8f0f5" stroke="#375a73" stroke-width="2"/><text x="670" y="540" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Small intestine / caeca</text><rect x="500" y="540" width="340" height="38" rx="10" fill="#f6e8d6" stroke="#375a73" stroke-width="2"/><text x="670" y="565" text-anchor="middle" font-family="Arial" font-size="16" fill="#17324d">Cloaca</text>
<text x="55" y="470" font-family="Arial" font-size="16" fill="#425466">Rumen microbes digest fibre; pig hindgut microbes also contribute;</text><text x="55" y="495" font-family="Arial" font-size="16" fill="#425466">poultry crop stores feed and gizzard grinds it.</text><text x="36" y="580" font-family="Arial" font-size="13" fill="#555">Original SS1 teaching schematic • not to scale • not a procedure guide</text></svg>