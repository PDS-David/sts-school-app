<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">Eight sources of farm power</title>
<desc id="desc">Original eight-panel educational infographic showing human, animal, mechanical, electrical, solar, wind, water and biogas power with typical farm uses. The illustrations are simplified and not to scale.</desc>
<style>
.h{font:700 34px Arial,sans-serif;fill:#18324b}.sub{font:18px Arial,sans-serif;fill:#425466}
.card{fill:#f8fbfd;stroke:#b9cbd8;stroke-width:2}.t{font:700 21px Arial,sans-serif;fill:#18324b}.d{font:15px Arial,sans-serif;fill:#425466}
.ink{stroke:#24445f;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#58758f;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ground{stroke:#9bb4c3;stroke-width:4}.sun{fill:#f6ca62;stroke:#a7771d;stroke-width:3}.metal{fill:#c4d4df;stroke:#24445f;stroke-width:4}.blue{fill:#9cc9dc;stroke:#2d6e8c;stroke-width:4}
</style>
<rect width="1200" height="850" fill="#fff"/>
<text x="600" y="48" text-anchor="middle" class="h">Eight sources of farm power</text>
<text x="600" y="78" text-anchor="middle" class="sub">Choose the source that suits the operation, site, cost, skills and safety needs.</text>
<g transform="translate(35 115)">
<rect width="270" height="330" rx="18" class="card"/><path d="M25 158 H245" class="ground"/>
<circle cx="105" cy="48" r="18" fill="#e7b98e" stroke="#6d513a" stroke-width="3"/><path d="M105 68 L105 120 M105 82 L72 112 M105 82 L142 102 M105 120 L80 157 M105 120 L130 157" class="ink"/>
<path d="M142 102 L185 55" class="ink"/><path d="M177 48 L198 65 L186 80" class="ink"/><path d="M185 55 L212 35" class="thin"/>
<text x="135" y="198" text-anchor="middle" class="t">1. Human</text><text x="135" y="229" text-anchor="middle" class="d">Muscle, skill and judgement</text><text x="135" y="253" text-anchor="middle" class="d">Hand digging, planting,</text><text x="135" y="276" text-anchor="middle" class="d">weeding and harvesting</text></g>
<g transform="translate(325 115)">
<rect width="270" height="330" rx="18" class="card"/><path d="M22 158 H246" class="ground"/>
<g fill="#d8b68d" stroke="#72583d" stroke-width="4"><path d="M42 75 Q58 54 86 67 L100 92 L92 130 L52 130 L39 105Z"/><path d="M112 75 Q128 54 156 67 L170 92 L162 130 L122 130 L109 105Z"/></g>
<path d="M48 130 L48 154 M83 130 L83 154 M118 130 L118 154 M153 130 L153 154" class="ink"/><path d="M40 83 L24 68 M92 83 L105 66 M110 83 L96 66 M164 83 L178 66" class="thin"/>
<path d="M94 91 L113 91" class="ink"/><path d="M172 110 L204 130 L224 130 M204 130 L225 154" class="thin"/>
<text x="135" y="198" text-anchor="middle" class="t">2. Animal traction</text><text x="135" y="229" text-anchor="middle" class="d">Oxen, donkeys, camels</text><text x="135" y="253" text-anchor="middle" class="d">or horses pull ploughs,</text><text x="135" y="276" text-anchor="middle" class="d">implements and carts</text></g>
<g transform="translate(615 115)">
<rect width="270" height="330" rx="18" class="card"/><path d="M20 158 H250" class="ground"/>
<path d="M58 90 L148 90 L176 118 L176 147 L48 147 L48 118Z" class="metal"/><path d="M90 90 L102 55 L148 55 L160 90" fill="#9bb6c8" stroke="#24445f" stroke-width="4"/>
<circle cx="83" cy="150" r="24" fill="#526d82" stroke="#18324b" stroke-width="5"/><circle cx="83" cy="150" r="9" fill="#dbe5eb"/>
<circle cx="160" cy="150" r="18" fill="#526d82" stroke="#18324b" stroke-width="5"/><circle cx="160" cy="150" r="7" fill="#dbe5eb"/>
<path d="M177 125 L210 140 L224 140 L232 155" class="ink"/><path d="M230 155 L248 155" class="thin"/>
<text x="135" y="198" text-anchor="middle" class="t">3. Mechanical</text><text x="135" y="229" text-anchor="middle" class="d">Engine-driven machines</text><text x="135" y="253" text-anchor="middle" class="d">such as tractors, planters</text><text x="135" y="276" text-anchor="middle" class="d">and threshers</text></g>
<g transform="translate(905 115)">
<rect width="270" height="330" rx="18" class="card"/><rect x="43" y="72" width="85" height="72" rx="10" class="metal"/>
<circle cx="85" cy="108" r="22" fill="#e8edf1" stroke="#24445f" stroke-width="4"/><path d="M85 86 L85 130 M63 108 L107 108" class="thin"/>
<path d="M128 108 L166 108 L166 142 L200 142 M200 142 L200 158" class="ink"/><path d="M200 158 Q190 172 180 158" class="blue"/><path d="M45 55 L45 38 L128 38 L128 55" class="thin"/>
<text x="135" y="198" text-anchor="middle" class="t">4. Electrical</text><text x="135" y="229" text-anchor="middle" class="d">Electric motors drive</text><text x="135" y="253" text-anchor="middle" class="d">pumps, milking machines,</text><text x="135" y="276" text-anchor="middle" class="d">fans and grinders</text></g>
<g transform="translate(35 475)">
<rect width="270" height="330" rx="18" class="card"/><circle cx="210" cy="48" r="25" class="sun"/>
<path d="M210 10 V0 M210 96 V86 M172 48 H160 M260 48 H248 M182 20 L173 11 M238 20 L247 11" class="thin"/>
<path d="M40 105 L172 105 L188 155 L56 155Z" fill="#6fa4c0" stroke="#24445f" stroke-width="4"/>
<path d="M70 105 L84 155 M104 105 L118 155 M138 105 L152 155 M48 128 L180 128" class="thin"/><path d="M110 155 L110 173 M75 173 H145 M190 155 L190 175 L222 175" class="ink"/>
<text x="135" y="198" text-anchor="middle" class="t">5. Solar</text><text x="135" y="229" text-anchor="middle" class="d">Sunlight supplies heat</text><text x="135" y="253" text-anchor="middle" class="d">or PV electricity for</text><text x="135" y="276" text-anchor="middle" class="d">dryers and water pumps</text></g>
<g transform="translate(325 475)">
<rect width="270" height="330" rx="18" class="card"/><path d="M135 72 L135 160" class="ink"/><circle cx="135" cy="65" r="8" fill="#24445f"/>
<path d="M135 65 L135 12 Q145 2 152 12 L142 62Z M135 65 L82 90 Q70 82 78 72 L130 60Z M135 65 L185 94 Q185 108 172 108 L132 72Z" fill="#dce7ed" stroke="#24445f" stroke-width="3"/>
<path d="M100 160 L170 160 M110 160 L100 176 M160 160 L170 176 M135 160 L135 184 L195 184" class="thin"/><path d="M195 184 Q185 198 175 184" class="blue"/>
<text x="135" y="222" text-anchor="middle" class="t">6. Wind</text><text x="135" y="253" text-anchor="middle" class="d">Windmills can pump water</text><text x="135" y="276" text-anchor="middle" class="d">or drive grain mills</text></g>
<g transform="translate(615 475)">
<rect width="270" height="330" rx="18" class="card"/><path d="M28 70 Q58 55 88 70 T148 70 T208 70 T250 70" fill="none" stroke="#3b89aa" stroke-width="9"/>
<path d="M42 78 L42 155 L225 155 L225 78" fill="#d8eaf2" stroke="#24445f" stroke-width="4"/><path d="M42 78 L225 78" stroke="#24445f" stroke-width="4"/>
<circle cx="135" cy="115" r="28" fill="#e7eef3" stroke="#24445f" stroke-width="4"/><path d="M135 87 L135 143 M107 115 L163 115 M115 95 L155 135 M155 95 L115 135" class="thin"/>
<path d="M163 115 L196 115" class="ink"/><rect x="196" y="94" width="42" height="42" rx="6" class="metal"/><path d="M217 136 L217 155" class="ink"/>
<text x="135" y="198" text-anchor="middle" class="t">7. Water</text><text x="135" y="229" text-anchor="middle" class="d">Moving water turns a</text><text x="135" y="253" text-anchor="middle" class="d">turbine; a generator</text><text x="135" y="276" text-anchor="middle" class="d">produces electricity</text></g>
<g transform="translate(905 475)">
<rect width="270" height="330" rx="18" class="card"/><path d="M72 65 Q72 45 135 45 Q198 45 198 65 L198 150 Q135 178 72 150Z" fill="#b6d3b6" stroke="#3f7652" stroke-width="4"/>
<ellipse cx="135" cy="65" rx="63" ry="20" fill="#dcebdc" stroke="#3f7652" stroke-width="4"/><path d="M135 45 L135 20 L198 20 L198 43 M198 20 L225 20 L225 75" class="ink"/>
<path d="M214 75 Q225 55 236 75 Q247 95 225 104 Q203 95 214 75Z" fill="#f4b74e" stroke="#a86a18" stroke-width="3"/><path d="M40 135 L72 135" class="thin"/>
<text x="135" y="198" text-anchor="middle" class="t">8. Biogas</text><text x="135" y="229" text-anchor="middle" class="d">Anaerobic digestion of</text><text x="135" y="253" text-anchor="middle" class="d">organic waste makes gas</text><text x="135" y="276" text-anchor="middle" class="d">for heat and electricity</text></g>
<text x="600" y="835" text-anchor="middle" class="sub">The illustrations are simplified teaching aids, not engineering specifications.</text>
</svg>