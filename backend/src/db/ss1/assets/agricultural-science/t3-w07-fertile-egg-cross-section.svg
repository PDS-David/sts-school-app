<title id="title">Cross-section of a fertile hen's egg</title>
<desc id="desc">Original simplified cutaway of a hen's egg showing shell, double shell membranes, air cell, albumen, yolk, germinal disc and chalaza. The diagram is schematic and not to scale.</desc>
