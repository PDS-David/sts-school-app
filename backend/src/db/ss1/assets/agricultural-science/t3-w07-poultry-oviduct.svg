<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" role="img" aria-labelledby="title desc">
<title id="title">Female reproductive tract of a laying hen</title>
<desc id="desc">Original simplified schematic showing the ovary and the five main sections of the left oviduct in sequence: infundibulum, magnum, isthmus, uterus or shell gland, vagina, then cloaca and vent. Arrows show the direction of egg movement. The diagram is not to scale.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#34495e"/></marker>
  <style>
    .heading{font:700 30px Arial,sans-serif;fill:#18324b}.sub{font:18px Arial,sans-serif;fill:#425466}
    .label{font:700 20px Arial,sans-serif;fill:#18324b}.small{font:16px Arial,sans-serif;fill:#334e68}
    .organ{stroke:#24445f;stroke-width:5;stroke-linejoin:round}.flow{stroke:#34495e;stroke-width:4;fill:none;marker-end:url(#arrow)}
    .call{stroke:#58758f;stroke-width:2.5;fill:none}
  </style>
</defs>
<rect width="960" height="900" fill="#ffffff"/>
<text x="480" y="54" text-anchor="middle" class="heading">Female reproductive tract of a laying hen</text>
<text x="480" y="84" text-anchor="middle" class="sub">Simplified left-side reproductive tract • not to scale</text>
<path d="M210 170 C155 135 145 205 184 226 C145 253 176 296 216 270 C238 316 286 287 268 248 C312 220 284 171 245 186 C239 145 210 143 210 170Z" fill="#f5c2cf" class="organ"/>
<g fill="#d97891" stroke="#8b3d5a" stroke-width="2"><circle cx="196" cy="190" r="15"/><circle cx="235" cy="177" r="19"/><circle cx="258" cy="217" r="16"/><circle cx="215" cy="239" r="22"/><circle cx="178" cy="247" r="11"/><circle cx="248" cy="267" r="10"/></g>
<circle cx="285" cy="294" r="13" fill="#e9a83a" stroke="#8b5b17" stroke-width="3"/>
<path d="M285 307 C305 320 325 330 342 345" class="flow"/>
<path d="M335 320 Q375 337 364 374 Q348 390 330 365 Q316 344 335 320Z" fill="#f3d7a5" class="organ"/>
<path d="M342 354 C364 370 375 389 384 412" class="flow"/>
<text x="105" y="132" class="label">Ovary</text><path d="M155 138 L190 174" class="call"/>
<text x="95" y="326" class="label">Ovulated yolk</text><path d="M220 318 L275 299" class="call"/>
<path d="M365 375 C425 390 440 410 430 447 C420 484 448 508 455 542" stroke="#c96f84" stroke-width="36" fill="none" stroke-linecap="round"/>
<path d="M455 542 C470 575 490 594 485 624" stroke="#c96f84" stroke-width="31" fill="none" stroke-linecap="round"/>
<path d="M485 624 C480 665 502 693 505 725" stroke="#c96f84" stroke-width="45" fill="none" stroke-linecap="round"/>
<path d="M505 725 C510 758 510 774 510 795" stroke="#c96f84" stroke-width="26" fill="none" stroke-linecap="round"/>
<path d="M385 405 C410 425 420 452 433 477" class="flow"/><path d="M455 548 C470 570 477 591 482 610" class="flow"/>
<path d="M488 641 C492 665 499 684 502 699" class="flow"/><path d="M507 744 C509 760 510 774 510 786" class="flow"/>
<path d="M337 329 Q300 345 315 380 Q330 399 365 387 Q385 373 375 348 Q365 332 337 329Z" fill="#f2d49b" class="organ"/>
<path d="M318 350 Q293 337 280 322" stroke="#24445f" stroke-width="5" fill="none"/><path d="M322 365 Q295 366 280 382" stroke="#24445f" stroke-width="5" fill="none"/>
<text x="590" y="365" class="label">Infundibulum</text><text x="590" y="391" class="small">Catches the ovulated yolk;</text><text x="590" y="414" class="small">fertilisation may occur here.</text><path d="M570 390 L380 365" class="call"/>
<text x="105" y="500" class="label">Oviduct</text><text x="105" y="526" class="small">Egg-forming tube</text><path d="M240 510 L420 505" class="call"/>
<text x="590" y="470" class="label">Magnum</text><text x="590" y="496" class="small">Adds most of the albumen</text><text x="590" y="519" class="small">(egg white).</text><path d="M570 490 L438 458" class="call"/>
<text x="590" y="572" class="label">Isthmus</text><text x="590" y="598" class="small">Adds the inner and outer</text><text x="590" y="621" class="small">shell membranes.</text><path d="M570 592 L470 587" class="call"/>
<text x="590" y="678" class="label">Uterus / shell gland</text><text x="590" y="704" class="small">Adds water and salts and</text><text x="590" y="727" class="small">forms the hard shell.</text><path d="M570 700 L525 690" class="call"/>
<text x="590" y="780" class="label">Vagina</text><text x="590" y="806" class="small">Short muscular passage</text><path d="M570 788 L523 785" class="call"/>
<path d="M495 807 Q510 823 530 807 Q548 796 556 817 Q565 839 539 850 L480 850 Q466 834 480 818Z" fill="#d8a3ad" class="organ"/>
<text x="590" y="850" class="label">Cloaca → vent</text><path d="M570 840 L551 835" class="call"/>
<rect x="48" y="870" width="864" height="2" fill="#d7e1ea"/>
<text x="480" y="892" text-anchor="middle" class="small">Egg movement is from the ovary into the oviduct and then towards the cloaca/vent.</text>
</svg>