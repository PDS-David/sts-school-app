<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 600 540"><title>Cone frustum dimensions</title><rect width="600" height="540" fill="#fff"/><text x="300" y="32" font-family="Arial" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle">CONE FRUSTUM</text><ellipse cx="300" cy="115" rx="105" ry="28" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><line x1="195" y1="115" x2="95" y2="410" stroke="#2563eb" stroke-width="3" /><line x1="405" y1="115" x2="505" y2="410" stroke="#2563eb" stroke-width="3" /><ellipse cx="300" cy="410" rx="205" ry="48" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><line x1="300" y1="115" x2="300" y2="410" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/><text x="320" y="270" font-family="Arial" font-size="22" font-weight="bold" fill="#dc2626" text-anchor="start">h</text><line x1="300" y1="115" x2="405" y2="115" stroke="#059669" stroke-width="3" /><text x="355" y="98" font-family="Arial" font-size="20" font-weight="normal" fill="#059669" text-anchor="middle">r</text><line x1="300" y1="410" x2="505" y2="410" stroke="#059669" stroke-width="3" /><text x="405" y="390" font-family="Arial" font-size="20" font-weight="normal" fill="#059669" text-anchor="middle">R</text><text x="300" y="490" font-family="Arial" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">V = ⅓πh(R² + Rr + r²)</text></svg>