<svg xmlns="http://www.w3.org/2000/svg" width="650" height="460" viewBox="0 0 650 460"><title>Right triangle trigonometric ratios</title><rect width="650" height="460" fill="#fff"/><polygon points="120,390 120,100 520,390" stroke="#2563eb" stroke-width="4" fill="#dbeafe"/><line x1="120" y1="350" x2="160" y2="350" stroke="#1f2937" stroke-width="3" /><line x1="160" y1="350" x2="160" y2="390" stroke="#1f2937" stroke-width="3" /><text x="105" y="245" font-family="Arial" font-size="17" font-weight="bold" fill="#dc2626" text-anchor="end">Opposite</text><text x="320" y="420" font-family="Arial" font-size="17" font-weight="normal" fill="#059669" text-anchor="middle">Adjacent</text><text x="360" y="220" font-family="Arial" font-size="17" font-weight="normal" fill="#2563eb" text-anchor="middle">Hypotenuse</text><path d="M180 390 A60 60 0 0 0 120 330" stroke="#dc2626" stroke-width="3" fill="none"/><text x="190" y="370" font-family="Arial" font-size="20" font-weight="bold" fill="#dc2626" text-anchor="start">θ</text><text x="330" y="55" font-family="Arial" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">sin θ = opposite / hypotenuse</text><text x="330" y="82" font-family="Arial" font-size="18" font-weight="normal" fill="#111827" text-anchor="middle">cos θ = adjacent / hypotenuse</text><text x="330" y="109" font-family="Arial" font-size="18" font-weight="normal" fill="#111827" text-anchor="middle">tan θ = opposite / adjacent</text></svg>