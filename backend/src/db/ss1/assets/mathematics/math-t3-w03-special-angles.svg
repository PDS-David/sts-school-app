<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"><title>Special angles: 57½°, 67½° and 75°</title><rect width="900" height="480" fill="#fff"/><text x="150" y="32" font-family="Arial" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">57½° — PROTRACTOR</text><line x1="45" y1="265" x2="255" y2="265" stroke="#1f2937" stroke-width="3" /><line x1="45" y1="265" x2="156" y2="88" stroke="#dc2626" stroke-width="4" /><path d="M105 265 A60 60 0 0 0 77 214" stroke="#2563eb" stroke-width="3" fill="none"/><text x="145" y="190" font-family="Arial" font-size="18" font-weight="normal" fill="#dc2626" text-anchor="middle">57½°</text><text x="150" y="310" font-family="Arial" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Set 57°30′ with a protractor.</text><line x1="300" y1="400" x2="300" y2="45" stroke="#cbd5e1" stroke-width="1" /><text x="450" y="32" font-family="Arial" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">67½° — COMPASS</text><line x1="355" y1="265" x2="555" y2="265" stroke="#1f2937" stroke-width="3" /><line x1="355" y1="265" x2="355" y2="65" stroke="#1f2937" stroke-width="3" /><line x1="355" y1="265" x2="496" y2="124" stroke="#dc2626" stroke-width="4" /><text x="455" y="190" font-family="Arial" font-size="18" font-weight="normal" fill="#dc2626" text-anchor="middle">67½°</text><text x="450" y="310" font-family="Arial" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">90° − 22½°; do not call it 57½°.</text><line x1="600" y1="400" x2="600" y2="45" stroke="#cbd5e1" stroke-width="1" /><text x="750" y="32" font-family="Arial" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">75° — BISECTION</text><line x1="650" y1="265" x2="850" y2="265" stroke="#1f2937" stroke-width="3" /><line x1="650" y1="265" x2="650" y2="65" stroke="#1f2937" stroke-width="3" /><line x1="650" y1="265" x2="702" y2="72" stroke="#dc2626" stroke-width="4" /><text x="748" y="190" font-family="Arial" font-size="18" font-weight="normal" fill="#dc2626" text-anchor="middle">75°</text><text x="750" y="310" font-family="Arial" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Bisect the 30° gap between 60° and 90°.</text><text x="450" y="445" font-family="Arial" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle">57½° is retained as printed and measured; 67½° is a separate compass construction.</text></svg>