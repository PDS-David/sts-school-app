<svg xmlns="http://www.w3.org/2000/svg" width="650" height="500" viewBox="0 0 650 500"><title>Circle properties: radius, chord and tangent</title><rect width="650" height="500" fill="#fff"/><circle cx="300" cy="250" r="160" stroke="#2563eb" stroke-width="4" fill="none"/><circle cx="300" cy="250" r="5" stroke="#111827" stroke-width="2" fill="#111827"/><line x1="300" y1="250" x2="430" y2="157" stroke="#059669" stroke-width="4" /><text x="375" y="190" font-family="Arial" font-size="17" font-weight="normal" fill="#059669" text-anchor="middle">Radius</text><line x1="175" y1="165" x2="425" y2="335" stroke="#dc2626" stroke-width="4" /><text x="300" y="150" font-family="Arial" font-size="17" font-weight="normal" fill="#dc2626" text-anchor="middle">Chord</text><line x1="440" y1="60" x2="440" y2="440" stroke="#7c3aed" stroke-width="4" /><line x1="300" y1="250" x2="440" y2="250" stroke="#059669" stroke-width="3" stroke-dasharray="7 5"/><path d="M440 250 L440 280 L410 280" stroke="#111827" stroke-width="2" fill="none"/><text x="315" y="275" font-family="Arial" font-size="18" font-weight="bold" fill="#111827" text-anchor="start">O</text><text x="460" y="70" font-family="Arial" font-size="17" font-weight="bold" fill="#7c3aed" text-anchor="start">Tangent</text><text x="300" y="470" font-family="Arial" font-size="15" font-weight="normal" fill="#475569" text-anchor="middle">Tangent ⟂ radius at point of contact.</text></svg>