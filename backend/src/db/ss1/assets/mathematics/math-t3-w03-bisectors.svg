<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"><title>Perpendicular and angle bisectors</title><rect width="900" height="480" fill="#fff"/><text x="225" y="32" font-family="Arial" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">PERPENDICULAR BISECTOR</text><line x1="60" y1="220" x2="390" y2="220" stroke="#1f2937" stroke-width="3" /><circle cx="110" cy="220" r="4" stroke="#2563eb" stroke-width="2" fill="#2563eb"/><circle cx="340" cy="220" r="4" stroke="#2563eb" stroke-width="2" fill="#2563eb"/><text x="110" y="247" font-family="Arial" font-size="16" font-weight="normal" fill="#111827" text-anchor="middle">A</text><text x="340" y="247" font-family="Arial" font-size="16" font-weight="normal" fill="#111827" text-anchor="middle">B</text><path d="M110 220 A145 145 0 0 1 225 75 M340 220 A145 145 0 0 0 225 75 M110 220 A145 145 0 0 0 225 365 M340 220 A145 145 0 0 1 225 365" stroke="#2563eb" stroke-width="2" fill="none"/><line x1="225" y1="55" x2="225" y2="385" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5"/><text x="225" y="70" font-family="Arial" font-size="16" font-weight="normal" fill="#dc2626" text-anchor="middle">P</text><text x="225" y="405" font-family="Arial" font-size="16" font-weight="normal" fill="#dc2626" text-anchor="middle">Q</text><line x1="475" y1="40" x2="475" y2="430" stroke="#cbd5e1" stroke-width="1" /><text x="690" y="32" font-family="Arial" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">ANGLE BISECTOR</text><line x1="550" y1="300" x2="850" y2="300" stroke="#1f2937" stroke-width="3" /><line x1="550" y1="300" x2="680" y2="85" stroke="#1f2937" stroke-width="3" /><line x1="550" y1="300" x2="740" y2="195" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5"/><circle cx="550" cy="300" r="4" stroke="#2563eb" stroke-width="2" fill="#2563eb"/><path d="M610 300 A60 60 0 0 0 582 248" stroke="#2563eb" stroke-width="3" fill="none"/><text x="535" y="325" font-family="Arial" font-size="16" font-weight="normal" fill="#111827" text-anchor="middle">B</text><text x="850" y="325" font-family="Arial" font-size="16" font-weight="normal" fill="#111827" text-anchor="middle">C</text><text x="680" y="78" font-family="Arial" font-size="16" font-weight="normal" fill="#111827" text-anchor="middle">A</text><text x="745" y="190" font-family="Arial" font-size="16" font-weight="normal" fill="#dc2626" text-anchor="middle">R</text><text x="225" y="455" font-family="Arial" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle">Equal-radius arcs meet at P and Q; join them.</text><text x="690" y="455" font-family="Arial" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle">Equal arcs from both arms meet at R; join B to R.</text></svg>