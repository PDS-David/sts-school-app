<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><title>Triangle construction and standard loci</title><rect width="900" height="560" fill="#fff"/><text x="220" y="32" font-family="Arial" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">SSS TRIANGLE</text><line x1="55" y1="250" x2="390" y2="250" stroke="#1f2937" stroke-width="3" /><path d="M55 250 A235 235 0 0 1 210 80 M390 250 A235 235 0 0 0 210 80" stroke="#2563eb" stroke-width="2" fill="none"/><polygon points="55,250 210,80 390,250" stroke="#2563eb" stroke-width="3" fill="#dbeafe"/><text x="55" y="275" font-family="Arial" font-size="16" font-weight="normal" fill="#111827" text-anchor="middle">A</text><text x="390" y="275" font-family="Arial" font-size="16" font-weight="normal" fill="#111827" text-anchor="middle">B</text><text x="210" y="70" font-family="Arial" font-size="16" font-weight="normal" fill="#111827" text-anchor="middle">C</text><text x="220" y="310" font-family="Arial" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Base plus two arcs locate the apex.</text><line x1="470" y1="40" x2="470" y2="520" stroke="#cbd5e1" stroke-width="1" /><text x="680" y="32" font-family="Arial" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">LOCUS: EQUIDISTANT POINTS</text><line x1="530" y1="165" x2="840" y2="165" stroke="#1f2937" stroke-width="3" /><line x1="685" y1="65" x2="685" y2="270" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5"/><circle cx="580" cy="165" r="4" stroke="#2563eb" stroke-width="2" fill="none"/><circle cx="790" cy="165" r="4" stroke="#2563eb" stroke-width="2" fill="none"/><text x="580" y="190" font-family="Arial" font-size="16" font-weight="normal" fill="#111827" text-anchor="middle">A</text><text x="790" y="190" font-family="Arial" font-size="16" font-weight="normal" fill="#111827" text-anchor="middle">B</text><text x="685" y="300" font-family="Arial" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Perpendicular bisector</text><text x="680" y="350" font-family="Arial" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">OTHER STANDARD LOCI</text><circle cx="600" cy="440" r="45" stroke="#2563eb" stroke-width="3" fill="none"/><circle cx="600" cy="440" r="4" stroke="#111827" stroke-width="2" fill="#111827"/><line x1="740" y1="410" x2="850" y2="410" stroke="#1f2937" stroke-width="3" /><line x1="740" y1="470" x2="850" y2="470" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5"/><text x="675" y="510" font-family="Arial" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Circle around a point; parallel lines at fixed distance.</text></svg>