<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560" role="img" aria-labelledby="t d">
  <title id="t">Flowchart: perimeter of a rectangle</title>
  <desc id="d">START, input l and b, process P equals 2 times l plus b, output P, STOP, joined by downward arrows.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
  <g fill="#fff" stroke="#222" stroke-width="2" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">
    <rect x="110" y="20" width="140" height="56" rx="28"/>
    <polygon points="90,136 280,136 250,196 60,196"/>
    <rect x="70" y="256" width="220" height="64" rx="4"/>
    <polygon points="90,376 280,376 250,436 60,436"/>
    <rect x="110" y="480" width="140" height="56" rx="28"/>
  </g>
  <g stroke="#222" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="180" y1="76" x2="180" y2="134"/><line x1="170" y1="196" x2="170" y2="254"/>
    <line x1="180" y1="320" x2="180" y2="374"/><line x1="170" y1="436" x2="170" y2="478"/>
  </g>
  <g fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">
    <text x="180" y="55">START</text><text x="170" y="172">Input l, b</text>
    <text x="180" y="294">P = 2(l + b)</text><text x="170" y="412">Output P</text><text x="180" y="515">STOP</text>
  </g>
</svg>
