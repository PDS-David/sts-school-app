<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450"><rect width="760" height="450" fill="#fff"/><text x="380" y="35" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">Feasible region: x+y≤1, x+2y≤16</text><path d="M90 360 V80" stroke="#ddd" stroke-width="1"/><text x="90" y="382" text-anchor="middle" font-family="Arial" font-size="14">0</text><path d="M370 360 V80" stroke="#ddd" stroke-width="1"/><text x="370" y="382" text-anchor="middle" font-family="Arial" font-size="14">1</text><path d="M650 360 V80" stroke="#ddd" stroke-width="1"/><text x="650" y="382" text-anchor="middle" font-family="Arial" font-size="14">2</text><path d="M90 360 H650" stroke="#ddd" stroke-width="1"/><text x="72" y="365" text-anchor="end" font-family="Arial" font-size="14">0</text><path d="M90 220 H650" stroke="#ddd" stroke-width="1"/><text x="72" y="225" text-anchor="end" font-family="Arial" font-size="14">1</text><path d="M90 80 H650" stroke="#ddd" stroke-width="1"/><text x="72" y="85" text-anchor="end" font-family="Arial" font-size="14">2</text><polygon points="90,360 370,360 90,220" fill="#9bc9ed" fill-opacity=".45" stroke="#1d70a2" stroke-width="3"/><path d="M90 220 L370 360" stroke="#a33" stroke-width="3" fill="none"/><path d="M90 -760 L650 -620" stroke="#c44" stroke-width="3" fill="none"/><path d="M90 360 H650 M90 360 V80" stroke="#222" stroke-width="2"/><circle cx="90" cy="360" r="5" fill="#222"/><text x="98" y="352" font-family="Arial" font-size="14">(0,0)</text><circle cx="370" cy="360" r="5" fill="#222"/><text x="378" y="352" font-family="Arial" font-size="14">(1,0)</text><circle cx="90" cy="220" r="5" fill="#222"/><text x="98" y="212" font-family="Arial" font-size="14">(0,1)</text><text x="650" y="390" font-family="Arial" font-size="16">x</text><text x="70" y="70" font-family="Arial" font-size="16">y</text><text x="380" y="425" text-anchor="middle" font-family="Arial" font-size="15">Shaded triangle is the common region; x+2