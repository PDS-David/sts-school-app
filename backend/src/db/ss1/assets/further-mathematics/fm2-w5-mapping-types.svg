<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><rect width="900" height="500" fill="#fff"/><text x="450" y="34" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold">Mapping diagrams: function and non-function</text><g fill="none" stroke="#222" stroke-width="2"><rect x="40" y="80" width="380" height="350"/><rect x="480" y="80" width="380" height="350"/><ellipse cx="145" cy="245" rx="70" ry="130"/><ellipse cx="315" cy="245" rx="70" ry="130"/><ellipse cx="585" cy="245" rx="70" ry="130"/><ellipse cx="755" cy="245" rx="70" ry="130"/></g><g font-family="Arial" font-size="20" fill="#111"><text x="230" y="70" text-anchor="middle">Valid function (many-to-one)</text><text x="670" y="70" text-anchor="middle">Not a function</text><text x="145" y="105" text-anchor="middle">A</text><text x="315" y="105" text-anchor="middle">B</text><text x="585" y="105" text-anchor="middle">A</text><text x="755" y="105" text-anchor="middle">B</text><text x="145" y="190" text-anchor="middle">1</text><text x="145" y="250" text-anchor="middle">2</text><text x="145" y="310" text-anchor="middle">3</text><text x="315" y="190" text-anchor="middle">a</text><text x="315" y="250" text-anchor="middle">b</text><text x="315" y="310" text-anchor="middle">c</text><text x="585" y="190" text-anchor="middle">1</text><text x="585" y="250" text-anchor="middle">2</text><text x="585" y="310" text-anchor="middle">3</text><text x="755" y="190" text-anchor="middle">a</text><text x="755" y="250" text-anchor="middle">b</text><text x="755" y="310" text-anchor="middle">c</text></g><g stroke="#2378b7" stroke-width="3" fill="none"><path d="M185 190L275 190 M185 250L275 250 M185 310L275 250"/><path d="M625 190L715 160 M625 190L715 220 M625 250L715 250 M625 310L715 310"/></g><g font-family="Arial" font-size="17" fill="#111"><text x="230" y="400" text-anchor="middle">Each input has exactly one output.</text><text x="670" y="400" text-anchor="middle">Input 1 has two outputs, so the relation fails.</text></g></svg>