<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560"><rect width="720" height="560" fill="#fff"/><text x="360" y="35" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold">Eight regions in a three-set Venn diagram</text><rect x="65" y="70" width="590" height="420" fill="none" stroke="#222" stroke-width="3"/><circle cx="290" cy="245" r="135" fill="#d9ebf8" fill-opacity=".55" stroke="#222" stroke-width="3"/><circle cx="430" cy="245" r="135" fill="#dff0df" fill-opacity=".55" stroke="#222" stroke-width="3"/><circle cx="360" cy="355" r="135" fill="#f8e5c9" fill-opacity=".55" stroke="#222" stroke-width="3"/><g font-family="Arial" font-size="24" font-weight="bold" fill="#111" text-anchor="middle"><text x="235" y="220">2</text><text x="485" y="220">6</text><text x="360" y="445">7</text><text x="360" y="275">1</text><text x="295" y="345">3</text><text x="425" y="345">4</text><text x="360" y="185">5</text><text x="95" y="465">8</text></g><g font-family="Arial" font-size="22" fill="#111"><text x="210" y="120">A</text><text x="500" y="120">B</text><text x="485" y="465">C</text><text x="85" y="515" font-size="16">1 = A∩B∩C; 2 = A only; 3 = A∩C only; 4 = B∩C only</text><text x="85" y="540" font-size="16">5 = A∩B only; 6 = B only; 7 = C only; 8 = outside A∪B∪C</text></g></svg>