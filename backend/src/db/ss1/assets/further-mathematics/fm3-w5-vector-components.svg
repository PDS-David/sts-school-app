<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540"><rect width="760" height="540" fill="#fff"/><text x="380" y="34" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold">Vector components and resultant</text><g stroke="#222" stroke-width="2"><path d="M90 420H680 M150 490V70"/><path d="M680 420l-12 -7v14z M150 70l-7 12h14z"/></g><g stroke-width="4" fill="none"><path d="M150 420L390 420L390 180" stroke="#b35a32"/><path d="M150 420L390 180" stroke="#2378b7"/></g><g fill="#111" font-family="Arial" font-size="20"><text x="690" y="445">x</text><text x="165" y="65">y</text><text x="165" y="445">O</text><text x="260" y="450">a = 4i</text><text x="405" y="300">b = 4j</text><text x="250" y="270">r = 4i + 4j</text><text x="410" y="180">(4, 4)</text></g><circle cx="390" cy="180" r="6" fill="#b33b2e"/><text x="380" y="510" text-anchor="middle" font-family="Arial" font-size="17" fill="#111">The resultant is the vector sum of its horizontal and vertical components.</text></svg>