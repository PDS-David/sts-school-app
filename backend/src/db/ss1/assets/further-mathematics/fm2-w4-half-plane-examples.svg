<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><rect width="900" height="430" fill="#fff"/><text x="450" y="32" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Half-planes: dashed and solid boundaries</text><g transform="translate(30,55)"><rect width="400" height="330" fill="#fff" stroke="#222"/><path d="M60 270 L340 90 L340 270 Z" fill="#b9d9f2" fill-opacity=".7"/><path d="M60 270 L340 90" stroke="#1d70a2" stroke-width="3" stroke-dasharray="8 6"/><path d="M60 270 H360 M200 20 V300" stroke="#222" stroke-width="2"/><text x="200" y="315" text-anchor="middle" font-family="Arial" font-size="17">y &gt; −2x − 1 (dashed)</text><text x="20" y="25" font-family="Arial" font-size="14">Shade above line</text></g><g transform="translate(470,55)"><rect width="400" height="330" fill="#fff" stroke="#222"/><path d="M60 260 L340 80 L340 300 L60 300 Z" fill="#cce8cc" fill-opacity=".75"/><path d="M60 260 L340 80" stroke="#1d70a2" stroke-width="3"/><path d="M60 270 H360 M200 20 V300" stroke="#222" stroke-width="2"/><text x="200" y="315" text-anchor="middle" font-family="Arial" font-size="17">y ≥ (x + 3)/2 (solid)</text><text x="20" y="25" font-family="Arial" font-size="14">Boundary included</text></g></svg>