<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">Cassava mealybug female life cycle</title><desc id="desc">Eggs in a waxy ovisac hatch into mobile first-instar crawlers. The nymph passes through second and third instars before becoming an adult female. Adult females lay eggs and the cycle repeats.</desc>
<rect width="1100" height="420" fill="#ffffff"/><text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#17324d">CASSAVA MEALYBUG: FEMALE LIFE CYCLE</text>
<g stroke="#4b7b39" stroke-width="6" fill="none" stroke-linecap="round"><path d="M190 205 H275 M260 190 L280 205 L260 220"/><path d="M390 205 H475 M460 190 L480 205 L460 220"/><path d="M590 205 H675 M660 190 L680 205 L660 220"/><path d="M790 205 H875 M860 190 L880 205 L860 220"/><path d="M980 250 C980 340 110 340 110 250 M125 266 L110 245 L95 265"/></g>
<g fill="#f6e8c7" stroke="#a98b55" stroke-width="3"><ellipse cx="115" cy="185" rx="40" ry="26"/><circle cx="90" cy="180" r="7"/><circle cx="110" cy="170" r="7"/><circle cx="130" cy="180" r="7"/><circle cx="100" cy="195" r="7"/><circle cx="125" cy="198" r="7"/></g>
<g fill="#e4c7a0" stroke="#98774f" stroke-width="3"><ellipse cx="330" cy="200" rx="20" ry="14"/><circle cx="310" cy="200" r="9"/><path d="M320 212 L305 230 M340 212 L355 230" stroke="#98774f" stroke-width="3" fill="none"/></g>
<g fill="#d8b98f" stroke="#98774f" stroke-width="3"><ellipse cx="530" cy="200" rx="27" ry="18"/><circle cx="504" cy="200" r="10"/><path d="M515 215 L495 238 M545 215 L565 238" stroke="#98774f" stroke-width="3" fill="none"/></g>
<g fill="#cda77c" stroke="#98774f" stroke-width="3"><ellipse cx="730" cy="200" rx="34" ry="22"/><circle cx="696" cy="200" r="11"/><path d="M710 220 L690 245 M750 220 L770 245" stroke="#98774f" stroke-width="3" fill="none"/></g>
<g fill="#e8d8c7" stroke="#98774f" stroke-width="3"><ellipse cx="930" cy="195" rx="55" ry="34"/><path d="M885 195 Q930 130 975 195 Q930 260 885 195" fill="#f2e8da"/><circle cx="880" cy="190" r="8"/><path d="M900 225 L885 250 M950 225 L965 250" stroke="#98774f" stroke-width="3" fill="none"/></g>
<g font-family="Arial" font-size="20" fill="#17324d" text-anchor="middle"><text x="115" y="285">Eggs in ovisac</text><text x="330" y="285">Crawler</text><text x="530" y="285">Second instar</text><text x="730" y="285">Third instar</text><text x="930" y="285">Adult female</text></g>
<text x="550" y="345" text-anchor="middle" font-family="Arial" font-size="17" fill="#536b80">The female passes through three nymphal instars. Male development differs; this diagram shows the female cycle of Phenacoccus manihoti.</text>
<text x="550" y="380" text-anchor="middle" font-family="Arial" font-size="16" fill="#536b80">Original teaching schematic; stages are simplified and not to scale.</text>
</svg>