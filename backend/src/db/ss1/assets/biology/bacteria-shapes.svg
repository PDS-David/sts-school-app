<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Common bacterial shapes and arrangements</title><desc id="desc">Original teaching diagram of cocci, bacilli, curved rods and spiral bacteria, with examples of common arrangements.</desc>
<rect width="1200" height="820" fill="#ffffff"/><text x="600" y="48" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#17324d">COMMON BACTERIAL SHAPES AND ARRANGEMENTS</text>
<g fill="#f4f8fc" stroke="#9bb4ca" stroke-width="2"><rect x="35" y="85" width="350" height="650" rx="18"/><rect x="425" y="85" width="350" height="650" rx="18"/><rect x="815" y="85" width="350" height="650" rx="18"/></g>
<g font-family="Arial" fill="#17324d" text-anchor="middle"><text x="210" y="130" font-size="26" font-weight="bold">COCCI</text><text x="210" y="160" font-size="17">Spherical cells</text><text x="600" y="130" font-size="26" font-weight="bold">BACILLI</text><text x="600" y="160" font-size="17">Rod-shaped cells</text><text x="990" y="130" font-size="26" font-weight="bold">CURVED / SPIRAL</text><text x="990" y="160" font-size="17">Curved rods and spirals</text></g>
<g fill="#68b7df" stroke="#1b6b99" stroke-width="3">
<circle cx="115" cy="230" r="18"/><circle cx="270" cy="230" r="18"/><circle cx="310" cy="230" r="18"/>
<circle cx="95" cy="335" r="17"/><circle cx="135" cy="335" r="17"/><circle cx="175" cy="335" r="17"/><circle cx="215" cy="335" r="17"/>
<circle cx="260" cy="315" r="17"/><circle cx="295" cy="315" r="17"/><circle cx="278" cy="350" r="17"/><circle cx="313" cy="350" r="17"/><circle cx="260" cy="385" r="17"/><circle cx="295" cy="385" r="17"/>
<circle cx="105" cy="490" r="17"/><circle cx="145" cy="490" r="17"/><circle cx="105" cy="530" r="17"/><circle cx="145" cy="530" r="17"/>
<circle cx="245" cy="500" r="17"/><circle cx="280" cy="500" r="17"/><circle cx="315" cy="500" r="17"/><circle cx="245" cy="535" r="17"/><circle cx="280" cy="535" r="17"/><circle cx="315" cy="535" r="17"/>
</g>
<g font-family="Arial" font-size="18" fill="#17324d" text-anchor="middle"><text x="115" y="275">Single coccus</text><text x="290" y="275">Diplococci</text><text x="155" y="390">Streptococci (chain)</text><text x="285" y="430">Staphylococci (cluster)</text><text x="125" y="575">Tetrad</text><text x="280" y="580">Sarcina (packet)</text></g>
<g fill="#68b7df" stroke="#1b6b99" stroke-width="3"><rect x="480" y="210" width="80" height="25" rx="13"/><rect x="620" y="210" width="80" height="25" rx="13"/><rect x="620" y="250" width="80" height="25" rx="13"/><rect x="485" y="335" width="80" height="25" rx="13"/><rect x="485" y="375" width="80" height="25" rx="13"/><rect x="485" y="415" width="80" height="25" rx="13"/><rect x="590" y="335" width="80" height="25" rx="13"/><rect x="590" y="375" width="80" height="25" rx="13"/><rect x="590" y="415" width="80" height="25" rx="13"/><rect x="485" y="520" width="35" height="18" rx="9"/><rect x="530" y="520" width="35" height="18" rx="9"/><rect x="575" y="520" width="35" height="18" rx="9"/><rect x="620" y="520" width="35" height="18" rx="9"/><rect x="665" y="520" width="35" height="18" rx="9"/><rect x="510" y="600" width="35" height="18" rx="9"/><rect x="545" y="600" width="35" height="18" rx="9"/><rect x="580" y="600" width="35" height="18" rx="9"/></g>
<g font-family="Arial" font-size="18" fill="#17324d" text-anchor="middle"><text x="520" y="285">Single bacillus</text><text x="660" y="305">Diplobacilli</text><text x="525" y="465">Streptobacilli</text><text x="635" y="465">Palisade arrangement</text><text x="590" y="565">Coccobacilli</text><text x="590" y="650">Rod arrangements vary</text></g>
<g fill="none" stroke="#1b6b99" stroke-width="9" stroke-linecap="round"><path d="M900 235 C940 190 980 280 1020 235"/><path d="M900 350 C940 300 980 400 1020 350 C1060 300 1100 400 1130 350"/><path d="M885 485 C920 420 955 550 990 485 C1025 420 1060 550 1095 485"/><path d="M900 620 C930 560 960 680 990 620 C1020 560 1050 680 1080 620 C1110 560 1130 650 1140 620"/></g>
<g font-family="Arial" font-size="18" fill="#17324d" text-anchor="middle"><text x="990" y="285">Vibrio (comma-shaped)</text><text x="1010" y="420">Spirillum (rigid spiral)</text><text x="990" y="555">Spirochete (flexible spiral)</text><text x="1015" y="700">Illustrative forms; not to scale</text></g>
<text x="600" y="790" text-anchor="middle" font-family="Arial" font-size="16" fill="#536b80">Bacterial shape and arrangement are identification clues; they do not by themselves identify a species.</text>
</svg>