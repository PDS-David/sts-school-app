<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Cockroach life cycle</title><desc id="d">Clockwise cycle: Egg Case, first Nymph, second Nymph, Adult and back to Egg Case. Incomplete metamorphosis.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#244b68"/></marker></defs><rect width="1100" height="700" fill="white"/><text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="38" font-weight="bold" fill="#18384d">Cockroach life cycle</text><g fill="none" stroke="#244b68" stroke-width="8" marker-end="url(#a)"><path d="M320 170Q550 65 780 170"/><path d="M850 240Q980 350 850 465"/><path d="M730 545Q550 650 370 545"/><path d="M250 465Q120 350 250 240"/></g><g font-family="Arial" text-anchor="middle" fill="#17384d"><g><rect x="410" y="105" width="280" height="100" rx="22" fill="#f4eee3" stroke="#94744b" stroke-width="4"/><text x="550" y="168" font-size="30" font-weight="bold">Egg Case</text></g><g><rect x="730" y="245" width="250" height="100" rx="22" fill="#edf5ec" stroke="#54825c" stroke-width="4"/><text x="855" y="308" font-size="30" font-weight="bold">Nymph</text></g><g><rect x="410" y="500" width="280" height="100" rx="22" fill="#edf5ec" stroke="#54825c" stroke-width="4"/><text x="550" y="563" font-size="30" font-weight="bold">Nymph</text></g><g><rect x="120" y="245" width="250" height="100" rx="22" fill="#f3f0e9" stroke="#806d4b" stroke-width="4"/><text x="245" y="308" font-size="30" font-weight="bold">Adult</text></g></g><text x="550" y="660" text-anchor="middle" font-family="Arial" font-size="24" fill="#244b68">Incomplete metamorphosis • Egg Case → Nymph → Nymph → Adult</text></svg>