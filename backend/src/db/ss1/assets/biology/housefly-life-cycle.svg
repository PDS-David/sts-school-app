<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Housefly life cycle</title><desc id="d">Clockwise cycle: Egg, Larva, Pupa, Adult and back to Egg. The diagram includes Embryo stage, Immature stage, Adult stage and METAMORPHOSIS labels.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#244b68"/></marker></defs><rect width="1200" height="760" fill="white"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="38" font-weight="bold" fill="#18384d">Housefly life cycle</text><g fill="none" stroke="#244b68" stroke-width="8" marker-end="url(#a)"><path d="M365 170Q600 65 835 170"/><path d="M930 255Q1060 390 880 535"/><path d="M760 620Q600 715 390 620"/><path d="M270 535Q130 390 270 255"/></g><g font-family="Arial" text-anchor="middle" fill="#17384d"><g><rect x="430" y="105" width="340" height="110" rx="22" fill="#f8f1e5" stroke="#9c8659" stroke-width="4"/><text x="600" y="150" font-size="30" font-weight="bold">Egg</text><text x="600" y="185" font-size="24">Embryo stage</text></g><g><rect x="825" y="245" width="300" height="125" rx="22" fill="#eef5ed" stroke="#64845e" stroke-width="4"/><text x="975" y="295" font-size="30" font-weight="bold">Larva</text><text x="975" y="335" font-size="24">Immature stage</text></g><g><rect x="430" y="555" width="340" height="125" rx="22" fill="#f3eee8" stroke="#96785d" stroke-width="4"/><text x="600" y="610" font-size="30" font-weight="bold">Pupa</text><text x="600" y="650" font-size="24">METAMORPHOSIS</text></g><g><rect x="75" y="245" width="300" height="125" rx="22" fill="#edf3f7" stroke="#557a93" stroke-width="4"/><text x="225" y="295" font-size="30" font-weight="bold">Adult</text><text x="225" y="335" font-size="24">Adult stage</text></g></g><text x="600" y="725" text-anchor="middle" font-family="Arial" font-size="24" fill="#244b68">Complete metamorphosis • Egg → Larva → Pupa → Adult → Egg</text></svg>