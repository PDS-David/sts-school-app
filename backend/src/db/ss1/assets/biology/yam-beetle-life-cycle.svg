<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Yam tuber beetle life cycle</title><desc id="desc">Yam tuber beetle develops through egg, larva, pupa and adult stages. The larva feeds in decaying organic matter and on grass roots; adults migrate to yam fields and damage tubers. Beetles have complete metamorphosis, not nymphs.</desc>
<rect width="1000" height="420" fill="#ffffff"/><text x="500" y="45" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#17324d">YAM TUBER BEETLE LIFE CYCLE</text>
<g stroke="#4b7b39" stroke-width="6" fill="none" stroke-linecap="round"><path d="M200 205 H315 M300 190 L320 205 L300 220"/><path d="M440 205 H555 M540 190 L560 205 L540 220"/><path d="M680 205 H795 M780 190 L800 205 L780 220"/><path d="M900 250 C900 345 100 345 100 250 M115 266 L100 245 L85 265"/></g>
<g fill="#f2d27a" stroke="#98733a" stroke-width="3"><ellipse cx="120" cy="195" rx="14" ry="24"/><ellipse cx="150" cy="195" rx="14" ry="24"/><ellipse cx="180" cy="195" rx="14" ry="24"/></g>
<g fill="#d7b47a" stroke="#8a6330" stroke-width="4"><path d="M365 190 C390 165 430 170 445 195 C455 220 425 240 390 235 C360 230 350 210 365 190 Z"/><path d="M370 200 L355 185 M385 230 L375 250 M415 230 L425 250" stroke-width="3" fill="none"/></g>
<g fill="#c7a1bd" stroke="#76516d" stroke-width="4"><ellipse cx="620" cy="205" rx="40" ry="55"/><path d="M590 205 Q620 150 650 205 Q620 260 590 205" fill="none" stroke-width="3"/></g>
<g fill="#5a4333" stroke="#2d261f" stroke-width="4"><ellipse cx="850" cy="205" rx="42" ry="28"/><circle cx="810" cy="190" r="20"/><path d="M835 220 L810 260 M860 220 L885 260 M820 180 L800 160 M875 190 L900 170" fill="none" stroke-width="5" stroke-linecap="round"/><path d="M835 180 Q875 130 910 180 Q880 220 835 180" fill="#8b765e" stroke-width="3"/></g>
<g font-family="Arial" font-size="22" fill="#17324d" text-anchor="middle"><text x="150" y="285">Egg</text><text x="395" y="285">Larva</text><text x="620" y="285">Pupa</text><text x="850" y="285">Adult beetle</text></g>
<text x="500" y="350" text-anchor="middle" font-family="Arial" font-size="18" fill="#536b80">Egg → larva → pupa → adult: complete metamorphosis. There is no nymph stage.</text><text x="500" y="380" text-anchor="middle" font-family="Arial" font-size="16" fill="#536b80">Adults damage yam tubers; larvae develop in soil/decaying organic matter.</text>
</svg>