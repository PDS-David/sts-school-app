<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Four teaching panels of mitosis</title><desc id="desc">Four original panels show prophase after interphase, metaphase with chromosomes at the equator, anaphase with sister chromatids separating, and telophase with cytokinesis forming two daughter cells.</desc>
<rect width="1200" height="520" fill="#ffffff"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#17324d">MITOSIS: FOUR MAIN STAGES</text>
<g fill="#f5f9fc" stroke="#9bb4ca" stroke-width="2"><rect x="25" y="75" width="275" height="360" rx="18"/><rect x="325" y="75" width="275" height="360" rx="18"/><rect x="625" y="75" width="275" height="360" rx="18"/><rect x="925" y="75" width="250" height="360" rx="18"/></g>
<g fill="none" stroke="#47708f" stroke-width="3"><ellipse cx="162" cy="240" rx="92" ry="72"/><ellipse cx="462" cy="240" rx="92" ry="72"/><ellipse cx="762" cy="240" rx="92" ry="72"/><path d="M1020 240 C1020 160 1140 160 1140 240 C1140 320 1020 320 1020 240"/></g>
<ellipse cx="162" cy="240" rx="42" ry="35" fill="#e7d9f4" stroke="#8a67a8" stroke-width="3"/><g stroke="#704f91" stroke-width="5" stroke-linecap="round"><path d="M145 225 l20 28 m0 -28 l-20 28"/><path d="M175 220 l18 26 m0 -26 l-18 26"/><path d="M135 250 l17 22 m0 -22 l-17 22"/></g><g fill="#e6a84d" stroke="#9a6828" stroke-width="2"><circle cx="90" cy="240" r="8"/><circle cx="234" cy="240" r="8"/></g>
<g stroke="#e6a84d" stroke-width="2" fill="none"><path d="M380 240 L450 220 L475 220 L545 240 M380 240 L450 260 L475 260 L545 240 M380 240 L455 240 L470 240 L545 240"/></g><g stroke="#704f91" stroke-width="5" stroke-linecap="round"><path d="M450 215 l20 25 m0 -25 l-20 25"/><path d="M450 245 l20 25 m0 -25 l-20 25"/><path d="M450 185 l20 25 m0 -25 l-20 25"/></g><path d="M462 170 V310" stroke="#d15a50" stroke-width="2" stroke-dasharray="6 6"/>
<g stroke="#e6a84d" stroke-width="2" fill="none"><path d="M680 240 L720 215 L740 215 M680 240 L720 265 L740 265 M845 240 L805 215 L785 215 M845 240 L805 265 L785 265"/></g><g stroke="#704f91" stroke-width="5" stroke-linecap="round"><path d="M725 200 l-18 20 l18 20"/><path d="M725 245 l-18 20 l18 20"/><path d="M800 200 l18 20 l-18 20"/><path d="M800 245 l18 20 l-18 20"/></g>
<ellipse cx="1060" cy="240" rx="30" ry="28" fill="#e7d9f4" stroke="#8a67a8" stroke-width="3"/><ellipse cx="1100" cy="240" rx="30" ry="28" fill="#e7d9f4" stroke="#8a67a8" stroke-width="3"/><g stroke="#704f91" stroke-width="4" stroke-linecap="round"><path d="M1048 230 l10 15 m0 -15 l-10 15"/><path d="M1088 230 l10 15 m0 -15 l-10 15"/></g><path d="M1080 170 Q1050 205 1080 240 Q1110 275 1080 310" stroke="#d15a50" stroke-width="4" fill="none"/>
<g font-family="Arial" font-size="21" font-weight="bold" fill="#17324d" text-anchor="middle"><text x="162" y="125">1. PROPHASE</text><text x="462" y="125">2. METAPHASE</text><text x="762" y="125">3. ANAPHASE</text><text x="1050" y="125">4. TELOPHASE</text></g>
<g font-family="Arial" font-size="16" fill="#314e68" text-anchor="middle"><text x="162" y="355">Chromosomes condense;</text><text x="162" y="378">spindle begins to form.</text><text x="462" y="355">Chromosomes line up</text><text x="462" y="378">at the cell equator.</text><text x="762" y="355">Sister chromatids move</text><text x="762" y="378">towards opposite poles.</text><text x="1050" y="355">Nuclei reform; cytokinesis</text><text x="1050" y="378">separates daughter cells.</text></g>
<text x="600" y="470" text-anchor="middle" font-family="Arial" font-size="17" fill="#536b80">Interphase happens before mitosis. Animal cells form a cleavage furrow; plant cells form a cell plate during cytokinesis.</text>
</svg>