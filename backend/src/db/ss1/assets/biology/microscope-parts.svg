    <path d="M420 480 L420 530"/>
    <path d="M680 490 L730 490"/>
  </g>
  <g fill="#d9e7f2" stroke="#253b50" stroke-width="5">
    <rect x="385" y="78" width="120" height="42" rx="8"/>
    <rect x="395" y="160" width="70" height="120" rx="8"/>
    <path d="M465 280 L520 280 L520 310 L465 310 Z"/>
    <rect x="465" y="305" width="30" height="70" rx="5"/>
