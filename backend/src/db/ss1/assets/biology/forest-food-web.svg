<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Food Web in a Forest</title>
  <desc id="desc">A project-authored forest food web. Green Plant is the producer. Arrows point from a food source to the organism that eats it. Clearly traceable source relationships are shown; uncertain crossing links are omitted and documented separately.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#172554}
      .subtitle{font:22px Arial,sans-serif;fill:#475569}
      .node{stroke:#334155;stroke-width:3;rx:22;ry:22}
      .label{font:700 27px Arial,sans-serif;fill:#172033;text-anchor:middle}
      .small{font:20px Arial,sans-serif;fill:#334155;text-anchor:middle}
      .edge{fill:none;stroke:#475569;stroke-width:5;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1100" fill="#ffffff"/>
  <text x="800" y="65" class="title" text-anchor="middle">Food Web in a Forest</text>
  <text x="800" y="105" class="subtitle" text-anchor="middle">Arrows point from the food source to the consumer</text>
  <g class="edge">
    <path d="M300 465 C365 465 395 405 455 405"/>
