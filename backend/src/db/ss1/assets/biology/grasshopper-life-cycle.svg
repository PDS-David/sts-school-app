<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Grasshopper life cycle</title><desc id="desc">Eggs hatch into nymphs. Nymphs grow through repeated moults and become winged adults. There is no pupa stage; this is incomplete metamorphosis.</desc>
<rect width="1000" height="420" fill="#ffffff"/><text x="500" y="45" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#17324d">GRASSHOPPER LIFE CYCLE</text>
<g stroke="#4b7b39" stroke-width="6" fill="none" stroke-linecap="round"><path d="M250 205 H335"/><path d="M320 190 L340 205 L320 220"/><path d="M575 205 H660"/><path d="M645 190 L665 205 L645 220"/><path d="M850 250 C850 335 150 335 150 250"/><path d="M165 266 L150 245 L135 265"/></g>
<g fill="#e9c46a" stroke="#8b6b2e" stroke-width="3"><ellipse cx="155" cy="180" rx="22" ry="48"/><ellipse cx="185" cy="180" rx="22" ry="48"/><ellipse cx="215" cy="180" rx="22" ry="48"/></g>
<g fill="#9abf65" stroke="#3e6b35" stroke-width="4"><ellipse cx="450" cy="210" rx="20" ry="48" transform="rotate(-18 450 210)"/><circle cx="435" cy="155" r="18"/><path d="M445 235 L410 290 M458 235 L485 285 M430 165 L395 145 M455 165 L475 145" fill="none" stroke-width="6" stroke-linecap="round"/><path d="M470 185 L500 170" fill="none" stroke-width="4"/></g>
<g fill="#8fbf55" stroke="#3e6b35" stroke-width="4"><ellipse cx="770" cy="205" rx="28" ry="62" transform="rotate(-12 770 205)"/><circle cx="740" cy="140" r="22"/><path d="M760 245 L700 315 M780 245 L820 305 M748 160 L700 145 M770 160 L805 140 M775 200 L850 150" fill="none" stroke-width="7" stroke-linecap="round"/><path d="M750 170 Q820 95 865 170 Q815 220 750 170" fill="#c4d99a" stroke-width="3"/></g>
<g font-family="Arial" font-size="22" fill="#17324d" text-anchor="middle"><text x="185" y="290">Egg pod</text><text x="455" y="330">Nymph</text><text x="780" y="330">Adult</text></g>
<text x="500" y="385" text-anchor="middle" font-family="Arial" font-size="18" fill="#536b80">Nymphs moult several times as they grow. No pupa stage occurs: this is incomplete metamorphosis.</text>
</svg>