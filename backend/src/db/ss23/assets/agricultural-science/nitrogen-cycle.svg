<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">The nitrogen cycle in a farm soil</title>
<desc id="desc">Original educational diagram showing nitrogen fixation, ammonification, nitrification, plant uptake, crop removal, leaching and denitrification.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="600" y="48" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#111827">THE NITROGEN CYCLE IN A FARM SOIL</text>
<g font-family="Arial" font-size="22" text-anchor="middle" stroke="#334155" stroke-width="3">
<rect x="430" y="85" width="340" height="78" rx="16" fill="#dbeafe"/><text x="600" y="132" stroke="none" fill="#111827">Atmospheric nitrogen (N₂)</text>
<rect x="55" y="300" width="260" height="90" rx="16" fill="#dcfce7"/><text x="185" y="338" stroke="none" fill="#111827">Organic matter</text><text x="185" y="366" stroke="none" fill="#111827">and residues</text>
<rect x="430" y="300" width="340" height="90" rx="16" fill="#fef3c7"/><text x="600" y="353" stroke="none" fill="#111827">Ammonium (NH₄⁺)</text>
<rect x="885" y="300" width="260" height="90" rx="16" fill="#fef3c7"/><text x="1015" y="353" stroke="none" fill="#111827">Nitrate (NO₃⁻)</text>
<rect x="430" y="520" width="340" height="85" rx="16" fill="#dcfce7"/><text x="600" y="570" stroke="none" fill="#111827">Plants and crop biomass</text>
<rect x="55" y="520" width="260" height="85" rx="16" fill="#fee2e2"/><text x="185" y="570" stroke="none" fill="#111827">Harvest removal</text>
<rect x="885" y="520" width="260" height="85" rx="16" fill="#fee2e2"/><text x="1015" y="570" stroke="none" fill="#111827">Leaching loss</text>
</g>
<g stroke="#2563eb" stroke-width="6" fill="none">
<path d="M600 163 V300"/><path d="M315 345 H430"/><path d="M770 345 H885"/><path d="M1015 390 V520"/><path d="M600 390 V520"/><path d="M430 562 H315"/><path d="M1015 300 V210 H780 V163"/><path d="M885 390 L770 510"/><path d="M430 562 H340 V420 H185 V390"/>
</g>
<g stroke="#2563eb" stroke-width="5" fill="none">
<path d="M588 285 l12 15 12 -15"/><path d="M415 333 l15 12 -15 12"/><path d="M870 333 l15 12 -15 12"/><path d="M1003 505 l12 15 12 -15"/><path d="M588 505 l12 15 12 -15"/><path d="M330 550 l-15 12 15 12"/><path d="M795 151 l-15 12 -15 -12"/><path d="M785 495 l-15 15 -2 -20"/><path d="M173 405 l12 -15 12 15"/>
</g>
<g font-family="Arial" font-size="18" fill="#1f2937" text-anchor="middle">
<text x="690" y="235">Biological fixation / lightning</text><text x="370" y="325">Ammonification</text><text x="830" y="325">Nitrification</text><text x="1065" y="455">Leaching</text><text x="640" y="455">Ammonium uptake</text><text x="840" y="435">Nitrate uptake</text><text x="370" y="545">Crop harvest</text><text x="910" y="195">Denitrification returns N gases</text><text x="265" y="445">Residues / manure</text>
</g>
</svg>