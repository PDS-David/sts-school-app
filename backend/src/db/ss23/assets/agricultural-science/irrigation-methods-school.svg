<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Common irrigation methods</title><desc id="desc">Original explanatory diagram comparing surface furrow irrigation, overhead sprinkler irrigation and drip or micro-irrigation.</desc>
<rect width="1100" height="520" fill="#fbfaf4"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#263b2e">Common irrigation methods</text>
<text x="40" y="76" font-family="Arial,sans-serif" font-size="16" fill="#526256">Water is applied to the crop root zone by different methods; selection depends on site and system conditions.</text>
<g font-family="Arial,sans-serif" stroke-width="3">
<rect x="35" y="105" width="325" height="335" rx="14" fill="#f2f0e4" stroke="#87967a"/><text x="197" y="140" text-anchor="middle" font-size="21" font-weight="700" fill="#263b2e" stroke="none">Surface / furrow</text>
<path d="M65 335H330" stroke="#8c744e"/><path d="M80 300Q100 345 120 300T160 300T200 300T240 300T280 300T320 300" fill="none" stroke="#3c91bd" stroke-width="9"/>
<path d="M95 296V230M155 296V220M215 296V228M275 296V220" stroke="#4e8a4c"/><path d="M95 240L82 262M95 240L108 262M155 232L142 254M155 232L168 254M215 240L202 262M215 240L228 262M275 232L262 254M275 232L288 254" stroke="#4e8a4c"/>
<text x="197" y="380" text-anchor="middle" font-size="15" fill="#263b2e" stroke="none">Water flows along furrows</text><text x="197" y="405" text-anchor="middle" font-size="13" fill="#526256" stroke="none">Surface is graded to guide flow</text>
<rect x="388" y="105" width="325" height="335" rx="14" fill="#f2f0e4" stroke="#87967a"/><text x="550" y="140" text-anchor="middle" font-size="21" font-weight="700" fill="#263b2e" stroke="none">Sprinkler / overhead</text>
<path d="M420 335H680" stroke="#8c744e"/><path d="M550 335V230" stroke="#586c74"/><path d="M520 230H580" stroke="#586c74"/><path d="M520 230Q470 195 445 230M580 230Q630 195 655 230M520 230Q480 170 460 190M580 230Q620 170 640 190" fill="none" stroke="#3c91bd" stroke-width="4"/><path d="M450 250L440 268M485 260L478 278M615 260L622 278M650 250L660 268" stroke="#3c91bd" stroke-width="4"/>
<path d="M465 330V275M525 330V280M585 330V278M645 330V275" stroke="#4e8a4c"/><text x="550" y="380" text-anchor="middle" font-size="15" fill="#263b2e" stroke="none">Pressurised spray over crops</text><text x="550" y="405" text-anchor="middle" font-size="13" fill="#526256" stroke="none">Wind and evaporation affect uniformity</text>
<rect x="740" y="105" width="325" height="335" rx="14" fill="#f2f0e4" stroke="#87967a"/><text x="902" y="140" text-anchor="middle" font-size="21" font-weight="700" fill="#263b2e" stroke="none">Drip / micro-irrigation</text>
<path d="M770 335H1035" stroke="#8c744e"/><path d="M780 235H1025" stroke="#287a9c" stroke-width="8"/><path d="M805 235V285M860 235V285M915 235V285M970 235V285M1015 235V285" stroke="#287a9c" stroke-width="3"/><g fill="#3c91bd" stroke="none"><circle cx="805" cy="292" r="5"/><circle cx="860" cy="292" r="5"/><circle cx="915" cy="292" r="5"/><circle cx="970" cy="292" r="5"/><circle cx="1015" cy="292" r="5"/></g><path d="M805 330V275M860 330V275M915 330V275M970 330V275M1015 330V275" stroke="#4e8a4c"/><text x="902" y="380" text-anchor="middle" font-size="15" fill="#263b2e" stroke="none">Emitters apply water near roots</text><text x="902" y="405" text-anchor="middle" font-size="13" fill="#526256" stroke="none">Flow and filtration need maintenance</text>
</g>
<text x="550" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#526256">Irrigation applies water; drainage removes excess water. The two processes are not interchangeable.</text>
</svg>