<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" role="img" aria-labelledby="t d">
<title id="t">Generalized soil profile</title><desc id="d">Original not-to-scale soil profile showing possible O, A, optional E, B, C and R horizons with vegetation and roots; real horizons vary between soils.</desc>
<rect width="980" height="600" fill="#fbfaf4"/><text x="40" y="45" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#263b2e">A generalized soil profile</text>
<text x="40" y="74" font-family="Arial,sans-serif" font-size="15" fill="#526256">Illustrative horizons only: not every soil has every layer, and depths vary from place to place.</text>
<rect x="70" y="130" width="430" height="390" rx="8" fill="#e9e4d3" stroke="#786c54" stroke-width="2"/>
<rect x="70" y="130" width="430" height="35" fill="#59422d"/><text x="285" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#fff">O - surface organic layer (where present)</text>
<rect x="70" y="165" width="430" height="85" fill="#76563d"/><text x="285" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#fff">A - topsoil</text>
<rect x="70" y="250" width="430" height="42" fill="#c3b28e"/><text x="285" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#342b20">E - eluviation horizon (if present)</text>
<rect x="70" y="292" width="430" height="95" fill="#a8784f"/><text x="285" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#fff">B - subsoil</text>
<rect x="70" y="387" width="430" height="73" fill="#c5a77d"/><text x="285" y="427" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#342b20">C - weathered parent material</text>
<rect x="70" y="460" width="430" height="60" fill="#8c8b85"/><path d="M70 480L120 466L175 489L230 467L290 490L350 470L410 489L500 468" fill="none" stroke="#66645f" stroke-width="4"/><text x="285" y="508" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#fff">R - bedrock</text>
<g stroke="#557c49" stroke-width="5" fill="none"><path d="M280 130V95M280 108L250 84M280 109L311 82"/><path d="M280 165Q260 195 280 225Q295 250 272 280Q262 310 280 342Q297 369 278 398"/></g>
<g fill="#557c49"><ellipse cx="245" cy="83" rx="24" ry="12"/><ellipse cx="315" cy="82" rx="24" ry="12"/><ellipse cx="280" cy="72" rx="27" ry="14"/></g>
<g font-family="Arial,sans-serif" fill="#263b2e"><text x="550" y="150" font-size="20" font-weight="700">What the layers represent</text><text x="550" y="195" font-size="16">O: plant litter and decomposing organic material, where present.</text><text x="550" y="250" font-size="16">A: mineral topsoil mixed with organic matter and biological activity.</text><text x="550" y="305" font-size="16">E: a leached layer that occurs in some, not all, soil profiles.</text><text x="550" y="360" font-size="16">B: subsoil where materials may accumulate from upper layers.</text><text x="550" y="415" font-size="16">C: partly weathered parent material.</text><text x="550" y="470" font-size="16">R: consolidated bedrock beneath the soil.</text></g>
<text x="490" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#526256">Rooting depth, horizon thickness and layer colour vary with climate, organisms, relief, parent material and time.</text>
</svg>