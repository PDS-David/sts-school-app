<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Surface and subsurface drainage</title>
<desc id="desc">Original educational cross-section comparing an open surface drain with a buried perforated drainage pipe.</desc>
<rect width="1200" height="620" fill="#ffffff"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#111827">TWO DRAINAGE SYSTEMS</text>
<g font-family="Arial" fill="#111827" font-size="25" font-weight="bold"><text x="300" y="112" text-anchor="middle">1. SURFACE DRAINAGE</text><text x="900" y="112" text-anchor="middle">2. SUBSURFACE DRAINAGE</text></g>
<g stroke="#8b5e3c" stroke-width="6" fill="#d6b58c"><path d="M45 230 H555 V510 H45 Z"/><path d="M645 230 H1155 V510 H645 Z"/></g>
<path d="M210 230 L260 360 L330 360 L380 230" fill="#ffffff" stroke="#8b5e3c" stroke-width="8"/>
<path d="M270 350 Q295 335 320 350" stroke="#2563eb" stroke-width="12" fill="none"/>
<g stroke="#2563eb" stroke-width="5" fill="none"><path d="M120 200 L240 310 M480 200 L350 310"/><path d="M225 300 l15 10 -5 -18 M365 300 l-15 10 5 -18"/></g>
<text x="300" y="420" text-anchor="middle" font-family="Arial" font-size="18" fill="#111827">Open ditch carries excess surface water away.</text>
<path d="M690 380 H1110" stroke="#2563eb" stroke-width="24" fill="none"/>
<g stroke="#ffffff" stroke-width="5"><path d="M720 367 v26 M760 367 v26 M800 367 v26 M840 367 v26 M880 367 v26 M920 367 v26 M960 367 v26 M1000 367 v26 M1040 367 v26 M1080 367 v26"/></g>
<g stroke="#2563eb" stroke-width="5" fill="none"><path d="M760 250 V350 M900 250 V350 M1040 250 V350"/><path d="M748 335 l12 15 12 -15 M888 335 l12 15 12 -15 M1028 335 l12 15 12 -15"/></g>
<path d="M650 440 Q900 410 1150 440" stroke="#0ea5e9" stroke-width="5" stroke-dasharray="14 10" fill="none"/>
<g font-family="Arial" fill="#111827" font-size="18"><text x="900" y="475" text-anchor="middle">Buried perforated pipe collects excess water from the root zone.</text><text x="600" y="570" text-anchor="middle" font-size="16">Drainage needs a safe outlet and works with irrigation and leaching to manage waterlogging and salts.</text></g>
</svg>