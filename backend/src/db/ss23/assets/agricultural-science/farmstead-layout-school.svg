<rect x="450" y="355" width="90" height="60" rx="6" fill="#d7d5c3" stroke="#756f57"/><ellipse cx="495" cy="355" rx="45" ry="10" fill="#e8e4d3" stroke="#756f57"/><text x="495" y="432" text-anchor="middle" font-size="13" stroke="none">Silo</text>
<rect x="595" y="300" width="335" height="140" rx="10" fill="url(#crop)" stroke="#8a9a7a"/><text x="762" y="326" text-anchor="middle" font-size="18" font-weight="700" stroke="none">Crop production plots</text><text x="762" y="385" text-anchor="middle" font-size="16" stroke="none">Fields arranged by crop plan</text>
<rect x="70" y="465" width="255" height="42" rx="8" fill="#e2eadb" stroke="#8a9a7a"/><text x="197" y="492" text-anchor="middle" font-size="14" stroke="none">Orchard / tree crops</text>
<rect x="355" y="465" width="250" height="42" rx="8" fill="#e7e1cf" stroke="#a69a79"/><text x="480" y="492" text-anchor="middle" font-size="14" stroke="none">Clean water point</text>
<rect x="635" y="465" width="295" height="42" rx="8" fill="#e8e6d8" stroke="#a69a79"/><text x="782" y="492" text-anchor="middle" font-size="14" stroke="none">Drainage route</text>
</g>
<path d="M40 550H960" stroke="#777" stroke-width="25"/><path d="M40 550H960" stroke="#fff" stroke-width="2" stroke-dasharray="20 16"/><text x="500" y="579" font-family="Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle">Farm access road</text>
<g transform="translate(902 108)" font-family="Arial,sans-serif" fill="#263b2e"><path d="M0 28L13 0L26 28Z" fill="#385b43"/><text x="13" y="45" font-size="13" text-anchor="middle">N</text></g>
<text x="500" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526256">Actual siting depends on site levels, soil stability, drainage, access, water, hygiene, wind and biosecurity.</text>
</svg>