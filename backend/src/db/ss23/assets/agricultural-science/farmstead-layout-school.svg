<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="t d">
<title id="t">Illustrative farmstead layout</title><desc id="d">Original not-to-scale farmstead teaching schematic showing residence, office, machinery shed, workshop, livestock and dairy, store, silo, greenhouse, garden beds, orchard, crop plots, clean water point and access road.</desc>
<defs><pattern id="crop" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 18L18 0M-5 5L5-5M13 23L23 13" stroke="#a6bd82" stroke-width="2"/></pattern></defs>
<rect width="1000" height="680" fill="#fbfaf4"/>
<text x="40" y="45" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263b2e">Illustrative farmstead layout</text>
<text x="40" y="72" font-family="Arial,sans-serif" font-size="15" fill="#526256">Teaching schematic only - not to scale or a construction / boundary plan</text>
<rect x="40" y="95" width="920" height="500" rx="16" fill="#f3f1e4" stroke="#647865" stroke-width="3"/>
<g font-family="Arial,sans-serif" fill="#263b2e" stroke-width="2">
<rect x="70" y="125" width="245" height="145" rx="10" fill="#e9eee0" stroke="#8a9a7a"/><text x="192" y="151" text-anchor="middle" font-size="18" font-weight="700" stroke="none">Residence / administration</text>
<rect x="90" y="180" width="88" height="58" fill="#d5c6a6" stroke="#685c46"/><path d="M84 180L134 155L184 180Z" fill="#a7684c" stroke="#685c46"/><text x="134" y="256" text-anchor="middle" font-size="13" stroke="none">Dwelling</text>
<rect x="205" y="188" width="88" height="50" fill="#d5c6a6" stroke="#685c46"/><path d="M199 188L249 164L299 188Z" fill="#a7684c" stroke="#685c46"/><text x="249" y="256" text-anchor="middle" font-size="13" stroke="none">Office / store</text>
<rect x="350" y="125" width="260" height="145" rx="10" fill="#e8eee8" stroke="#8a9a7a"/><text x="480" y="151" text-anchor="middle" font-size="18" font-weight="700" stroke="none">Machinery / workshop</text>
<rect x="375" y="185" width="100" height="54" fill="#c7d2d0" stroke="#50645e"/><path d="M369 185L425 160L481 185Z" fill="#637e72" stroke="#50645e"/><text x="425" y="256" text-anchor="middle" font-size="13" stroke="none">Machinery shed</text>
<rect x="495" y="185" width="90" height="54" fill="#d9d0b7" stroke="#685c46"/><path d="M489 185L540 160L591 185Z" fill="#a7684c" stroke="#685c46"/><text x="540" y="256" text-anchor="middle" font-size="13" stroke="none">Workshop</text>
<rect x="645" y="125" width="285" height="145" rx="10" fill="#f0e8dc" stroke="#b18a6c"/><text x="787" y="151" text-anchor="middle" font-size="18" font-weight="700" stroke="none">Livestock / dairy</text>
<rect x="670" y="185" width="100" height="54" fill="#e1c69b" stroke="#795e3f"/><path d="M664 185L720 160L776 185Z" fill="#9e7353" stroke="#795e3f"/><text x="720" y="256" text-anchor="middle" font-size="13" stroke="none">Barn</text>
<rect x="790" y="185" width="115" height="54" fill="#e1c69b" stroke="#795e3f"/><path d="M784 185L847 160L911 185Z" fill="#9e7353" stroke="#795e3f"/><text x="847" y="256" text-anchor="middle" font-size="13" stroke="none">Dairy / animal shelter</text>
<rect x="70" y="300" width="205" height="140" rx="10" fill="#ecf0e1" stroke="#8a9a7a"/><text x="172" y="326" text-anchor="middle" font-size="18" font-weight="700" stroke="none">Horticulture</text>
<rect x="88" y="350" width="74" height="65" fill="#dbe9d1" stroke="#617b57"/><path d="M88 350L125 330L162 350Z" fill="#95b98a" stroke="#617b57"/><text x="125" y="432" text-anchor="middle" font-size="13" stroke="none">Greenhouse</text>
<rect x="181" y="350" width="76" height="65" fill="#e9dfb9" stroke="#8d8152"/><path d="M194 360V405M211 360V405M228 360V405M245 360V405" stroke="#9c8d59" stroke-width="3"/><text x="219" y="432" text-anchor="middle" font-size="13" stroke="none">Garden beds</text>
<rect x="305" y="300" width="260" height="140" rx="10" fill="#e6edda" stroke="#8a9a7a"/><text x="435" y="326" text-anchor="middle" font-size="18" font-weight="700" stroke="none">Storage / processing</text>
