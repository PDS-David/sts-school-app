<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Carbon and water cycles</title>
<desc id="desc">Original educational two-panel diagram showing carbon movement through photosynthesis, respiration and decomposition, and water movement through evaporation, precipitation, infiltration and transpiration.</desc>
<rect width="1200" height="820" fill="#ffffff"/>
<text x="600" y="48" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#111827">CARBON AND WATER CYCLES</text>
<rect x="35" y="85" width="1130" height="320" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
<rect x="35" y="435" width="1130" height="350" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
<text x="600" y="125" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#111827">CARBON CYCLE</text>
<text x="600" y="475" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#111827">WATER CYCLE</text>
<g font-family="Arial" font-size="20" text-anchor="middle" stroke="#334155" stroke-width="3">
<rect x="75" y="175" width="250" height="78" rx="15" fill="#dbeafe"/><text x="200" y="222" stroke="none" fill="#111827">Atmospheric CO₂</text>
<rect x="475" y="175" width="250" height="78" rx="15" fill="#dcfce7"/><text x="600" y="222" stroke="none" fill="#111827">Plants and biomass</text>
<rect x="875" y="175" width="250" height="78" rx="15" fill="#fef3c7"/><text x="1000" y="222" stroke="none" fill="#111827">Soil organic matter</text>
</g>
<g stroke="#2563eb" stroke-width="6" fill="none"><path d="M325 214 H475"/><path d="M725 214 H875"/><path d="M1000 253 V325 H200 V253"/></g>
<g stroke="#2563eb" stroke-width="5" fill="none"><path d="M460 202 l15 12 -15 12"/><path d="M860 202 l15 12 -15 12"/><path d="M188 270 l12 -17 12 17"/></g>
<g font-family="Arial" font-size="18" fill="#1f2937" text-anchor="middle"><text x="400" y="190">Photosynthesis</text><text x="800" y="190">Residues / decay</text><text x="600" y="365">Respiration, decomposition and combustion return carbon.</text></g>
<g font-family="Arial" font-size="20" text-anchor="middle" stroke="#334155" stroke-width="3">
<rect x="55" y="560" width="235" height="78" rx="15" fill="#dbeafe"/><text x="172" y="607" stroke="none" fill="#111827">Surface water / soil</text>
<rect x="365" y="560" width="235" height="78" rx="15" fill="#e0f2fe"/><text x="482" y="607" stroke="none" fill="#111827">Water vapour</text>
<rect x="675" y="560" width="205" height="78" rx="15" fill="#ede9fe"/><text x="777" y="607" stroke="none" fill="#111827">Clouds</text>
<rect x="935" y="660" width="220" height="78" rx="15" fill="#dcfce7"/><text x="1045" y="707" stroke="none" fill="#111827">Land / groundwater</text>
</g>
<g stroke="#2563eb" stroke-width="6" fill="none"><path d="M290 599 H365"/><path d="M600 599 H675"/><path d="M777 638 V700 H935"/><path d="M1045 738 V755 H172 V638"/></g>
<g stroke="#2563eb" stroke-width="5" fill="none"><path d="M350 587 l15 12 -15 12"/><path d="M660 587 l15 12 -15 12"/><path d="M923 688 l12 12 -12 12"/><path d="M160 650 l12 -12 12 12"/></g>
<g font-family="Arial" font-size="17" fill="#1f2937" text-anchor="middle"><text x="327" y="545">Evaporation / transpiration</text><text x="637" y="545">Condensation</text><text x="875" y="650">Precipitation</text><text x="600" y="775">Runoff, infiltration, percolation and groundwater flow return water.</text></g>
</svg>