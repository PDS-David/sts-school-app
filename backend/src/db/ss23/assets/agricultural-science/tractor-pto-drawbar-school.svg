</g>
<g font-family="Arial,sans-serif" fill="#263b2e"><text x="770" y="175" text-anchor="middle" font-size="14">Tractor engine</text><text x="985" y="225" text-anchor="middle" font-size="14">Trailer / implement</text><text x="910" y="300" text-anchor="middle" font-size="13" fill="#8c4b2d">Hitch point</text><text x="812" y="435" text-anchor="middle" font-size="15">Drawbar transmits pulling force</text><text x="812" y="458" text-anchor="middle" font-size="13" fill="#526256">Check load limits and secure coupling.</text></g>
<text x="550" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#526256">Not a machine-specific service diagram. Always consult the tractor and implement manuals.</text>
