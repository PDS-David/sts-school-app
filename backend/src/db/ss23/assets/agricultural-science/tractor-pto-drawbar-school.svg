<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="t d">
<title id="t">Tractor PTO and drawbar functions</title><desc id="d">Original explanatory schematic distinguishing rotary power transfer through a power take-off shaft from towing force through a drawbar hitch.</desc>
<rect width="1100" height="560" fill="#fbfaf4"/><text x="40" y="45" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263b2e">Two different tractor connections</text>
<text x="40" y="73" font-family="Arial,sans-serif" font-size="15" fill="#526256">PTO transmits rotary power; the drawbar / hitch transmits pulling force.</text>
<rect x="35" y="100" width="505" height="390" rx="14" fill="#eef2e6" stroke="#8a9a7a" stroke-width="2"/>
<text x="287" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263b2e">Power take-off (PTO)</text>
<g stroke="#435b47" stroke-width="3">
<path d="M110 360H365" stroke="#846f4f" stroke-width="6"/>
<circle cx="170" cy="340" r="57" fill="#485f4d"/><circle cx="170" cy="340" r="22" fill="#d9d5c5"/>
<circle cx="310" cy="355" r="34" fill="#485f4d"/><circle cx="310" cy="355" r="14" fill="#d9d5c5"/>
<rect x="150" y="235" width="190" height="85" rx="15" fill="#a6bd82"/><path d="M170 235L210 192H295L330 235Z" fill="#77936b"/>
<rect x="200" y="203" width="60" height="32" fill="#d8e8ed" stroke="#435b47"/>
<path d="M340 315H385" stroke="#a65f36" stroke-width="9"/><path d="M382 305V325" stroke="#a65f36" stroke-width="4"/>
<path d="M385 315H425" stroke="#a65f36" stroke-width="7"/><rect x="425" y="260" width="70" height="100" fill="#c3c9bf" stroke="#435b47"/>
<path d="M420 260L460 230L500 260Z" fill="#8a9a7a"/>
<path d="M435 362H510" stroke="#846f4f" stroke-width="6"/><circle cx="450" cy="375" r="24" fill="#485f4d"/><circle cx="495" cy="375" r="24" fill="#485f4d"/>
</g>
<g font-family="Arial,sans-serif" fill="#263b2e"><text x="245" y="175" text-anchor="middle" font-size="14">Tractor engine</text><text x="403" y="210" text-anchor="middle" font-size="14">Rotary implement</text><text x="386" y="295" text-anchor="middle" font-size="13" fill="#8c4b2d">PTO shaft</text><text x="287" y="435" text-anchor="middle" font-size="15">Rotating shaft supplies mechanical power</text><text x="287" y="458" text-anchor="middle" font-size="13" fill="#526256">Use guards and follow equipment safety rules.</text></g>
<rect x="560" y="100" width="505" height="390" rx="14" fill="#f2eee4" stroke="#b4a47d" stroke-width="2"/>
<text x="812" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263b2e">Drawbar / towing hitch</text>
<g stroke="#435b47" stroke-width="3">
<path d="M635 360H885" stroke="#846f4f" stroke-width="6"/>
<circle cx="695" cy="340" r="57" fill="#485f4d"/><circle cx="695" cy="340" r="22" fill="#d9d5c5"/>
<circle cx="835" cy="355" r="34" fill="#485f4d"/><circle cx="835" cy="355" r="14" fill="#d9d5c5"/>
<rect x="675" y="235" width="190" height="85" rx="15" fill="#a6bd82"/><path d="M695 235L735 192H820L855 235Z" fill="#77936b"/>
<rect x="725" y="203" width="60" height="32" fill="#d8e8ed" stroke="#435b47"/>
<path d="M865 330L910 330" stroke="#a65f36" stroke-width="8"/><circle cx="914" cy="330" r="7" fill="#a65f36"/>
