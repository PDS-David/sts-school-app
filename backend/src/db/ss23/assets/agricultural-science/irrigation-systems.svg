<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Four irrigation methods</title>
<desc id="desc">Original educational schematic comparing surface, sprinkler, drip micro-irrigation and subsurface irrigation.</desc>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="600" y="54" font-size="34" text-anchor="middle" font-family="Arial" font-weight="bold">FOUR IRRIGATION METHODS</text>
<g font-family="Arial" fill="#1f2937" stroke="#1f2937" stroke-width="3">
<rect x="35" y="90" width="550" height="285" rx="18" fill="#f8fafc"/>
<rect x="615" y="90" width="550" height="285" rx="18" fill="#f8fafc"/>
<rect x="35" y="405" width="550" height="315" rx="18" fill="#f8fafc"/>
<rect x="615" y="405" width="550" height="315" rx="18" fill="#f8fafc"/>
</g>
<g font-family="Arial" fill="#111827" font-size="25" font-weight="bold">
<text x="310" y="132" text-anchor="middle">1. SURFACE (GRAVITY)</text>
<text x="890" y="132" text-anchor="middle">2. SPRINKLER</text>
<text x="310" y="448" text-anchor="middle">3. DRIP / MICRO-IRRIGATION</text>
<text x="890" y="448" text-anchor="middle">4. SUBSURFACE</text>
</g>
<g stroke="#8b5e3c" stroke-width="7" fill="none"><path d="M80 285 H540"/><path d="M110 260 Q170 290 230 260 T350 260 T500 260" stroke="#2563eb" stroke-width="10"/></g>
<g stroke="#16a34a" stroke-width="6" fill="none"><path d="M165 255 V205 M310 255 V195 M455 255 V205"/><path d="M165 220 l-25 -18 M165 220 l24 -18 M310 210 l-25 -18 M310 210 l25 -18 M455 220 l-25 -18 M455 220 l25 -18"/></g>
<text x="310" y="330" text-anchor="middle" font-family="Arial" font-size="17" fill="#1f2937">Water flows across the soil in furrows, basins or borders.</text>
<g stroke="#8b5e3c" stroke-width="7" fill="none"><path d="M670 285 H1110"/></g>
<g stroke="#2563eb" stroke-width="7" fill="none"><path d="M890 285 V190 M890 190 Q800 160 760 205 M890 190 Q980 160 1020 205 M890 190 Q830 125 810 155 M890 190 Q950 125 970 155"/></g>
<g stroke="#16a34a" stroke-width="6" fill="none"><path d="M760 280 V225 M890 280 V225 M1020 280 V225"/><path d="M760 240 l-20 -15 M760 240 l20 -15 M890 240 l-20 -15 M890 240 l20 -15 M1020 240 l-20 -15 M1020 240 l20 -15"/></g>
<g fill="#2563eb"><circle cx="760" cy="205" r="6"/><circle cx="810" cy="155" r="6"/><circle cx="970" cy="155" r="6"/><circle cx="1020" cy="205" r="6"/></g>
<text x="890" y="330" text-anchor="middle" font-family="Arial" font-size="17" fill="#1f2937">Pressurised water is sprayed through nozzles.</text>
<g stroke="#8b5e3c" stroke-width="7" fill="none"><path d="M80 640 H540"/></g>
<g stroke="#16a34a" stroke-width="6" fill="none"><path d="M165 635 V555 M310 635 V545 M455 635 V555"/><path d="M165 575 l-25 -18 M165 575 l25 -18 M310 565 l-25 -18 M310 565 l25 -18 M455 575 l-25 -18 M455 575 l25 -18"/></g>
<g stroke="#2563eb" stroke-width="7" fill="none"><path d="M85 525 H530"/><path d="M165 525 V548 M310 525 V538 M455 525 V548"/></g>
<g fill="#2563eb"><circle cx="165" cy="552" r="5"/><circle cx="310" cy="542" r="5"/><circle cx="455" cy="552" r="5"/></g>
<text x="310" y="690" text-anchor="middle" font-family="Arial" font-size="17" fill="#1f2937">Emitters deliver small amounts near plant roots.</text>
<g stroke="#8b5e3c" stroke-width="7" fill="none"><path d="M670 520 H1110"/></g>
<g stroke="#16a34a" stroke-width="6" fill="none"><path d="M760 515 V465 M890 515 V455 M1020 515 V465"/><path d="M760 480 l-20 -15 M760 480 l20 -15 M890 470 l-20 -15 M890 470 l20 -15 M1020 480 l-20 -15 M1020 480 l20 -15"/></g>
<g stroke="#2563eb" stroke-width="9" fill="none"><path d="M680 620 H1100"/></g>
<g stroke="#2563eb" stroke-width="4" fill="none"><path d="M760 615 V565 M890 615 V555 M1020 615 V565"/></g>
<g fill="#2563eb"><circle cx="760" cy="565" r="5"/><circle cx="890" cy="555" r="5"/><circle cx="1020" cy="565" r="5"/></g>
<text x="890" y="690" text-anchor="middle" font-family="Arial" font-size="17" fill="#1f2937">Water is supplied below the surface to the root zone.</text>
</svg>