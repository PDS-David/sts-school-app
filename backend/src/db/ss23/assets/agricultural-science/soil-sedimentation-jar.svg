<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Soil sedimentation jar demonstration</title>
  <desc id="desc">A clear jar containing water and settled soil layers. From bottom to top the layers are sand, silt, clay and water, with light organic fragments floating near the surface. Labels explain that larger particles settle first.</desc>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#243447">Soil Sedimentation Jar</text>
  <text x="480" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#425466">A classroom model of particle settling — not a laboratory measurement</text>
  <rect x="250" y="145" width="310" height="410" rx="28" fill="#f8fbff" stroke="#34495e" stroke-width="8"/>
  <rect x="259" y="164" width="292" height="380" rx="18" fill="#dceef7"/>
  <path d="M259 490 Q330 480 405 490 T551 490 L551 544 L259 544 Z" fill="#b98543"/>
  <path d="M259 430 Q330 422 405 430 T551 430 L551 490 Q480 482 405 490 T259 490 Z" fill="#b7a18a"/>
  <path d="M259 386 Q330 378 405 386 T551 386 L551 430 Q480 422 405 430 T259 430 Z" fill="#9c8bb5"/>
  <path d="M259 164 L551 164 L551 386 Q480 378 405 386 T259 386 Z" fill="#c9e4f0" opacity="0.65"/>
  <g fill="#6b4d2e">
    <circle cx="310" cy="512" r="5"/><circle cx="345" cy="525" r="4"/><circle cx="385" cy="507" r="6"/><circle cx="432" cy="529" r="4"/><circle cx="478" cy="512" r="5"/><circle cx="518" cy="528" r="4"/>
  </g>
  <g fill="#5b493c">
    <circle cx="328" cy="454" r="2.5"/><circle cx="368" cy="466" r="2"/><circle cx="412" cy="447" r="2.5"/><circle cx="458" cy="464" r="2"/><circle cx="505" cy="449" r="2.5"/>
  </g>
  <g fill="#5b493c">
    <circle cx="296" cy="190" r="4"/><circle cx="330" cy="181" r="3"/><circle cx="520" cy="197" r="4"/><circle cx="493" cy="184" r="2.5"/>
  </g>
  <g stroke="#34495e" stroke-width="3" fill="none">
    <path d="M560 220 H650"/><path d="M560 405 H650"/><path d="M560 460 H650"/><path d="M560 520 H650"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#243447">
    <text x="670" y="214" font-size="23" font-weight="700">Water</text>
    <text x="670" y="246" font-size="16">Fine particles may remain suspended.</text>
    <text x="670" y="399" font-size="23" font-weight="700">Clay</text>
    <text x="670" y="454" font-size="23" font-weight="700">Silt</text>
    <text x="670" y="514" font-size="23" font-weight="700">Sand</text>
    <text x="670" y="545" font-size="16">Coarser particles settle first.</text>
  </g>
  <path d="M270 174 C220 120 190 150 170 182" stroke="#8b6b3f" stroke-width="3" fill="none" stroke-dasharray="7 6"/>
  <text x="55" y="122" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#243447">Floating organic</text>
  <text x="55" y="147" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#243447">fragments</text>
  <text x="480" y="602" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#52606d">Layer thickness varies with the sample, preparation and settling time.</text>
</svg>
