<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 570" role="img" aria-labelledby="t d">
<title id="t">Nutrient and water cycles in agriculture</title><desc id="d">Original teaching schematic with separate nitrogen, carbon and water cycle panels showing major stores and transformations.</desc>
<rect width="1140" height="570" fill="#fbfaf4"/><text x="40" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263b2e">Nitrogen, carbon and water cycles</text>
<text x="40" y="68" font-family="Arial,sans-serif" font-size="14" fill="#526256">Simplified teaching diagrams: arrows show major pathways, not every reaction or loss pathway.</text>
<g font-family="Arial,sans-serif" stroke-width="2">
<rect x="30" y="95" width="345" height="415" rx="14" fill="#eef2e6" stroke="#8a9a7a"/><text x="202" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#263b2e" stroke="none">Nitrogen cycle</text>
<rect x="115" y="155" width="175" height="48" rx="8" fill="#d6e4ef" stroke="#6689a1"/><text x="202" y="185" text-anchor="middle" font-size="16" fill="#263b2e" stroke="none">Atmospheric N2</text>
<rect x="50" y="245" width="125" height="52" rx="8" fill="#e1e9d2" stroke="#7e9a67"/><text x="112" y="276" text-anchor="middle" font-size="14" fill="#263b2e" stroke="none">Soil NH4+</text>
<rect x="200" y="245" width="125" height="52" rx="8" fill="#e1e9d2" stroke="#7e9a67"/><text x="262" y="276" text-anchor="middle" font-size="14" fill="#263b2e" stroke="none">Soil NO3-</text>
<rect x="115" y="355" width="175" height="52" rx="8" fill="#dbe9d1" stroke="#6c965b"/><text x="202" y="386" text-anchor="middle" font-size="15" fill="#263b2e" stroke="none">Plant uptake</text>
<path d="M150 203L112 245M252 203L262 245M175 271H200M262 297L235 355M112 297L165 355M202 407V448" stroke="#385b43" fill="none"/><text x="202" y="470" text-anchor="middle" font-size="13" fill="#526256" stroke="none">Decomposition returns N; microbes transform forms.</text><text x="202" y="489" text-anchor="middle" font-size="13" fill="#526256" stroke="none">Denitrification can return N2 to air.</text>
<rect x="397" y="95" width="345" height="415" rx="14" fill="#f2eee4" stroke="#b4a47d"/><text x="569" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#263b2e" stroke="none">Carbon cycle</text>
<rect x="485" y="155" width="170" height="48" rx="8" fill="#d6e4ef" stroke="#6689a1"/><text x="570" y="185" text-anchor="middle" font-size="16" fill="#263b2e" stroke="none">Atmospheric CO2</text>
<rect x="425" y="255" width="125" height="52" rx="8" fill="#dbe9d1" stroke="#6c965b"/><text x="487" y="286" text-anchor="middle" font-size="14" fill="#263b2e" stroke="none">Plants</text>
<rect x="590" y="255" width="125" height="52" rx="8" fill="#e5dbc6" stroke="#9b8156"/><text x="652" y="286" text-anchor="middle" font-size="14" fill="#263b2e" stroke="none">Animals</text>
<rect x="485" y="365" width="170" height="52" rx="8" fill="#d9dfd0" stroke="#7c8d6c"/><text x="570" y="396" text-anchor="middle" font-size="15" fill="#263b2e" stroke="none">Soil organic carbon</text>
<path d="M535 203L487 255M570 203V245M550 281H590M652 307L620 365M487 307L520 365M570 417V450" stroke="#805f3c" fill="none"/><text x="570" y="470" text-anchor="middle" font-size="13" fill="#526256" stroke="none">Photosynthesis stores C; respiration and</text><text x="570" y="489" text-anchor="middle" font-size="13" fill="#526256" stroke="none">decomposition return CO2; some C is stored.</text>
<rect x="764" y="95" width="345" height="415" rx="14" fill="#eaf2f4" stroke="#7d9eaa"/><text x="936" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#263b2e" stroke="none">Water cycle</text>
<rect x="852" y="155" width="170" height="48" rx="8" fill="#d6e4ef" stroke="#6689a1"/><text x="937" y="185" text-anchor="middle" font-size="16" fill="#263b2e" stroke="none">Atmospheric vapour</text>
<rect x="790" y="255" width="125" height="52" rx="8" fill="#dbe9d1" stroke="#6c965b"/><text x="852" y="286" text-anchor="middle" font-size="14" fill="#263b2e" stroke="none">Rainfall</text>
<rect x="952" y="255" width="125" height="52" rx="8" fill="#d3e6ef" stroke="#6689a1"/><text x="1014" y="286" text-anchor="middle" font-size="14" fill="#263b3e" stroke="none">Surface water</text>
<rect x="852" y="365" width="170" height="52" rx="8" fill="#d8dfd0" stroke="#7c8d6c"/><text x="937" y="396" text-anchor="middle" font-size="15" fill="#263b2e" stroke="none">Soil / groundwater</text>
<path d="M900 203L852 255M937 203V245M915 281H952M1014 307L980 365M852 307L900 365M937 417V450" stroke="#287fa4" fill="none"/><text x="937" y="470" text-anchor="middle" font-size="13" fill="#526256" stroke="none">Infiltration and percolation recharge soil</text><text x="937" y="489" text-anchor="middle" font-size="13" fill="#526256" stroke="none">water; evaporation and transpiration return it.</text>
</g>
<text x="570" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526256">Runoff, leaching and gaseous losses are distinct pathways; their rates depend on site conditions and management.</text>
</svg>