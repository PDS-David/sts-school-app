ight="36" fill="none" stroke="#1b2a33" stroke-width="2"/><text x="32" y="238" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Motor van</text><text x="510" y="238" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">3,200</text><text x="686" y="238" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33"></text><rect x="24" y="249" width="672" height="36" fill="none" stroke="#1b2a33" stroke-width="2"/><text x="32" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Salary</text><text x="510" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">400</text><text x="686" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33"></text><rect x="24" y="285" width="672" height="36" fill="none" stroke="#1b2a33" stroke-width="2"/><text x="32" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Wages</text><text x="510" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">200</text><text x="686" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33"></text><rect x="24" y="321" width="672" height="36" fill="none" stroke="#1b2a33" stroke-width="2"/><text x="32" y="346" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Cash</text><text x="510" y="346" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">6,150</text><text x="686" y="346" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33"></text><rect x="24" y="357" width="672" height="36" fill="none" stroke="#1b2a33" stroke-width="2"/><text x="32" y="382" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33" font-weight="bold">Total</text><text x="510" y="382" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33" font-weight="bold">9,950</text><text x="686" y="382" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33" font-weight="bold">9,950</text><line x1="344" y1="105" x2="344" y2="393" stroke="#1b2a33" stroke-width="2"/><line x1="520" y1="105" x2="520" y2="393" stroke="#1b2a33" stroke-width="2"/><text x="24" y="427" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1b2a33">Dr: 3,200 + 400 + 200 + 6,150 = 9,950.   Cr: 950 + 9,000 =</text><text x="24" y="453" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1b2a33">9,950.   Balanced.</text><rect x="24" y="471" width="672" height="90" fill="#fff6f3" stroke="#a4260f" stroke-width="2"/><text x="38" y="499" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#a4260f">Source date conflict (kept as printed): the question says "as</text><text x="38" y="525" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#a4260f">at July, 2005"; the title says "as at 30 July, 2008". The year</text><text x="38" y="551" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#a4260f">is not recoverable; the figures are unaffected.</text><text x="24" y="590" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">Redrawn for the app from the original note; sides, headings and amounts</text><text x="24" y="613" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">copied from it.</text></svg>