<svg xmlns="http://www.w3.org/2000/svg" width="720" height="402" viewBox="0 0 720 402"><rect width="720" height="402" fill="#ffffff"/><text x="24" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" text-anchor="start" fill="#1b2a33" font-weight="bold">Simple tabulation: a table of 5 columns and 3 rows</text><text x="24" y="79" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">The original lesson says "The table above has 5 columns and 3</text><text x="24" y="102" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">rows".</text><line x1="24" y1="130" x2="624" y2="130" stroke="#1b2a33" stroke-width="2"/><line x1="24" y1="184" x2="624" y2="184" stroke="#1b2a33" stroke-width="2"/><line x1="24" y1="238" x2="624" y2="238" stroke="#1b2a33" stroke-width="2"/><line x1="24" y1="292" x2="624" y2="292" stroke="#1b2a33" stroke-width="2"/><line x1="24" y1="130" x2="24" y2="292" stroke="#1b2a33" stroke-width="2"/><line x1="144" y1="130" x2="144" y2="292" stroke="#1b2a33" stroke-width="2"/><line x1="264" y1="130" x2="264" y2="292" stroke="#1b2a33" stroke-width="2"/><line x1="384" y1="130" x2="384" y2="292" stroke="#1b2a33" stroke-width="2"/><line x1="504" y1="130" x2="504" y2="292" stroke="#1b2a33" stroke-width="2"/><line x1="624" y1="130" x2="624" y2="292" stroke="#1b2a33" stroke-width="2"/><text x="84.0" y="124" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#6b7780">Column 1</text><text x="204.0" y="124" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#6b7780">Column 2</text><text x="324.0" y="124" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#6b7780">Column 3</text><text x="444.0" y="124" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#6b7780">Column 4</text><text x="564.0" y="124" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#6b7780">Column 5</text><text x="8" y="163" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">1</text><text x="8" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">2</text><text x="8" y="271" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">3</text><text x="24" y="330" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="start" fill="#6b7780">Count columns across (5) and rows down (3). The cells are empty in the</text><text x="24" y="354" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="start" fill="#6b7780">original.</text><text x="24" y="378" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="start" fill="#6b7780">Redrawn from the empty table in the original document (5 x 3).</text></svg>