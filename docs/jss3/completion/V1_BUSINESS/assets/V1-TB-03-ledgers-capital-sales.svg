<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620"><rect width="720" height="620" fill="#ffffff"/><text x="24" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" text-anchor="start" fill="#1b2a33" font-weight="bold">Ledger accounts (1): Capital and Sales</text><text x="24" y="79" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">Madam Cash Nig. Ltd. Items are posted, balanced, then carried</text><text x="24" y="102" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">down (c/d) and brought down (b/d).</text><text x="360" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#1b2a33" font-weight="bold">Capital Account</text><text x="28" y="156" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="start" fill="#6b7780">Dr</text><text x="692" y="156" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="end" fill="#6b7780">Cr</text><line x1="24" y1="160" x2="696" y2="160" stroke="#1b2a33" stroke-width="3"/><line x1="360" y1="160" x2="360" y2="272" stroke="#1b2a33" stroke-width="3"/><text x="34" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Bal. c/d</text><text x="348" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">950</text><text x="370" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">July 1</text><text x="460" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Cash</text><text x="684" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">950</text><text x="348" y="220" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33" font-weight="bold">950</text><li