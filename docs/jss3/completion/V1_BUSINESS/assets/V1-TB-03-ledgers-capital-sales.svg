" font-size="19" text-anchor="end" fill="#1b2a33">7,000</text><text x="370" y="378" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">July 14</text><text x="460" y="378" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Cash</text><text x="684" y="378" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">2,000</text><text x="348" y="412" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33" font-weight="bold">9,000</text><line x1="260" y1="390" x2="352" y2="390" stroke="#1b2a33" stroke-width="2"/><line x1="260" y1="417" x2="352" y2="417" stroke="#1b2a33" stroke-width="2"/><line x1="260" y1="421" x2="352" y2="421" stroke="#1b2a33" stroke-width="2"/><text x="684" y="412" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33" font-weight="bold">9,000</text><line x1="596" y1="390" x2="688" y2="390" stroke="#1b2a33" stroke-width="2"/><line x1="596" y1="417" x2="688" y2="417" stroke="#1b2a33" stroke-width="2"/><line x1="596" y1="421" x2="688" y2="421" stroke="#1b2a33" stroke-width="2"/><text x="460" y="446" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Bal. b/d</text><text x="684" y="446" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">9,000</text><rect x="24" y="480" width="672" height="64" fill="#f2f8fc" stroke="#14527a" stroke-width="2"/><text x="38" y="508" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#14527a">Both accounts have credit balances: capital is owed to the</text><text x="38" y="534" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#14527a">owner; sales are income.</text><text x="24" y="573" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">