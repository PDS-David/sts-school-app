<svg xmlns="http://www.w3.org/2000/svg" width="720" height="436" viewBox="0 0 720 436"><rect width="720" height="436" fill="#ffffff"/><text x="24" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" text-anchor="start" fill="#1b2a33" font-weight="bold">Double entry: the Dr / Cr layout</text><text x="24" y="79" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">Original Week 5 layout: Dr on the left, Cr on the right, N =</text><text x="24" y="102" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">naira amounts.</text><text x="28" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" text-anchor="start" fill="#1b2a33" font-weight="bold">Dr</text><text x="692" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" text-anchor="end" fill="#1b2a33" font-weight="bold">Cr</text><line x1="24" y1="162" x2="696" y2="162" stroke="#1b2a33" stroke-width="3"/><line x1="360" y1="162" x2="360" y2="242" stroke="#1b2a33" stroke-width="3"/><text x="340" y="196" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" text-anchor="end" fill="#1b2a33">N</text><text x="676" y="196" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" text-anchor="end" fill="#1b2a33">N</text><text x="24" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1b2a33">Rule from the note: credit the giver (Cr) and debit the</text><text x="24" y="306" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1b2a33">receiver (Dr).</text><text x="24" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1b2a33">Every debit entry has a matching credit entry in another</text><text x="24" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1b2a33">account.</text><text x="24" y="389" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">Redrawn for the app from the original note; sides, headings and amounts</text><text x="24" y="412" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">copied from it.</text></svg>