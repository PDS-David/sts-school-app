<svg xmlns="http://www.w3.org/2000/svg" width="720" height="711" viewBox="0 0 720 711"><rect width="720" height="711" fill="#ffffff"/><text x="24" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" text-anchor="start" fill="#1b2a33" font-weight="bold">Trial balance: second method (corrected)</text><text x="24" y="79" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">Given balances: Building 2000, Capital 2000, Equipment 5000,</text><text x="24" y="102" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">Stock of finished goods 1000, Motor van 3000, Creditor 7000,</text><text x="24" y="125" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">Accrued 2000.</text><rect x="24" y="151" width="672" height="36" fill="#e9eff3" stroke="#1b2a33" stroke-width="2"/><text x="32" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33" font-weight="bold">Particulars</text><text x="510" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33" font-weight="bold">Dr  N</text><text x="686" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33" font-weight="bold">Cr  N</text><rect x="24" y="187" width="672" height="36" fill="none" stroke="#1b2a33" stroke-width="2"/><text x="32" y="212" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Building</text><text x="510" y="212" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">2,000</text><text x="686" y="212" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33"></text><rect x="24" y="223" width="672" height="36" fill="none" stroke="#1b2a33" stroke-width="2"/><text x="32" y="248" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Capital</text><text x="510" y="248" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33"></text><text x="686" y="248" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">2,000</text><rect x="24" y="259" width="672" height="36" fill="none" stroke="#1b2a33" stroke-width="2"/><text x="32" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Equipment</text><text x="510" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">5,000</text><text x="686" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33"></text><rect x="24" y="295" width="672" height="36" fill="none" stroke="#1b2a33" stroke-width="2"/><text x="32" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Stock</text><text x="510" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">1,000</text><text x="686" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33"></text><rect x="24" y="331" width="672" height="36" fill="none" stroke="#1b2a33" stroke-width="2"/><text x="32" y="356" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Motor van</text><text x="510" y="356" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">3,000</text><text x="686" y="356" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33"></text><rect x="24" y="367" width="672" height="36" fill="none" stroke="#1b2a33" stroke-width="2"/><text x="32" y="392" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Creditor</text><text x="510" y="392" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33"></text><text x="686" y="392" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">7,000</text><rect x="24" y="403" width="672" height="36" fill="none" stroke="#1b2a33" stroke-width="2"/><text x="32" y="428" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Accrued</text><text x="510" y="428" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33"></text><text x="686" y="428" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">2,000</text><rect x="24" y="439" width="672" height="36" fill="none" stroke="#1b2a33" stroke-width="2"/><text x="32" y="464" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33" font-weight="bold">Total</text><text x="510" y="464" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33" font-weight="bold">11,000</text><text x="686" y="464" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33" font-weight="bold">11,000</text><line x1="344" y1="151" x2="344" y2="475" stroke="#1b2a33" stroke-width="2"/><line x1="520" y1="151" x2="520" y2="475" stroke="#1b2a33" stroke-width="2"/><rect x="24" y="493" width="672" height="142" fill="#fff6f3" stroke="#a4260f" stroke-width="2"/><text x="38" y="521" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#a4260f" font-weight="bold">CORRECTED: the original table lost the label "Building". Its</text><text x="38" y="547" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#a4260f">2000 sits in the heading row (under "Particular"), so the Dr</text><text x="38" y="573" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#a4260f">column adds to only 9,000 but is printed as 11,000. With</text><text x="38" y="599" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#a4260f">Building restored: Dr 2,000 + 5,000 + 1,000 + 3,000 = 11,000</text><text x="38" y="625" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#a4260f">and Cr 2,000 + 7,000 + 2,000 = 11,000.</text><text x="24" y="664" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">Assets and expenses are debits. Liabilities and capital are credits.</text><text x="24" y="687" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">Correction prepared for teaching; the original note is kept unchanged.</text></svg>