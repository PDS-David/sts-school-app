<svg xmlns="http://www.w3.org/2000/svg" width="720" height="518" viewBox="0 0 720 518"><rect width="720" height="518" fill="#ffffff"/><text x="24" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" text-anchor="start" fill="#1b2a33" font-weight="bold">Worked example 4: books sold for cash</text><text x="24" y="79" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">Original: "sold books for cash N10,000" (the date is printed Jan</text><text x="24" y="102" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">10 in both accounts).</text><text x="360" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#1b2a33" font-weight="bold">Cash Account</text><text x="28" y="156" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="start" fill="#6b7780">Dr</text><text x="692" y="156" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="end" fill="#6b7780">Cr</text><line x1="24" y1="160" x2="696" y2="160" stroke="#1b2a33" stroke-width="3"/><line x1="360" y1="160" x2="360" y2="238" stroke="#1b2a33" stroke-width="3"/><text x="34" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Jan 10</text><text x="124" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Sales</text><text x="348" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">10,000</text><text x="360" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#1b2a33" font-weight="bold">Sales Account</text><text x="28" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="start" fill="#6b7780">Dr</text><text x="692" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="end" fill="#6b7780">Cr</text><line x1="24" y1="284" x2="696" y2="284" stroke="#1b2a33" stroke-width="3"/><line x1="360" y1="284" x2="360" y2="362" stroke="#1b2a33" stroke-width="3"/><text x="370" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Jan 10</text><text x="460" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Cash</text><text x="684" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">10,000</text><rect x="24" y="378" width="672" height="64" fill="#f2f8fc" stroke="#14527a" stroke-width="2"/><text x="38" y="406" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#14527a">Cash receives money: debit. Sales gives the goods: credit. The</text><text x="38" y="432" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#14527a">note types "Janlo" in the sentence; both accounts show Jan 10.</text><text x="24" y="471" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">Redrawn for the app from the original note; sides, headings and amounts</text><text x="24" y="494" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">copied from it.</text></svg>