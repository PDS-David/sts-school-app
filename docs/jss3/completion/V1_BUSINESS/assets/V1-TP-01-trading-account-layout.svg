<svg xmlns="http://www.w3.org/2000/svg" width="720" height="762" viewBox="0 0 720 762"><rect width="720" height="762" fill="#ffffff"/><text x="24" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" text-anchor="start" fill="#1b2a33" font-weight="bold">Simple layout of a Trading Account</text><text x="24" y="79" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">*** = an amount to be filled in (as in the original). Debit side</text><text x="24" y="102" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">left, credit side right.</text><text x="360" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#1b2a33" font-weight="bold">Trading Account</text><text x="28" y="156" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="start" fill="#6b7780">Dr</text><text x="692" y="156" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="end" fill="#6b7780">Cr</text><line x1="24" y1="160" x2="696" y2="160" stroke="#1b2a33" stroke-width="3"/><line x1="360" y1="160" x2="360" y2="494" stroke="#1b2a33" stroke-width="3"/><text x="34" y="188" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Opening stock</text><text x="348" y="188" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="370" y="188" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Sales</text><text x="684" y="188" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="34" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Add: purchases</text><text x="348" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="370" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Less: sales return</text><text x="684" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">**</text><text x="348" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="370" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Net sales</text><text x="684" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="34" y="296" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Less: return outward</text><text x="348" y="296" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">**</text><text x="34" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Cost of goods available</text><text x="348" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="34" y="368" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Less: closing stock</text><text x="348" y="368" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="34" y="404" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Cost of goods sold</text><text x="348" y="404" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="34" y="440" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Gross profit c/d</text><text x="348" y="440" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="348" y="476" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33" font-weight="bold">***</text><line x1="260" y1="454" x2="352" y2="454" stroke="#1b2a33" stroke-width="2"/><line x1="260" y1="481" x2="352" y2="481" stroke="#1b2a33" stroke-width="2"/><line x1="260" y1="485" x2="352" y2="485" stroke="#1b2a33" stroke-width="2"/><text x="684" y="476" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33" font-weight="bold">***</text><line x1="596" y1="454" x2="688" y2="454" stroke="#1b2a33" stroke-width="2"/><line x1="596" y1="481" x2="688" y2="481" stroke="#1b2a33" stroke-width="2"/><line x1="596" y1="485" x2="688" y2="485" stroke="#1b2a33" stroke-width="2"/><text x="24" y="526" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1b2a33">Gross profit = net sales - cost of goods sold. It is carried</text><text x="24" y="552" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1b2a33">down (c/d).</text><rect x="24" y="570" width="672" height="116" fill="#f2f8fc" stroke="#14527a" stroke-width="2"/><text x="38" y="598" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#14527a">Wording in the original: this layout says "sales return"; the</text><text x="38" y="624" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#14527a">notes above it define the same item as "Return inward".</text><text x="38" y="650" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#14527a">Carriage inward is defined in the notes but has no line in this</text><text x="38" y="676" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#14527a">simple layout. Both are left as printed.</text><text x="24" y="715" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">Redrawn for the app from the original note; sides, headings and amounts</text><text x="24" y="738" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">copied from it.</text></svg>