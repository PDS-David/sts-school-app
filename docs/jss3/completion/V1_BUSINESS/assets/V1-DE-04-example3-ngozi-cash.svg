<svg xmlns="http://www.w3.org/2000/svg" width="720" height="469" viewBox="0 0 720 469"><rect width="720" height="469" fill="#ffffff"/><text x="24" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" text-anchor="start" fill="#1b2a33" font-weight="bold">Worked example 3: paying a creditor</text><text x="24" y="79" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">Original: "Jan 4th paid A. Ngozi N500 by cash".</text><text x="360" y="127" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#1b2a33" font-weight="bold">A. Ngozi Account</text><text x="28" y="133" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="start" fill="#6b7780">Dr</text><text x="692" y="133" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="end" fill="#6b7780">Cr</text><line x1="24" y1="137" x2="696" y2="137" stroke="#1b2a33" stroke-width="3"/><line x1="360" y1="137" x2="360" y2="215" stroke="#1b2a33" stroke-width="3"/><text x="34" y="163" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Jan 4</text><text x="124" y="163" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Cash</text><text x="348" y="163" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">500</text><text x="360" y="251" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#1b2a33" font-weight="bold">Cash Account</text><text x="28" y="257" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="start" fill="#6b7780">Dr</text><text x="692" y="257" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="end" fill="#6b7780">Cr</text><line x1="24" y1="261" x2="696" y2="261" stroke="#1b2a33" stroke-width="3"/><line x1="360" y1="261" x2="360" y2="339" stroke="#1b2a33" stroke-width="3"/><text x="370" y="287" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Jan 4</text><text x="460" y="287" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">A. Ngozi</text><text x="684" y="287" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">500</text><rect x="24" y="355" width="672" height="38" fill="#f2f8fc" stroke="#14527a" stroke-width="2"/><text x="38" y="383" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#14527a">Ngozi receives the payment: debit. Cash gives it: credit.</text><text x="24" y="422" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">Redrawn for the app from the original note; sides, headings and amounts</text><text x="24" y="445" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">copied from it.</text></svg>