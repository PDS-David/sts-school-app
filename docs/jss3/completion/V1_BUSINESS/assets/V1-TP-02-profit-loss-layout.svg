<svg xmlns="http://www.w3.org/2000/svg" width="720" height="607" viewBox="0 0 720 607"><rect width="720" height="607" fill="#ffffff"/><text x="24" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" text-anchor="start" fill="#1b2a33" font-weight="bold">Simple layout of a Profit and Loss Account</text><text x="24" y="79" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">*** = an amount to be filled in (as in the original).</text><text x="360" y="127" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#1b2a33" font-weight="bold">Profit and Loss Account</text><text x="28" y="133" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="start" fill="#6b7780">Dr</text><text x="692" y="133" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="end" fill="#6b7780">Cr</text><line x1="24" y1="137" x2="696" y2="137" stroke="#1b2a33" stroke-width="3"/><line x1="360" y1="137" x2="360" y2="471" stroke="#1b2a33" stroke-width="3"/><text x="34" y="165" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Wages and expenses</text><text x="348" y="165" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="370" y="165" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Gross profit b/d</text><text x="684" y="165" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="34" y="201" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">General expenses</text><text x="348" y="201" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="370" y="201" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Add: discount received</text><text x="684" y="201" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="34" y="237" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Advertising</text><text x="348" y="237" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="684" y="237" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="34" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Electricity</text><text x="348" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="34" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Office expenses</text><text x="348" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="34" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Discount allowed</text><text x="348" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="348" y="381" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="34" y="417" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Net profit</text><text x="348" y="417" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">***</text><text x="348" y="453" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33" font-weight="bold">***</text><line x1="260" y1="431" x2="352" y2="431" stroke="#1b2a33" stroke-width="2"/><line x1="260" y1="458" x2="352" y2="458" stroke="#1b2a33" stroke-width="2"/><line x1="260" y1="462" x2="352" y2="462" stroke="#1b2a33" stroke-width="2"/><text x="684" y="453" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33" font-weight="bold">***</text><line x1="596" y1="431" x2="688" y2="431" stroke="#1b2a33" stroke-width="2"/><line x1="596" y1="458" x2="688" y2="458" stroke="#1b2a33" stroke-width="2"/><line x1="596" y1="462" x2="688" y2="462" stroke="#1b2a33" stroke-width="2"/><text x="24" y="503" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1b2a33">Net profit = gross profit + other income (discount received) -</text><text x="24" y="529" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1b2a33">expenses.</text><text x="24" y="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">Redrawn for the app from the original note; sides, headings and amounts</text><text x="24" y="583" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">copied from it.</text></svg>