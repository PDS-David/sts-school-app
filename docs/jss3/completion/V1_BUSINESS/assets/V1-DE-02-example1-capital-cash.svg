<svg xmlns="http://www.w3.org/2000/svg" width="720" height="570" viewBox="0 0 720 570"><rect width="720" height="570" fill="#ffffff"/><text x="24" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" text-anchor="start" fill="#1b2a33" font-weight="bold">Worked example 1: Ade starts a business</text><text x="24" y="79" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">Original: "On January 5, 2010, Ade started a business with N5000</text><text x="24" y="102" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#6b7780">cash".</text><text x="360" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#1b2a33" font-weight="bold">Capital Account</text><text x="28" y="156" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="start" fill="#6b7780">Dr</text><text x="692" y="156" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="end" fill="#6b7780">Cr</text><line x1="24" y1="160" x2="696" y2="160" stroke="#1b2a33" stroke-width="3"/><line x1="360" y1="160" x2="360" y2="238" stroke="#1b2a33" stroke-width="3"/><text x="370" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Jan. 5</text><text x="460" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Cash</text><text x="684" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">5000</text><text x="360" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#1b2a33" font-weight="bold">Cash Account</text><text x="28" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="start" fill="#6b7780">Dr</text><text x="692" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" text-anchor="end" fill="#6b7780">Cr</text><line x1="24" y1="284" x2="696" y2="284" stroke="#1b2a33" stroke-width="3"/><line x1="360" y1="284" x2="360" y2="362" stroke="#1b2a33" stroke-width="3"/><text x="34" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Jan. 2</text><text x="124" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1b2a33">Capital</text><text x="348" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="end" fill="#1b2a33">5000</text><rect x="24" y="378" width="672" height="116" fill="#fff6f3" stroke="#a4260f" stroke-width="2"/><text x="38" y="406" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#a4260f">Source date mismatch (kept as printed): the Capital Account</text><text x="38" y="432" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#a4260f">says Jan. 5, the Cash Account says Jan. 2. The sides and the</text><text x="38" y="458" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#a4260f">amount are right. Capital is credited (the giver); Cash is</text><text x="38" y="484" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#a4260f">debited (the receiver). The intended date is not recoverable.</text><text x="24" y="523" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">Redrawn for the app from the original note; sides, headings and amounts</text><text x="24" y="546" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6b7780">copied from it.</text></svg>