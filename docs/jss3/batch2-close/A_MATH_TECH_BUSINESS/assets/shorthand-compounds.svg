<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010"><rect width="1200" height="1010" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#15364a"><text x="45" y="55" font-size="32">Shorthand: six compound-sign groups</text><text x="45" y="95" font-size="20">Original isolated-sign practice chart. Baselines are grey; strokes are black.</text><g transform="translate(45 160)"><text x="0" y="30" font-size="29">KW</text><g transform="translate(190 0)"><path d="M 55 40 H 215" stroke="#abb7bd" stroke-width="1"/><path d="M 100 0 C 65 0 65 38 95 38 L 190 38" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/></g><text x="470" y="27" font-size="23">large hook + light K; left to right</text></g><g transform="translate(45 275)"><text x="0" y="30" font-size="29">GW</text><g transform="translate(190 0)"><path d="M 55 40 H 215" stroke="#abb7bd" stroke-width="1"/><path d="M 100 0 C 65 0 65 38 95 38 L 190 38" fill="none" stroke="black" stroke-width="7" stroke-linecap="round"/></g><text x="470" y="27" font-size="23">large hook + heavy G; left to right</text></g><g transform="translate(45 390)"><text x="0" y="30" font-size="29">MP / MB</text><g transform="translate(190 0)"><path d="M 55 40 H 215" stroke="#abb7bd" stroke-width="1"/><path d="M 75 38 C 95 -5 170 -5 190 38" fill="none" stroke="black" stroke-width="7" stroke-linecap="round"/></g><text x="470" y="27" font-size="23">heavy M; left to right</text></g><g transform="translate(45 505)"><text x="0" y="30" font-size="29">LR</text><g transform="translate(190 0)"><path d="M 55 40 H 215" stroke="#abb7bd" stroke-width="1"/><path d="M 145 -8 C 90 -8 75 10 75 38" fill="none" stroke="black" stroke-width="7" stroke-linecap="round"/></g><text x="470" y="27" font-size="23">heavy downward L</text></g><g transform="translate(45 620)"><text x="0" y="30" font-size="29">RR</text><g transform="translate(190 0)"><path d="M 55 40 H 215" stroke="#abb7bd" stroke-width="1"/><path d="M 75 -8 C 130 -8 145 10 145 38" fill="none" stroke="black" stroke-width="7" stroke-linecap="round"/></g><text x="470" y="27" font-size="23">heavy downward R</text></g><g transform="translate(45 735)"><text x="0" y="30" font-size="29">WH</text><g transform="translate(190 0)"><path d="M 55 40 H 215" stroke="#abb7bd" stroke-width="1"/><path d="M 100 0 C 70 0 65 42 95 38 L 155 -10" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/></g><text x="470" y="27" font-size="23">large hook + rising W</text></g><text x="45" y="900" font-size="22">These signs are not complete word outlines. Keep vowel and position rules.</text><text x="45" y="942" font-size="19">Technical reference: CBSE Shorthand English XI, Unit 8 (pp. 102–107).</text><text x="45" y="975" font-size="19">New drawing for this lesson; not recovered school-source notation.</text></g></svg>